<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>MN HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Silkscreen&family=Montserrat:wght@400;500;700&family=Cinzel:wght@600;700&family=Yellowtail&family=Dancing+Script:wght@500&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Bebas+Neue&family=DM+Serif+Display&family=Space+Grotesk:wght@500;700&family=Archivo+Black&family=Caveat:wght@600&display=swap">
<style>
/* Layout: una barra de control fija arriba + tres vistas (Oficina = organigrama y flujos, Tareas = tablero, Studio = lista | teléfono | editor). Trama isométrica del monograma MN de fondo. */
:root{
  --bg:#0A0A0A; --surface:#121310; --surface-2:#1B1D18; --line:#2B2E26; --fg:#F3F3EF; --muted:#9A9E91;
  --accent:#C6FF3D; --accent-ink:#0A0A0A; --accent-text:#C6FF3D; --accent-soft:rgba(198,255,61,.12);
  --ok:#5BD69A; --warn:#FFB547; --danger:#FF6B5B; --screen:#0E100C; --grid:rgba(243,243,239,.035);
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --f-ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --f-pixel:"Silkscreen","JetBrains Mono",ui-monospace,monospace;
  --r:14px; --r-sm:9px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F3F3EF; --surface:#FFFFFF; --surface-2:#E9EAE3; --line:#D6D8CE; --fg:#0A0A0A; --muted:#5D6056;
  --accent:#C6FF3D; --accent-ink:#0A0A0A; --accent-text:#466100; --accent-soft:rgba(110,150,0,.12);
  --ok:#1E7A4C; --warn:#965700; --danger:#B3261E; --screen:#14160F; --grid:rgba(10,10,10,.04);
  --shadow:0 10px 30px rgba(20,22,15,.12); color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#F3F3EF; --surface:#FFFFFF; --surface-2:#E9EAE3; --line:#D6D8CE; --fg:#0A0A0A; --muted:#5D6056;
  --accent:#C6FF3D; --accent-ink:#0A0A0A; --accent-text:#466100; --accent-soft:rgba(110,150,0,.12);
  --ok:#1E7A4C; --warn:#965700; --danger:#B3261E; --screen:#14160F; --grid:rgba(10,10,10,.04);
  --shadow:0 10px 30px rgba(20,22,15,.12); color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-ui);margin:0;
  background-image:repeating-linear-gradient(30deg,var(--grid) 0 1px,transparent 1px 34px),repeating-linear-gradient(150deg,var(--grid) 0 1px,transparent 1px 34px);}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.82em}
.muted{color:var(--muted)}
.wrap{max-width:1360px;margin:0 auto;padding-inline:clamp(16px,3vw,32px)}

/* Barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:62px;flex-wrap:wrap;padding-block:8px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em;font-size:1.05rem}
.logo .mk{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:.9rem;letter-spacing:-.04em}
.logo small{display:block;font:500 .68rem/1 var(--f-mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;margin-left:auto}
.tab{border:0;background:transparent;padding:7px 16px;border-radius:999px;font-weight:600;font-size:.9rem;color:var(--muted);display:flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tab .n{font:600 .7rem/1 var(--f-mono);background:var(--danger);color:#fff;border-radius:99px;padding:3px 6px}
.tab[aria-selected="true"] .n{background:var(--accent-ink);color:var(--accent)}
.sync{font:500 .72rem/1 var(--f-mono);color:var(--muted);display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.06em}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.sync.on i{background:var(--ok)}
.banner{background:var(--accent-soft);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 14px;margin-top:16px;font-size:.9rem}

main{padding-block:24px 64px}
.view{display:grid;gap:28px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.02em}
h2{font-size:1.25rem;font-weight:700}
.eyebrow{font:500 .7rem/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-head p{margin:4px 0 0;color:var(--muted);max-width:62ch}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;font-weight:600;font-size:.86rem;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:.78rem}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 .72rem/1 var(--f-mono);padding:5px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.on{color:var(--fg)}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.chip.off .dot{background:var(--warn)}
.pill{font:600 .68rem/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:6px;white-space:nowrap}
.st-pendiente,.st-borrador{background:var(--surface-2);color:var(--muted)}
.st-en-curso{background:rgba(77,163,255,.16);color:#4DA3FF}
.st-para-aprobar{background:rgba(255,181,71,.16);color:var(--warn)}
.st-aprobado,.st-programado{background:var(--accent-soft);color:var(--accent-text)}
.st-hecho,.st-publicado{background:rgba(91,214,154,.15);color:var(--ok)}

/* ===== OFICINA ===== */
.hq-hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:stretch}
.hq-hero .intro{padding:4px 0}
.hq-hero h1{font-size:clamp(1.9rem,4vw,3rem);font-weight:800;line-height:1.02;letter-spacing:-.04em}
.hq-hero h1 em{font-style:normal;background:var(--accent);color:var(--accent-ink);padding:0 .18em;border-radius:.15em}
.hq-hero .intro p{color:var(--muted);max-width:52ch;margin:14px 0 0}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.stat b{font:800 2rem/1 var(--f-ui);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.stat.alert b{color:var(--warn)}

.org{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px clamp(14px,2.5vw,28px) 26px;overflow:hidden}
.org-top{display:flex;flex-direction:column;align-items:center}
.node-boss{display:flex;align-items:center;gap:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px 16px 10px 10px;cursor:pointer}
.node-boss.ceo{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.node-boss .t{display:flex;flex-direction:column}
.node-boss .t b{font-size:1rem}
.node-boss .t span{font:500 .7rem/1.3 var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.vline{width:2px;height:22px;background:var(--line)}
.depts{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;padding-top:22px}
.depts::before{content:"";position:absolute;top:0;left:10%;right:10%;height:2px;background:var(--line)}
.dept{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px 12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;cursor:pointer;transition:border-color .15s,transform .15s}
.dept::before{content:"";position:absolute;top:-23px;left:50%;width:2px;height:22px;background:var(--line)}
.dept:hover{border-color:var(--muted);transform:translateY(-2px)}
.dept .dname{font:400 .78rem/1 var(--f-pixel);letter-spacing:.04em;text-transform:uppercase}
.dept .aname{font-weight:600;font-size:.92rem}
.dept .tools{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.dept .tools .chip{font-size:.62rem;padding:4px 6px}
.state{font:500 .68rem/1 var(--f-mono);display:flex;align-items:center;gap:6px;color:var(--muted)}
.state i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.state.busy{color:var(--fg)}
.state.busy i{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
canvas.px{image-rendering:pixelated;display:block}
.dept.busy canvas.px{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.dept.busy canvas.px{animation:none}.dept,.dept:hover{transition:none;transform:none}}

.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px clamp(14px,2vw,22px)}
.flow-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.flow-tabs .btn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.flow{display:flex;flex-direction:column;gap:0;counter-reset:st}
.step{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:start;position:relative;padding-bottom:14px}
.step:not(:last-child)::after{content:"";position:absolute;left:21px;top:46px;bottom:2px;width:2px;background:repeating-linear-gradient(var(--line) 0 4px,transparent 4px 8px)}
.step .av{width:44px;height:44px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center}
.step .who{font:400 .72rem/1 var(--f-pixel);text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.step .act{font-weight:600;margin-top:3px}
.step .out{font:500 .74rem/1.4 var(--f-mono);color:var(--accent-text);margin-top:3px;word-break:break-word}
.step.you .av{border-color:var(--accent)}
.queue{display:flex;flex-direction:column;gap:8px}
.qitem{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;text-align:left;width:100%}
.qitem:hover{border-color:var(--muted)}
.qitem .l{min-width:0}
.qitem .l b{display:block;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qitem .l span{font:500 .7rem/1.3 var(--f-mono);color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:var(--r-sm);padding:16px;color:var(--muted);font-size:.88rem;text-align:center}
.asks{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.ask{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px}
.ask p{margin:0;font-size:.88rem}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:41;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 22px calc(28px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);display:flex;flex-direction:column;gap:18px}
.drawer .dh{display:flex;gap:14px;align-items:center}
.drawer h3{font-size:1.35rem}
.drawer dl{margin:0;display:grid;gap:12px}
.drawer dt{font:500 .68rem/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.drawer dd{margin:0;font-size:.92rem}
.x{margin-left:auto;border:1px solid var(--line);background:transparent;width:34px;height:34px;border-radius:50%;font-size:1.1rem;line-height:1}

/* ===== TAREAS ===== */
.newtask{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:end}
.newtask .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:5px;font:500 .7rem/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:0}
.inp{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;font:400 .92rem/1.4 var(--f-ui);color:var(--fg);text-transform:none;letter-spacing:0;width:100%;min-width:0}
textarea.inp{resize:vertical;min-height:70px}
.agentpick{display:flex;flex-wrap:wrap;gap:6px}
.agentpick label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:4px 10px 4px 4px;font:500 .78rem/1 var(--f-ui);text-transform:none;letter-spacing:0;color:var(--fg);cursor:pointer}
.agentpick input{position:absolute;opacity:0;pointer-events:none}
.agentpick label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.agentpick label:has(input:focus-visible){outline:2px solid var(--accent)}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
.col{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col h3{font-size:.9rem;display:flex;justify-content:space-between;align-items:center;padding:2px 4px}
.col h3 span{font:500 .75rem/1 var(--f-mono);color:var(--muted)}
.tcard{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.tcard b{font-size:.92rem;line-height:1.3}
.tcard p{margin:0;font-size:.82rem;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.tcard .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tcard .row{display:flex;justify-content:space-between;align-items:center;gap:6px}
.avs{display:flex}
.avs canvas{width:22px;height:22px;border-radius:6px;background:var(--surface-2);margin-right:-4px;border:1px solid var(--bg)}
.confirm{display:flex;gap:6px;align-items:center;font-size:.8rem}

/* ===== STUDIO ===== */
.studio{display:grid;grid-template-columns:270px minmax(0,1fr) 380px;gap:18px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.brands{display:flex;gap:6px;flex-wrap:wrap}
.bbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:4px 12px 4px 4px;font-weight:600;font-size:.82rem}
.bbtn[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.bav{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:800 .62rem/1 var(--f-ui);overflow:hidden;flex:none}
.bav img{width:100%;height:100%;object-fit:cover}
.plist{display:flex;flex-direction:column;gap:6px;max-height:520px;overflow-y:auto}
.pitem{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px;text-align:left;width:100%}
.pitem[aria-current="true"]{border-color:var(--accent)}
.pitem .th{display:block;width:44px;border-radius:6px;overflow:hidden}
.pitem b{display:block;font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .m{display:flex;gap:6px;align-items:center;margin-top:4px;flex-wrap:wrap}
.pitem .m span{font:500 .66rem/1 var(--f-mono);color:var(--muted)}

.stage{display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap;justify-content:center}
.seg button{border:0;background:transparent;border-radius:99px;padding:6px 12px;font-weight:600;font-size:.8rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.phone{width:min(370px,100%);background:#000;border-radius:44px;padding:11px;box-shadow:var(--shadow);border:1px solid var(--line)}
.ig{--ig-bg:#FFFFFF;--ig-fg:#0A0A0A;--ig-muted:#737373;--ig-line:#EFEFEF;background:var(--ig-bg);color:var(--ig-fg);border-radius:34px;overflow:hidden;font:14px/1.35 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:560px;display:flex;flex-direction:column}
.ig.dark{--ig-bg:#000000;--ig-fg:#F5F5F5;--ig-muted:#A8A8A8;--ig-line:#262626}
.ig-status{display:flex;justify-content:space-between;padding:12px 24px 6px;font-weight:600;font-size:.8rem}
.ig-bar{display:flex;align-items:center;justify-content:space-between;padding:6px 14px 8px;font-weight:700;font-size:1rem;border-bottom:1px solid var(--ig-line)}
.ig-h{display:flex;align-items:center;gap:9px;padding:9px 12px}
.ig-h .bav{width:32px;height:32px;box-shadow:0 0 0 2px var(--ig-bg),0 0 0 3.5px #D6249F}
.ig-h b{font-size:.84rem}
.ig-h small{display:block;color:var(--ig-muted);font-size:.72rem}
.ig-h .dots{margin-left:auto;font-weight:700;letter-spacing:1px}
.ig-media{position:relative}
.ig-acts{display:flex;align-items:center;gap:14px;padding:9px 12px 4px}
.ig-acts svg{width:24px;height:24px;stroke:var(--ig-fg);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ig-acts .sv{margin-left:auto}
.cdots{display:flex;gap:4px;position:absolute;left:50%;transform:translateX(-50%);bottom:-18px}
.cdots i{width:6px;height:6px;border-radius:50%;background:var(--ig-line)}
.cdots i.on{background:#0095F6}
.ig-cap{padding:4px 12px 14px;font-size:.84rem;overflow-wrap:anywhere}
.ig-cap .more{color:var(--ig-muted)}
.ig-cap .tags{color:#00376B}
.ig.dark .ig-cap .tags{color:#E0F1FF}
.ig-cap .when{display:block;color:var(--ig-muted);font-size:.68rem;margin-top:6px;text-transform:uppercase;letter-spacing:.02em}
.navbtn{position:absolute;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;border:0;background:rgba(255,255,255,.85);color:#111;font-weight:700;display:grid;place-items:center;z-index:3}
.navbtn.l{left:8px}.navbtn.r{right:8px}
/* perfil */
.ig-prof{padding:12px 14px 8px;display:grid;grid-template-columns:78px 1fr;gap:14px;align-items:center}
.ig-prof .bav{width:78px;height:78px;font-size:1.3rem}
.ig-prof .nums{display:flex;justify-content:space-around;text-align:center;font-size:.76rem}
.ig-prof .nums b{display:block;font-size:.95rem}
.ig-bio{padding:0 14px 12px;font-size:.8rem;white-space:pre-wrap}
.ig-bio b{display:block}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;border-top:1px solid var(--ig-line);padding-top:2px}
.gcell{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--ig-line)}
.gcell .slide{position:absolute;inset:0;aspect-ratio:auto;height:100%}
.gcell.cur::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 3px #C6FF3D}

const pending = new Map(); // id -> timer
const writing = new Map(); // id -> promise chain
function saveLater(coll, obj, ms = 600){
  obj.updatedAt = new Date().toISOString();
  const key = coll + '/' + obj.id;
  clearTimeout(pending.get(key));
  pending.set(key, setTimeout(() => { pending.delete(key); saveNow(coll, obj); }, ms));
}
function saveNow(coll, obj){
  if (!S.db) return Promise.resolve();
  const key = coll + '/' + obj.id;
  const body = clone(obj); delete body.id;
  const prev = writing.get(key) || Promise.resolve();
  const p = prev.then(() => S.db.collection(coll).doc(obj.id).set(body)).catch(e => onWriteErr(e));
  writing.set(key, p); p.finally(() => { if (writing.get(key) === p) writing.delete(key); });
  return p;
}
function removeDoc(coll, id){ if (!S.db) return; S.db.collection(coll).doc(id).delete().catch(onWriteErr); }
function onWriteErr(e){
  if (e && e.code === 'invalid_argument') { S.canWrite = false; showBanner('Tenés acceso de solo lectura: podés mirar todo, pero los cambios no se guardan.'); }
  else if (e && e.code === 'quota_exceeded') toast('No hay más espacio: borrá publicaciones viejas.');
  else toast('No se pudo guardar. Probá de nuevo en un momento.');
}
function showBanner(t){ const b = $('#banner'); b.textContent = t; b.hidden = false; }
function busyLocal(coll, id){ const k = coll + '/' + id; return pending.has(k) || writing.has(k); }

function subscribe(coll, key){
  S.db.collection(coll).onSnapshot(snap => {
    const incoming = snap.docs.map(d => normalize(coll, {id:d.id, ...clone(d.data())}));
    const local = Object.fromEntries(S[key].map(o => [o.id, o]));
    S[key] = incoming.map(o => busyLocal(coll, o.id) && local[o.id] ? local[o.id] : o);
    // conservar lo creado localmente que todavía no volvió
    for (const o of Object.values(local)) if (busyLocal(coll, o.id) && !S[key].some(x => x.id === o.id)) S[key].push(o);
    if (!S.live) { S.live = true; setSync(true); }
    const ae = document.activeElement;
    render(ae && ae.closest && ae.closest('#v-studio, #v-chat, #tform, #reqform, #drawer-root') && ae.matches('input,textarea,select') ? 'soft' : 'all');
  }, err => { setSync(false, 'Sin conexión'); });
}
function normalize(coll, o){
  if (coll === 'posts') { if (!Array.isArray(o.slides) || !o.slides.length) o.slides = [{}]; if (!fmtLabel[o.format]) o.format = 'post45'; }
  if (coll === 'tasks' && !Array.isArray(o.agents)) o.agents = [];
  if (coll === 'brands' && !Array.isArray(o.palette)) o.palette = [];
  if (coll === 'chats') { if (!Array.isArray(o.turns)) o.turns = []; if (!MODES[o.mode]) o.mode = 'libre'; }
  return o;
}

function lum(h){ const v = [1,3,5].map(i => parseInt(h.slice(i,i+2),16)/255).map(c => c <= .03928 ? c/12.92 : ((c+.055)/1.055)**2.4); return .2126*v[0]+.7152*v[1]+.0722*v[2]; }
function contrast(a,b){ if(!isHex(a)||!isHex(b)) return 1; const [x,y] = [lum(a),lum(b)].sort((m,n)=>n-m); return (x+.05)/(y+.05); }

      <div><dt>Qué entrega y dónde</dt><dd class="mono">${esc(a.delivers)}</dd></div>
      <div><dt>Herramientas</dt><dd style="display:flex;gap:6px;flex-wrap:wrap">${a.tools.map(t => `<span class="chip ${TOOLS[t].on ? 'on' : 'off'}"><span class="dot"></span>${TOOLS[t].n}${TOOLS[t].on ? '' : ' · falta conectar'}</span>`).join('')}</dd></div>
      <div><dt>Ficha</dt><dd class="mono">${esc(a.file)}</dd></div>
      <div><dt>Trabajando en</dt><dd>${load.length ? load.map(t => `<button class="tlink" style="font-weight:500" data-task="${esc(t.id)}">• ${esc(t.title)}</button> <span class="muted mono">${esc(TASK_STL[t.status] || '')}</span>`).join('<br>') : 'Disponible'}</dd></div>
      <div><dt>Pedido de ejemplo</dt><dd><div class="ask"><p>${esc(a.prompt)}</p><button class="btn sm ghost" data-copy="${esc(a.prompt)}">Copiar</button></div></dd></div>
    </dl></aside>`;
  hydrateAvatars(root);
  $('.x', root)?.focus();
}

/* ---------- acciones ---------- */
function setView(v){
  S.view = v; S.confirm = null;
  ['oficina','chat','tareas','studio'].forEach(k => { $('#v-' + k).hidden = k !== v; $('#tab-' + k).setAttribute('aria-selected', k === v); });
  render();
  try { history.replaceState(null, '', '#' + v); } catch {}
}
function newSlide(b, from){
  if (from) return clone(from);
  return {headline:'Tu titular *acá*', kicker:'', sub:'', align:'center', bg:(b.palette||[])[0] || '#0A0A0A', fg:(b.palette||[]).find(c => contrast(c,(b.palette||[])[0] || '#0A0A0A') >= 4.5) || '#FFFFFF', ac:(b.palette||[])[1] || '#C6FF3D', overlay:45, sign:true};
}
function mutPost(fn, {editor = false, delay} = {}){
  const p = curPost(); if (!p || !S.canWrite) return;
  fn(p); if (p.sample) p.sample = false;
  saveLater('posts', p, delay);
  renderList(); renderStage(); if (editor) renderEditor();
  updateCounts();
}
function updateCounts(){
  const nt = S.tasks.filter(t => t.status === 'para-aprobar').length, np = S.posts.filter(p => p.status === 'para-aprobar').length;
  $('#n-tareas').hidden = !nt; $('#n-tareas').textContent = nt; $('#n-studio').hidden = !np; $('#n-studio').textContent = np;
}
const mutSlide = (fn, o) => mutPost(p => fn(p.slides[S.slide]), o);
let uploadTarget = null;

document.addEventListener('click', async e => {
  const t = e.target.closest('button,[data-post],[data-close]'); if (!t) return;
  const d = t.dataset;
  if (d.view) return setView(d.view);
  if ('close' in d) { S.agentOpen = null; S.taskOpen = null; S.fbOpen = null; return renderDrawer(); }
  if (d.agent) { S.agentOpen = d.agent; S.taskOpen = null; return renderDrawer(); }
  if (d.task) { S.taskOpen = d.task; S.agentOpen = null; S.fbOpen = null; return renderDrawer(); }
  if (d.fbopen) { S.fbOpen = d.fbopen; return d.fbopen.startsWith('task:') ? renderDrawer() : renderEditor(); }
  if ('fbcancel' in d) { const k = S.fbOpen || ''; S.fbOpen = null; return k.startsWith('task:') ? renderDrawer() : renderEditor(); }
  if (d.fbsend) {
    const text = ($('#fb-text')?.value || '').trim(); if (!text) { $('#fb-text')?.focus(); return toast('Escribí qué hay que cambiar'); }
    const [k, id] = d.fbsend.split(':'); S.fbOpen = null;
    if (k === 'task') { const tk = S.tasks.find(x => x.id === id); if (!tk) return; tk.feedback = text; tk.status = 'en-curso'; addLog(tk, 'ceo', 'Pidió cambios: ' + text); saveLater('tasks', tk, 0); }
    else {
      const p = S.posts.find(x => x.id === id); if (!p) return; p.feedback = text; p.status = 'borrador'; p.sample = false; addLog(p, 'ceo', 'Pidió cambios: ' + text); saveLater('posts', p, 0);
      const tk = p.taskId && S.tasks.find(x => x.id === p.taskId);
      if (tk && tk.status !== 'hecho') { tk.status = 'en-curso'; addLog(tk, 'ceo', 'Pidió cambios en «' + (p.title || 'la publicación') + '»'); saveLater('tasks', tk, 0); }
    }
    render(); return toast('Listo. Decile a Claude: «atendé los cambios de MN HQ»');
  }
  if (d.fbclear) {
    const [k, id] = d.fbclear.split(':'); const o = (k === 'task' ? S.tasks : S.posts).find(x => x.id === id); if (!o) return;
    o.feedback = ''; addLog(o, 'ceo', 'Marcó los cambios como resueltos'); saveLater(k === 'task' ? 'tasks' : 'posts', o, 0); return render();
  }
  if (d.tapprove) { const tk = S.tasks.find(x => x.id === d.tapprove); if (!tk) return; tk.status = 'hecho'; tk.feedback = ''; addLog(tk, 'ceo', 'Aprobó la tarea'); saveLater('tasks', tk, 0); render(); return toast('Aprobada'); }
  if (d.copy) return copy(d.copy);
  if (d.flow) { S.flow = d.flow; return renderOficina(waiting()); }
  // chat
  if (d.cmode) { S.chatMode = d.cmode; lsSet('mnhq.chatmode', d.cmode); S.chatId = null; S.chatErr = ''; return renderChat(); }
  if ('cnew' in d) { S.chatId = null; S.chatErr = ''; renderChat(); return $('#chat-in')?.focus(); }
  if (d.chat) { if (S.chatBusy) return; S.chatId = d.chat; S.chatErr = ''; S.confirm = null; return renderChat(); }
  if ('csend' in d) return sendChat();
  if ('cstop' in d) { chatCtl?.abort(); return; }
  if ('cimg' in d) return $('#chat-file').click();
  if (d.cimgdel !== undefined) { S.chatImgs.splice(+d.cimgdel, 1); return renderThumbs(); }
  if (d.cconf) { S.confirm = 'chat:' + d.cconf; return renderChatHead(); }
  if ('ccancel' in d) { S.confirm = null; return renderChatHead(); }
  if (d.cdel) { S.chats = S.chats.filter(c => c.id !== d.cdel); removeDoc('chats', d.cdel); S.chatId = null; S.confirm = null; return renderChat(); }
  if (d.ccopy !== undefined) { const t = curChat()?.turns[+d.ccopy]; return t && copy(t.content); }
  if (d.csaveEst !== undefined) {
    const ch = curChat(); const t = ch?.turns[+d.csaveEst]; const b = S.brands.find(x => x.id === ch?.brand); if (!t || !b) return;
    b.estetica = fenced(t.content); b.updatedAt = nowISO(); saveNow('brands', b); renderChatSide(); return toast('Guardado en la estética de ' + b.name);
  }
  if (d.csaveWeb !== undefined) {
    const ch = curChat(); const t = ch?.turns[+d.csaveWeb]; if (!t) return;
    const text = fenced(t.content); const bn = brandName(ch.brand) || 'la marca';
    let tk = ch.taskId && S.tasks.find(x => x.id === ch.taskId);
    if (!tk) { tk = {id:'t-' + uid(), title:'Sitio de ' + bn, brand:ch.brand, due:'', status:'pendiente', agents:['desarrollo-web'], route:'Prompt aprobado → Claude Code', by:'ceo', createdAt:nowISO(), log:[]}; S.tasks.push(tk); ch.taskId = tk.id; saveLater('chats', ch, 0); }
    tk.destino = 'claude-code'; tk.prompt = text; tk.detail = 'Prompt armado en el chat «' + (ch.title || '') + '». Copialo con «Copiar para Claude Code» y pegalo en Claude Code.';
    addLog(tk, 'ceo', 'Guardó el prompt de la web desde el chat'); saveNow('tasks', tk); copy(text);
    return toast('Prompt guardado en Tareas y copiado: pegalo en Claude Code');
  }
  if (d.open) { const [k,id] = d.open.split(':'); if (k === 'post') { const p = S.posts.find(x => x.id === id); if (p) { S.brandId = p.brand; S.postId = id; S.slide = 0; } setView('studio'); } else { S.taskOpen = id; S.agentOpen = null; setView('tareas'); setTimeout(() => $('#task-' + CSS.escape(id))?.scrollIntoView({behavior:'smooth', block:'center'}), 50); } return; }
  if ('cancel' in d) { S.confirm = null; return S.view === 'tareas' ? renderTareas() : renderEditor(); }
  // tareas
  if (t.id === 'tnew') { S.taskForm = !S.taskForm; renderTareas(); if (S.taskForm) $('#t-title')?.focus(); return; }
  if (d.tmove) { const tk = S.tasks.find(x => x.id === d.tmove); if (!tk) return; const ix = Math.max(0, Math.min(3, TASK_ST.indexOf(tk.status || 'pendiente') + (+d.dir))); tk.status = TASK_ST[ix]; addLog(tk, 'ceo', 'Movió la tarea a «' + TASK_STL[tk.status] + '»'); saveLater('tasks', tk, 0); return render(); }
  if (d.tconf) { S.confirm = 'task:' + d.tconf; return renderTareas(); }
  if (d.tdel) { S.tasks = S.tasks.filter(x => x.id !== d.tdel); removeDoc('tasks', d.tdel); S.confirm = null; return render(); }
  // studio
  if (d.brand) { S.brandId = d.brand; lsSet('mnhq.brand', d.brand); S.postId = null; S.brandEdit = false; return renderStudio(); }
  if (d.post) { S.postId = d.post; S.slide = 0; S.confirm = null; return renderStudio(); }
  if (d.mode) { S.mode = d.mode; return renderStage(); }
  if (d.ig !== undefined) { S.igDark = d.ig === '1'; lsSet('mnhq.igdark', d.ig); return renderStage(); }
  if ('safe' in d) { S.safe = !S.safe; return renderStage(); }
  if (d.sl) { const p = curPost(); if (!p) return; S.slide = Math.max(0, Math.min(p.slides.length - 1, S.slide + (+d.sl))); renderStage(); return renderEditor(); }
  if (d.slide !== undefined) { S.slide = +d.slide; renderStage(); return renderEditor(); }
  if (d.col) { const key = d.col, val = d.v; return mutSlide(s => { s[key] = val; }, {editor:true}); }
  if (t.id === 'bedit') { S.brandEdit = !S.brandEdit; return renderList(); }
  if (t.id === 'b-new') { const nb = {id:'marca-' + uid(), name:'Marca nueva', handle:'usuario', bio:'', palette:['#1F2937','#F59E0B','#FFFFFF'], headFont:'Montserrat', accentFont:'Caveat', bodyFont:'Montserrat', order:S.brands.length}; S.brands.push(nb); saveNow('brands', nb); S.brandId = nb.id; S.postId = null; return renderStudio(); }
  if (t.id === 'b-logo') { uploadTarget = 'logo'; return $('#file').click(); }
  if (t.id === 'pnew') {
    const b = brand(S.brandId);
    const p = {id:'p-' + uid(), brand:b.id, title:'', format:'post45', status:'borrador', caption:'', hashtags:'', date:'', slides:[newSlide(b)], by:'ceo', createdAt:new Date().toISOString()};
    S.posts.push(p); S.postId = p.id; S.slide = 0; S.mode = 'post'; saveNow('posts', p); renderStudio(); $('#s-headline')?.focus(); return;
  }
  if (t.id === 'e-approve') { mutPost(p => { p.status = 'aprobado'; p.feedback = ''; addLog(p, 'ceo', 'Aprobó la publicación'); }, {editor:true, delay:0}); return toast('Aprobada. Redes ya puede programarla.'); }
  if (t.id === 'e-add') { mutPost(p => { p.slides.push(newSlide(brand(p.brand))); S.slide = p.slides.length - 1; }, {editor:true, delay:0}); return; }
  if (t.id === 'e-dup') { mutPost(p => { p.slides.splice(S.slide + 1, 0, clone(p.slides[S.slide])); S.slide++; }, {editor:true, delay:0}); return; }
  if (t.id === 'e-left' || t.id === 'e-right') { const dir = t.id === 'e-left' ? -1 : 1; mutPost(p => { const [x] = p.slides.splice(S.slide, 1); S.slide += dir; p.slides.splice(S.slide, 0, x); }, {editor:true, delay:0}); return; }
  if (t.id === 'e-delslide') { mutPost(p => { p.slides.splice(S.slide, 1); S.slide = Math.max(0, S.slide - 1); }, {editor:true, delay:0}); return; }
  if (t.id === 's-combo') {
    const b = brand(S.brandId); const pal = [...new Set([...(b.palette || []), '#FFFFFF', '#0A0A0A'])];
    const pairs = []; pal.forEach(x => pal.forEach(y => { if (x !== y && contrast(x,y) >= 4.5) pairs.push([x,y]); }));
    if (!pairs.length) return toast('La paleta no tiene pares legibles');
    S.comboIx = (S.comboIx + 1) % pairs.length; const [bg,fg] = pairs[S.comboIx];
    const ac = pal.find(c => c !== bg && c !== fg && contrast(c,bg) >= 3) || fg;
    return mutSlide(s => { s.bg = bg; s.fg = fg; s.ac = ac; }, {editor:true});
  }
  if (t.id === 's-img') { uploadTarget = 'slide'; return $('#file').click(); }
  if (t.id === 's-noimg') return mutSlide(s => { delete s.imageId; delete s.imageUrl; }, {editor:true, delay:0});
  if (t.id === 'e-copy') { const p = curPost(); return copy([p.caption, p.hashtags].filter(Boolean).join('\n\n')); }
  if (t.id === 'e-del') { S.confirm = 'post:' + curPost()?.id; return renderEditor(); }
  if (t.id === 'e-del-yes') { const id = S.postId; S.posts = S.posts.filter(x => x.id !== id); removeDoc('posts', id); S.postId = null; S.confirm = null; return renderStudio(); }
});

document.addEventListener('input', e => {
  const el = e.target; if (!el.id) return;
  const sk = el.id.startsWith('s-') ? el.id.slice(2) : null;
  if (['kicker','headline','sub'].includes(sk)) return mutSlide(s => { s[sk] = el.value; });
  if (sk === 'overlay') { el.nextElementSibling.textContent = el.value + '%'; return mutSlide(s => { s.overlay = +el.value; }); }
  if (el.id.startsWith('c-')) { const key = el.id.slice(2); return mutSlide(s => { s[key] = el.value.toUpperCase(); }); }
  if (el.id === 'e-title') return mutPost(p => { p.title = el.value; });
  if (el.id === 'e-caption' || el.id === 'e-hashtags') {
    mutPost(p => { p[el.id.slice(2)] = el.value; });
    const p = curPost(); const capLen = String(p.caption || '').length + String(p.hashtags || '').length; const n = (String(p.hashtags || '').match(/#[\p{L}\p{N}_]+/gu) || []).length;
    const c = $('.counter'); if (c) c.innerHTML = `<span class="${capLen > 2200 ? 'over' : ''}">${capLen} / 2200 caracteres</span><span class="${n > 30 ? 'over' : ''}">${n} / 30 hashtags</span>`;
  }
});
document.addEventListener('change', e => {
  const el = e.target; if (!el.id) return;
  const sk = el.id.startsWith('s-') ? el.id.slice(2) : null;
  if (['align','headFont','accentFont'].includes(sk)) return mutSlide(s => { s[sk] = el.value; }, {editor:true});
  if (sk === 'sign') return mutSlide(s => { s.sign = el.checked; });
  if (el.id === 'c-brand') { S.chatBrand = el.value; lsSet('mnhq.chatbrand', el.value); S.chatId = null; S.chatErr = ''; return renderChat(); }
  if (el.id.startsWith('c-')) return renderEditor();
  if (el.id === 'e-format') return mutPost(p => { p.format = el.value; S.mode = el.value === 'historia' ? 'story' : 'post'; }, {editor:true, delay:0});
  if (el.id === 'e-status') return mutPost(p => { p.status = el.value; }, {editor:true, delay:0});
  if (el.id === 'e-date') return mutPost(p => { p.date = el.value; }, {delay:0});
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'chat-in' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendChat(); }
});
$('#chat-file').addEventListener('change', e => {
  const max = S.sampleImages?.maxCount || 5;
  const ok = [...e.target.files].filter(f => /^image\/(jpeg|png|webp|gif)$/.test(f.type));
  e.target.value = '';
  S.chatImgs = [...S.chatImgs, ...ok].slice(0, max); renderThumbs();
  if (ok.length && S.chatImgs.length === max) toast('Hasta ' + max + ' imágenes por mensaje');
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'tform') {
    const title = $('#t-title').value.trim(); if (!title) return;
    const tk = {id:'t-' + uid(), title, brand:$('#t-brand').value, due:$('#t-due').value, status:$('#t-status').value, agents:$$('input[name="t-ag"]:checked').map(i => i.value), detail:$('#t-detail').value.trim(), by:'ceo', createdAt:nowISO(), updatedAt:nowISO(), log:[]};
    addLog(tk, 'ceo', 'Creó la tarea');
    S.tasks.push(tk); saveNow('tasks', tk); S.taskForm = false; render(); toast('Tarea creada');
  }
  if (e.target.id === 'reqform') {
    const text = $('#req-text').value.trim(); if (!text) return $('#req-text').focus();
    const bid = $('#req-brand').value; S.reqBrand = bid; lsSet('mnhq.reqbrand', bid);
    const first = text.split('\n')[0];
    const tk = {id:'t-' + uid(), title:first.length > 110 ? first.slice(0, 110) + '…' : first, brand:bid, due:'', status:'pendiente', agents:[], detail:text, by:'ceo', createdAt:nowISO(), updatedAt:nowISO(), log:[]};
    addLog(tk, 'ceo', 'Pidió esto desde MN HQ');
    S.tasks.push(tk); saveNow('tasks', tk); $('#req-text').value = ''; render();
    return toast('Pedido creado. Decile a Claude «revisá MN HQ»');
  }
  if (e.target.id === 'bform') {
    const b = brand(S.brandId);
    b.name = $('#b-name').value.trim() || b.name; b.handle = $('#b-handle').value.trim().replace(/^@/,'') || b.handle; b.bio = $('#b-bio').value;
    const pal = $('#b-pal').value.split(/[\s,;]+/).map(x => x.trim()).filter(isHex).map(x => x.toUpperCase());
    if (pal.length) b.palette = pal; b.headFont = $('#b-hf').value; b.accentFont = $('#b-af').value;
    for (const [k, el] of [['voice','#b-voice'],['audience','#b-audience'],['pillars','#b-pillars'],['offer','#b-offer'],['avoid','#b-avoid'],['memory','#b-memory'],['estetica','#b-estetica'],['website','#b-web']]) b[k] = $(el).value.trim();
    b.updatedAt = nowISO();
    saveNow('brands', b); S.brandEdit = false; renderStudio(); toast('Marca guardada');
  }
});
$('#file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f || !S.assets) return;
  toast('Subiendo…');
  try {
    const r = await S.assets.upload(f);
    if (uploadTarget === 'logo') { const b = brand(S.brandId); b.avatarId = r.id; b.avatarUrl = r.url; saveNow('brands', b); renderStudio(); }
    else mutSlide(s => { s.imageId = r.id; s.imageUrl = r.url; }, {editor:true, delay:0});
    toast('Listo');
  } catch (err) { toast(err && err.code === 'quota_exceeded' ? 'No hay más espacio para imágenes' : 'No se pudo subir la imagen'); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && (S.agentOpen || S.taskOpen)) { S.agentOpen = null; S.taskOpen = null; S.fbOpen = null; renderDrawer(); } });

/* ---------- arranque ---------- */
const startView = (location.hash || '').slice(1);
S.brands = clone(FALLBACK_BRANDS);
setView(['oficina','chat','tareas','studio'].includes(startView) ? startView : 'oficina');

(async () => {
  const c = window.claude;
  if (!c || !c.use) { setSync(false, 'Vista local'); showBanner('Estás viendo una copia local: los cambios no se guardan. Abrí MN HQ desde Claude para trabajar con el equipo.'); return; }
  const [db, assets, user, sample] = await Promise.all([c.use('db'), c.use('assets').catch(() => null), c.use('user').catch(() => null), c.use('sample').catch(() => null)]);
  S.assets = assets; S.sample = sample;
  if (sample) { try { S.sampleImages = (await sample.limits())?.images || false; } catch { S.sampleImages = false; } }
  if (S.view === 'chat') renderChat();
  if (!db) { setSync(false, 'Sin base'); showBanner('No se pudo conectar la base del equipo: podés probar el Studio, pero los cambios no se guardan.'); return; }
  S.db = db;
  try { if (user && (await user.can('data.write')) === false) { S.canWrite = false; showBanner('Tenés acceso de solo lectura.'); } } catch {}
  S.brands = []; render();
  subscribe('brands','brands'); subscribe('posts','posts'); subscribe('tasks','tasks'); subscribe('chats','chats');
})();
})();
</script>
