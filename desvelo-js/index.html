<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Desvelo JS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky top bar with progress + clock; mission rail on the left, lesson column on the right; the editors are the hero. Dark-first (it's a night session). */
:root {
  --bg: #0e1120;
  --surface: #161a2d;
  --surface-2: #1e2339;
  --line: #2b3152;
  --fg: #ebe8dc;
  --muted: #9ba1bf;
  --accent: #f7df1e;
  --accent-ink: #17150a;
  --accent-text: #f7df1e;
  --info: #93b4ff;
  --ok: #5ad6a6;
  --bad: #ff8379;
  --warn: #ffb35c;
  --code-bg: #0a0d19;
  --page: #ffffff;
  --t-kw: #c7a6ff; --t-str: #a6e58f; --t-num: #ffb86b; --t-com: #6f7799; --t-fn: #7fc8ff; --t-lit: #ff9ac1; --t-cls: #ffd479;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --radius: 10px;
  --top-h: 56px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f4fa; --surface: #ffffff; --surface-2: #eaedf6; --line: #d4d8e8; --fg: #171a2b; --muted: #596080;
    --accent: #f7df1e; --accent-ink: #17150a; --accent-text: #806500; --info: #3b5cc2; --ok: #11805b; --bad: #c43333; --warn: #a35a00;
    --code-bg: #f8f8fc; --page: #ffffff;
    --t-kw: #6d3fd0; --t-str: #2b7a2b; --t-num: #b05500; --t-com: #878ea8; --t-fn: #1c69b6; --t-lit: #b5306c; --t-cls: #8a6100;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f3f4fa; --surface: #ffffff; --surface-2: #eaedf6; --line: #d4d8e8; --fg: #171a2b; --muted: #596080;
  --accent: #f7df1e; --accent-ink: #17150a; --accent-text: #806500; --info: #3b5cc2; --ok: #11805b; --bad: #c43333; --warn: #a35a00;
  --code-bg: #f8f8fc; --page: #ffffff;
  --t-kw: #6d3fd0; --t-str: #2b7a2b; --t-num: #b05500; --t-com: #878ea8; --t-fn: #1c69b6; --t-lit: #b5306c; --t-cls: #8a6100;
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.6; -webkit-text-size-adjust: 100%; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, kbd, pre, textarea { font-family: var(--font-mono); }
html:not(.has-ai) .ai-only { display: none !important; }

/* ---------- top bar ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; flex-wrap: wrap; gap: 10px 18px; padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; letter-spacing: -0.01em; white-space: nowrap; }
.mark { width: 28px; height: 28px; border-radius: 6px; background: var(--accent); position: relative; overflow: hidden; flex: none; }
.mark::before { content: ""; position: absolute; width: 16px; height: 16px; border-radius: 50%; background: var(--accent-ink); left: 5px; top: 7px; }
.mark::after { content: ""; position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); left: 10px; top: 3px; }
.progress { flex: 1 1 180px; display: flex; align-items: center; gap: 10px; min-width: 0; max-width: 380px; }
.bar { flex: 1; height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar span { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .5s ease; }
.prog-text, .xp, .clock { font-family: var(--font-mono); font-size: .8rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.prog-text { color: var(--muted); }
.stats { display: flex; align-items: center; gap: 8px; }
.xp { background: var(--accent); color: var(--accent-ink); padding: 2px 8px; border-radius: 99px; font-weight: 600; }
.level { font-size: .85rem; color: var(--muted); white-space: nowrap; }
.clock { display: flex; align-items: center; gap: 8px; color: var(--muted); margin-left: auto; }
.top-btn { font: inherit; font-size: .82rem; font-weight: 700; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; white-space: nowrap; min-height: 34px; font-variant-numeric: tabular-nums; }
.top-btn:hover { border-color: var(--muted); }
.top-btn.on { border-color: var(--accent); color: var(--accent-text); }
.top-btn.tutor { border-color: var(--info); color: var(--info); }
@media (max-width: 680px) {
  .topbar { padding: 8px 16px; gap: 8px 10px; }
  .progress { order: 9; flex-basis: 100%; max-width: none; }
  .level, .clock-label { display: none; }
}

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); max-width: 1260px; margin: 0 auto; }
.rail { position: sticky; top: calc(var(--top-h) + env(safe-area-inset-top, 0px)); align-self: start; max-height: calc(100vh - var(--top-h)); overflow-y: auto; padding: 20px 12px 40px 20px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.rail-label { font-family: var(--font-mono); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 14px 10px 6px; }
.nav-item { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 8px; text-decoration: none; color: var(--muted); font-size: .92rem; line-height: 1.3; }
.nav-item:hover { background: var(--surface-2); color: var(--fg); }
.nav-item[aria-current="page"] { background: var(--surface-2); color: var(--fg); font-weight: 700; }
.nav-num { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font-family: var(--font-mono); font-size: .75rem; border: 1px solid var(--line); font-weight: 600; }
.nav-item.done .nav-num { background: var(--ok); color: var(--bg); border-color: transparent; }
.nav-item[aria-current="page"] .nav-num { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.nav-count { font-family: var(--font-mono); font-size: .72rem; font-variant-numeric: tabular-nums; }
main { min-width: 0; padding: 32px 36px 96px; }
.main-inner { max-width: 820px; display: flex; flex-direction: column; gap: 20px; }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; max-height: none; flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 10px 16px; gap: 6px; }
  .rail-label, .nav-item .nav-title.mission, .nav-count { display: none; }
  .nav-item { grid-template-columns: auto; flex: none; padding: 4px; }
  .nav-item.text { grid-template-columns: auto auto; padding: 4px 10px 4px 4px; }
  main { padding: 22px 16px 96px; }
}

/* ---------- type ---------- */
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.1rem, 5vw, 3.1rem); line-height: 1.04; letter-spacing: -0.025em; margin: 0; text-wrap: balance; }
h2.sec { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; letter-spacing: -0.01em; margin: 22px 0 0; text-wrap: balance; display: flex; align-items: baseline; gap: 12px; }
h2.sec small { font-family: var(--font-mono); font-size: .72rem; font-weight: 400; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.eyebrow { font-family: var(--font-mono); font-size: .74rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.chip { font-family: var(--font-mono); font-size: .68rem; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--accent); color: var(--accent-text); }
.goal { color: var(--muted); font-size: 1.1rem; max-width: 60ch; margin: 0; }
.m-head { display: flex; flex-direction: column; gap: 10px; padding-bottom: 6px; }
.prose { max-width: 68ch; }
.prose p { margin: 0 0 .75em; }
.prose p:last-child, .prose ul:last-child { margin-bottom: 0; }
.prose ul, .prose ol { padding-left: 1.25em; margin: 0 0 .75em; }
.prose li { margin: .25em 0; }
.prose code, .tip code, .why code, .test code, .hints code, .ai-body code, .msg code, .err-h code, .map code { font-size: .87em; background: var(--surface-2); padding: .06em .36em; border-radius: 4px; overflow-wrap: anywhere; }
.tip { border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; background: var(--surface); max-width: 72ch; font-size: .96rem; }
.tip p { margin: 0; }
kbd { font-size: .74rem; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--muted); white-space: nowrap; }

/* ---------- code ---------- */
.code-ro { margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; font-size: 13.5px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; tab-size: 2; color: var(--fg); }
.t-kw { color: var(--t-kw); } .t-str { color: var(--t-str); } .t-num { color: var(--t-num); } .t-com { color: var(--t-com); font-style: italic; } .t-fn { color: var(--t-fn); } .t-lit { color: var(--t-lit); } .t-cls { color: var(--t-cls); }
.editor { position: relative; background: var(--code-bg); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
.editor:focus-within { border-color: color-mix(in srgb, var(--accent) 70%, var(--line)); }
.editor-hl, .editor-ta { margin: 0; padding: 14px 16px; border: 0; font-family: var(--font-mono); font-size: 14px; line-height: 1.6; tab-size: 2; letter-spacing: 0; white-space: pre-wrap; overflow-wrap: anywhere; word-break: normal; font-variant-ligatures: none; }
.editor-hl { position: absolute; inset: 0; pointer-events: none; overflow: hidden; color: var(--fg); }
.editor-ta { position: relative; display: block; width: 100%; min-height: 4.4em; resize: none; overflow: hidden; background: transparent; color: transparent; -webkit-text-fill-color: transparent; caret-color: var(--accent); outline: none; }
.editor-ta::selection { background: color-mix(in srgb, var(--accent) 32%, transparent); }
@media (pointer: coarse) { .editor-hl, .editor-ta { font-size: 16px; } }
.console { font-family: var(--font-mono); font-size: 13px; line-height: 1.55; background: var(--code-bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; max-height: 300px; overflow: auto; }
.console::before { content: "Consola"; display: block; font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.ln { white-space: pre-wrap; overflow-wrap: anywhere; padding: 1px 0; }
.ln.warn { color: var(--warn); }
.ln.error { color: var(--bad); }
.ln.note { color: var(--muted); font-style: italic; }
.err-h { display: block; color: var(--fg); font-family: var(--font-body); font-size: .9rem; margin-top: 2px; }

/* ---------- buttons ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { font: inherit; font-size: .9rem; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; min-height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; }
.btn.ai { background: transparent; border-color: color-mix(in srgb, var(--info) 55%, var(--line)); color: var(--info); }
.btn.warn { border-color: var(--warn); color: var(--warn); }
.btn:disabled { opacity: .55; cursor: progress; }
.btn .k { font-family: var(--font-mono); font-size: .7rem; font-weight: 400; opacity: .7; }
.spacer { flex: 1; }

/* ---------- example ---------- */
.example { display: flex; flex-direction: column; gap: 10px; }
.ex-label { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.label { font-family: var(--font-mono); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
.dom-split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.dom-col { min-width: 0; display: flex; flex-direction: column; }
.dom-col .code-ro { margin-bottom: 12px; }
@media (max-width: 760px) { .dom-split { grid-template-columns: minmax(0, 1fr); } }
.frame-host iframe { display: block; width: 100%; height: 260px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--page); }
.frame-note { font-size: .8rem; color: var(--muted); margin: 6px 0 0; }

/* ---------- quiz ---------- */
.quiz { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.quiz .q { margin: 0; font-weight: 700; font-size: 1.05rem; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 560px) { .opts { grid-template-columns: minmax(0, 1fr); } }
.opt { text-align: left; display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); cursor: pointer; font: inherit; min-width: 0; }
.opt:hover { border-color: var(--muted); }
.opt-k { font-family: var(--font-mono); font-size: .72rem; color: var(--muted); padding-top: 3px; flex: none; }
.opt-v { font-family: var(--font-mono); font-size: .9rem; white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
.opts.prose-opts .opt-v { font-family: var(--font-body); font-size: .95rem; }
.answered .opt { cursor: default; }
.answered .opt:not(.correct):not(.wrong) { opacity: .6; }
.opt.correct { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 15%, var(--surface-2)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 13%, var(--surface-2)); }
.why { font-size: .96rem; }
.why p { margin: 0; }
.verdict { font-weight: 700; }
.verdict.ok { color: var(--ok); }
.verdict.bad { color: var(--bad); }

/* ---------- challenge ---------- */
.challenge { border: 1px solid var(--line); border-radius: 16px; padding: 20px; background: var(--surface); display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.challenge.solved { border-color: color-mix(in srgb, var(--ok) 65%, var(--line)); }
.ch-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.challenge h3 { font-family: var(--font-display); font-weight: 700; font-size: 1.4rem; margin: 0; line-height: 1.2; text-wrap: balance; }
.status { font-family: var(--font-mono); font-size: .68rem; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; white-space: nowrap; }
.solved .status { color: var(--bg); background: var(--ok); border-color: transparent; }
details.pre summary { cursor: pointer; font-size: .9rem; color: var(--muted); margin-bottom: 8px; }
.tests-wrap { display: flex; flex-direction: column; gap: 8px; }
.tests-head { display: flex; justify-content: space-between; align-items: baseline; }
.tests-count { font-family: var(--font-mono); font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tests { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.test { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: start; font-size: .93rem; }
.test .ic { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: .72rem; font-weight: 700; border: 1px solid var(--line); color: var(--muted); margin-top: 2px; font-family: var(--font-mono); }
.test.pass .ic { background: var(--ok); color: var(--bg); border-color: transparent; }
.test.fail .ic { background: var(--bad); color: var(--bg); border-color: transparent; }
.test .detail { display: block; font-family: var(--font-mono); font-size: .8rem; color: var(--muted); overflow-wrap: anywhere; white-space: pre-wrap; }
.test .detail.hint { font-family: var(--font-body); font-size: .88rem; color: var(--fg); }
.hints { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; font-size: .95rem; }
.ai-box { border: 1px dashed color-mix(in srgb, var(--info) 70%, var(--line)); border-radius: 12px; padding: 12px 16px; background: color-mix(in srgb, var(--info) 7%, transparent); display: flex; flex-direction: column; gap: 6px; }
.ai-box .who { font-family: var(--font-mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--info); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.ai-box .who button { font: inherit; background: none; border: 0; color: var(--info); cursor: pointer; text-decoration: underline; padding: 0; }
.ai-body { font-size: .96rem; overflow-wrap: anywhere; }
.ai-body p { margin: 0 0 .6em; }
.ai-body p:last-child { margin-bottom: 0; }
.ai-body ul, .ai-body ol { margin: 0 0 .6em; padding-left: 1.2em; }
.ai-body pre, .msg pre { margin: .4em 0 .6em; font-size: 12.5px; }
.solution { display: flex; flex-direction: column; gap: 8px; }
.next { display: flex; justify-content: flex-end; padding-top: 12px; }
.next .btn { font-size: 1rem; padding: 10px 18px; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.012); } 100% { transform: scale(1); } }
.challenge.pop { animation: pop .45s ease-out; }

/* ---------- home ---------- */
.hero { display: flex; flex-direction: column; gap: 14px; padding-top: 6px; }
.hero h1 { font-size: clamp(2.8rem, 8vw, 4.8rem); }
.hero h1 em { font-style: normal; color: var(--accent-text); }
.lead { font-size: 1.18rem; max-width: 56ch; color: var(--muted); margin: 0; }
.hero .toolbar { margin-top: 6px; }
.night { display: flex; flex-direction: column; gap: 8px; }
.strip { display: flex; gap: 3px; height: 46px; }
.seg { flex: var(--w) 1 0; min-width: 0; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--font-mono); font-size: .75rem; color: var(--muted); text-decoration: none; position: relative; overflow: hidden; }
.seg.core { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); color: var(--fg); }
.seg .fill { position: absolute; inset: auto 0 0 0; height: var(--p); background: color-mix(in srgb, var(--ok) 40%, transparent); }
.seg span { position: relative; }
.seg.done { background: color-mix(in srgb, var(--ok) 30%, var(--surface-2)); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .85rem; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; border: 1px solid var(--line); background: var(--surface-2); }
.legend i.core { border-color: var(--accent); }
.legend i.done { background: color-mix(in srgb, var(--ok) 50%, var(--surface-2)); }
.method { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 10px; counter-reset: paso; }
.method li { counter-increment: paso; padding: 14px 14px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.method li::before { content: counter(paso, decimal-leading-zero); font-family: var(--font-mono); font-size: .75rem; color: var(--accent-text); }
.method strong { font-family: var(--font-display); font-size: 1.12rem; }
.method span { font-size: .93rem; color: var(--muted); }
.map { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(230px, 100%), 1fr)); gap: 10px; }
.map a { display: flex; flex-direction: column; gap: 6px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; text-decoration: none; background: var(--surface); }
.map a:hover { border-color: var(--muted); }
.map .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: .74rem; color: var(--muted); }
.map strong { font-family: var(--font-display); font-size: 1.1rem; line-height: 1.2; }
.map .mini { height: 4px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.map .mini span { display: block; height: 100%; background: var(--ok); }
.foot { font-size: .88rem; color: var(--muted); }

/* ---------- cheats ---------- */

<!-- ============================ MISIÓN 1 ============================ -->
<section class="mission" data-id="m1" data-core data-mins="20" data-title="Valores y variables" data-goal="Guardar datos con nombre, conocer los tipos básicos y mostrar resultados en la consola.">
<h2 class="b-h">Concepto</h2>
<div class="b-text">
<p>Todo programa trabaja con <strong>valores</strong>: números, textos, verdadero o falso. Para reutilizarlos les ponés un nombre con una <strong>variable</strong>.</p>
<ul>
<li><code>const</code>: el valor no se reasigna. Usala por defecto.</li>
<li><code>let</code>: cuando el valor va a cambiar (un contador, un total).</li>
<li><code>var</code>: la forma vieja. La vas a ver en código antiguo; no la uses.</li>
</ul>
<p>Tipos básicos: <code>number</code> (<code>42</code>, <code>3.14</code>), <code>string</code> (<code>"hola"</code>), <code>boolean</code> (<code>true</code>/<code>false</code>), <code>undefined</code> (todavía sin valor) y <code>null</code> (vacío a propósito). <code>typeof</code> te dice el tipo de un valor y <code>console.log</code> lo muestra en la consola.</p>
</div>
<div class="b-example"><script type="text/plain" class="js">
const nombre = "Ada";
let edad = 36;
edad = edad + 1;      // let se puede reasignar
console.log(nombre, edad);
console.log(typeof nombre, typeof edad, typeof true);

// Sacale las barras a la línea de abajo y ejecutá: ¿qué pasa?
// nombre = "Grace";
</script></div>
<div class="b-text">
<p>Los <strong>template literals</strong> usan comillas invertidas (<code>`</code>) y te dejan meter cualquier expresión dentro de un texto con <code>${...}</code>. Los operadores matemáticos son los de siempre, más <code>%</code> (resto de la división) y <code>**</code> (potencia).</p>
</div>
<div class="b-example"><script type="text/plain" class="js">
const producto = "café";
const precio = 2.5;
const cantidad = 3;
console.log(`Pediste ${cantidad} ${producto}s: $${precio * cantidad}`);

console.log(10 / 3, 10 % 3, 2 ** 10);
console.log("5" + 3, "5" - 3, Number("5") + 3);
</script></div>
<div class="b-tip"><p><strong>Cómo leer un error:</strong> cuando algo falla, la consola muestra la línea y una explicación en castellano. Leela antes de tocar nada: casi siempre dice exactamente qué pasó.</p></div>

<h2 class="b-h">Predecí</h2>
<div class="b-quiz" data-id="q1-1" data-answer="1">
<script type="text/plain" class="code">
console.log(typeof null);
</script>
<script type="text/plain" class="opt">null</script>
<script type="text/plain" class="opt">object</script>
<script type="text/plain" class="opt">undefined</script>
<script type="text/plain" class="opt">Error</script>
<div class="why"><p>Es un error histórico de JavaScript que nunca se corrigió para no romper la web. <code>null</code> es su propio tipo, pero <code>typeof</code> dice <code>"object"</code>. Ahora ya lo sabés.</p></div>
</div>
<div class="b-quiz" data-id="q1-2" data-answer="1">
<script type="text/plain" class="code">
console.log("5" + 3, "5" - 3);
</script>
<script type="text/plain" class="opt">8 2</script>
<script type="text/plain" class="opt">53 2</script>
<script type="text/plain" class="opt">53 NaN</script>
<script type="text/plain" class="opt">8 53</script>
<div class="why"><p>Con un string, <code>+</code> concatena: <code>"5" + 3</code> da <code>"53"</code>. En cambio <code>-</code> solo sirve con números, así que JS convierte <code>"5"</code> en <code>5</code> y da <code>2</code>. Por eso conviene convertir explícitamente con <code>Number()</code>.</p></div>
</div>
<div class="b-quiz" data-id="q1-3" data-answer="1">
<script type="text/plain" class="code">
let x = 1;
x += 2;
x *= 3;
console.log(x);

<div class="why"><p><code>x += 2</code> es <code>x = x + 2</code> (queda 3) y <code>x *= 3</code> es <code>x = x * 3</code> (queda 9).</p></div>
</div>

<section class="mission" data-id="m2" data-core data-mins="25" data-title="Funciones" data-goal="Empaquetar lógica reutilizable: parámetros, return, funciones flecha y funciones como valores.">
<h2 class="b-h">Concepto</h2>
<div class="b-text">
<p>Una <strong>función</strong> es un bloque de código con nombre que ejecutás cuando quieras. Recibe datos (<strong>parámetros</strong>), hace su trabajo y entrega un resultado con <code>return</code>. Sin <code>return</code>, devuelve <code>undefined</code>.</p>
<p>Vas a ver dos sintaxis todo el tiempo: la clásica con <code>function</code> y la <strong>función flecha</strong> <code>(a, b) =&gt; ...</code>. Si la flecha tiene una sola expresión sin llaves, la devuelve sola.</p>
</div>
<div class="b-example"><script type="text/plain" class="js">
function areaRectangulo(base, altura) {
  return base * altura;
}

const a = areaRectangulo(3, 4);
console.log(a);
console.log(areaRectangulo(10, 2));

// Función flecha: misma idea, sintaxis corta
const cuadrado = (n) => n * n;
console.log(cuadrado(7));

// Parámetro con valor por defecto
const saludar = (nombre = "desconocido") => `Hola, ${nombre}`;
console.log(saludar("Lu"), "|", saludar());
</script></div>
<div class="b-text">
<p><strong><code>console.log</code> no es <code>return</code>.</strong> <code>console.log</code> muestra algo en pantalla; <code>return</code> le entrega el valor a quien llamó a la función. Los desafíos verifican lo que tu función <em>devuelve</em>.</p>
<p>Además, las funciones son valores: se guardan en variables y se pasan como argumento a otras funciones. Esto es la base de casi todo el JavaScript moderno.</p>
</div>
<div class="b-example"><script type="text/plain" class="js">
function conLog(x) { console.log(x * 2); }
function conReturn(x) { return x * 2; }

const r1 = conLog(5);     // imprime 10, pero devuelve undefined
const r2 = conReturn(5);  // no imprime nada, devuelve 10
console.log("r1:", r1, "| r2:", r2);

// Una función que recibe otra función
const aplicar = (fn, valor) => fn(valor);
console.log(aplicar(conReturn, 21));
console.log(aplicar((t) => t.toUpperCase(), "grito"));
</script></div>

<h2 class="b-h">Predecí</h2>
<div class="b-quiz" data-id="q2-1" data-answer="2">
<script type="text/plain" class="code">
function f(x) {
  x * 2;
}
console.log(f(4));
</script>
<script type="text/plain" class="opt">8</script>
<script type="text/plain" class="opt">4</script>
<script type="text/plain" class="opt">undefined</script>
<script type="text/plain" class="opt">Error</script>
<div class="why"><p>Falta <code>return</code>. La función calcula <code>x * 2</code> y tira el resultado; sin <code>return</code> devuelve <code>undefined</code>. Es el error número uno de quien empieza.</p></div>
</div>
<div class="b-quiz" data-id="q2-2" data-answer="0">
<script type="text/plain" class="code">

<div class="why"><p>Si no pasás <code>b</code>, vale <code>10</code> por defecto: <code>1 + 10 = 11</code>. Si lo pasás, se usa el tuyo: <code>1 + 2 = 3</code>.</p></div>
</div>
<div class="b-quiz" data-id="q2-3" data-answer="1">

<div class="why"><p>Con llaves <code>{}</code> la flecha es un bloque y necesita <code>return</code>. Sin llaves, <code>(n) =&gt; n * 2</code> devuelve el resultado automáticamente.</p></div>
</div>

<section class="mission" data-id="m3" data-core data-mins="25" data-title="Decisiones" data-goal="Hacer que el código elija caminos: comparaciones, if/else, operador ternario y valores truthy/falsy.">
<h2 class="b-h">Concepto</h2>
<div class="b-text">
<p>Para comparar usá <code>===</code> (mismo valor <em>y</em> mismo tipo) y <code>!==</code>. Existe <code>==</code>, que convierte tipos antes de comparar y da sorpresas: evitalo. También tenés <code>&lt;</code>, <code>&gt;</code>, <code>&lt;=</code>, <code>&gt;=</code>.</p>
<p>Para combinar condiciones: <code>&amp;&amp;</code> (y), <code>||</code> (o), <code>!</code> (no). Con <code>if / else if / else</code> elegís un camino, y el <strong>ternario</strong> <code>condicion ? a : b</code> es un if corto que devuelve un valor.</p>
</div>
<div class="b-example"><script type="text/plain" class="js">
function clasificar(nota) {
  if (nota >= 9) {
    return "Excelente";
  } else if (nota >= 6) {
    return "Aprobado";
  } else {
    return "A recuperar";
  }
}
console.log(clasificar(9.5), clasificar(7), clasificar(3));

const edad = 20;
const mensaje = edad >= 18 ? "Puede votar" : "Todavía no";
console.log(mensaje);

console.log(5 === 5, 5 === "5", 5 == "5");
console.log(true && false, true || false, !true);
</script></div>
<div class="b-text">
<p><strong>Truthy y falsy.</strong> En un <code>if</code>, cualquier valor se convierte a booleano. Son <em>falsy</em>: <code>false</code>, <code>0</code>, <code>""</code>, <code>null</code>, <code>undefined</code> y <code>NaN</code>. Todo lo demás es <em>truthy</em>, incluso <code>"0"</code>, <code>[]</code> y <code>{}</code>.</p>
<p><code>??</code> da un valor por defecto solo si lo de la izquierda es <code>null</code> o <code>undefined</code>. <code>||</code> lo da ante <em>cualquier</em> falsy, incluido el <code>0</code>.</p>
</div>
<div class="b-example"><script type="text/plain" class="js">
console.log(Boolean(0), Boolean(""), Boolean("0"));
console.log(Boolean([]), Boolean(null), Boolean("hola"));

const cantidad = 0;
console.log(cantidad || 10);  // 0 es falsy → usa 10
console.log(cantidad ?? 10);  // 0 no es null/undefined → queda 0

const usuario = "";
if (!usuario) {
  console.log("Falta el nombre de usuario");
}
</script></div>

<h2 class="b-h">Predecí</h2>

<section class="mission" data-id="m4" data-core data-mins="25" data-title="Bucles" data-goal="Repetir trabajo con for, while y for...of, y dominar el patrón acumulador.">
<h2 class="b-h">Concepto</h2>
<div class="b-text">
<p>Un <strong>bucle</strong> repite código. <code>for</code> clásico cuando sabés cuántas vueltas das; <code>while</code> cuando repetís hasta que algo se cumpla; <code>for...of</code> para recorrer los elementos de una lista o las letras de un texto.</p>
</div>
<div class="b-example"><script type="text/plain" class="js">
for (let i = 1; i <= 5; i++) {
  console.log("Vuelta", i);
}

let n = 1;
while (n < 100) {
  n = n * 2;
}
console.log("Primera potencia de 2 que llega a 100:", n);

for (const letra of "JS!") {
  console.log(letra);
}
</script></div>
<div class="b-text">
<p><strong>Patrón acumulador:</strong> arrancás con un valor inicial (<code>0</code>, <code>""</code>, <code>[]</code>) y lo actualizás en cada vuelta. <code>break</code> corta el bucle; <code>continue</code> salta a la vuelta siguiente.</p>
</div>
<div class="b-example"><script type="text/plain" class="js">
let suma = 0;
for (let i = 1; i <= 10; i++) {
  if (i % 2 === 0) continue;   // saltea los pares
  suma += i;
}
console.log("Suma de impares hasta 10:", suma);

const numeros = [4, 8, 15, 16, 23, 42];
for (const x of numeros) {
  if (x > 20) {
    console.log("Primer número mayor a 20:", x);
    break;
  }
}
</script></div>
<div class="b-tip"><p><strong>Bucle infinito:</strong> si la condición nunca se vuelve falsa, el bucle no termina. Acá el código se corta solo a los 5 segundos, así que podés experimentar tranquilo.</p></div>

<section class="mission" data-id="m5" data-core data-mins="20" data-title="Arrays" data-goal="Trabajar con listas: índices, agregar y sacar elementos, copiar y desestructurar.">
<h2 class="b-h">Concepto</h2>
<div class="b-text">
<p>Un <strong>array</strong> es una lista ordenada. Los índices arrancan en <code>0</code>, y <code>length</code> dice cuántos elementos hay. Los métodos básicos: <code>push</code> (agrega al final), <code>pop</code> (saca el último), <code>shift</code> (saca el primero), <code>includes</code>, <code>indexOf</code>, <code>slice</code> (copia una parte) y <code>join</code> (une en un texto).</p>
</div>
<div class="b-example"><script type="text/plain" class="js">
const frutas = ["manzana", "banana", "kiwi"];
console.log(frutas[0], frutas.length);
console.log(frutas[frutas.length - 1]);   // el último

frutas.push("uva");
const sacada = frutas.shift();
console.log(frutas, "| saqué:", sacada);

console.log(frutas.includes("kiwi"), frutas.indexOf("uva"));
console.log(frutas.slice(0, 2));
console.log(frutas.join(" + "));
console.log("a-b-c".split("-"));
</script></div>
<div class="b-text">
<p><strong>Copiar no es lo mismo que referenciar.</strong> Asignar un array a otra variable <em>no lo copia</em>: las dos variables apuntan a la misma lista. Para copiar usá el spread <code>[...arr]</code>. El spread también sirve para unir arrays, y la <strong>desestructuración</strong> saca elementos a variables en una línea.</p>
</div>
<div class="b-example"><script type="text/plain" class="js">
const a = [1, 2, 3];
const b = a;          // misma lista
const c = [...a];     // copia
b.push(4);
console.log(a, c);

const todos = [...a, ...[10, 20]];
console.log(todos);

const [primero, segundo, ...resto] = todos;
console.log(primero, segundo, resto);
</script></div>

<section class="mission" data-id="m6" data-core data-mins="25" data-title="Objetos" data-goal="Agrupar datos relacionados, leerlos y modificarlos, y usar desestructuración, spread y JSON.">
<h2 class="b-h">Concepto</h2>
<div class="b-text">
<p>Un <strong>objeto</strong> agrupa datos relacionados en pares <em>clave: valor</em>. Accedés con punto (<code>persona.nombre</code>) o con corchetes (<code>persona["nombre"]</code>), que sirve cuando la clave está guardada en una variable. Si un valor es una función, se llama <strong>método</strong>, y adentro <code>this</code> es el propio objeto.</p>
</div>
<div class="b-example"><script type="text/plain" class="js">
const persona = {
  nombre: "Ada",
  edad: 36,
  lenguajes: ["JS", "Python"],
  saludar() {
    return `Hola, soy ${this.nombre}`;
  },
};

console.log(persona.nombre, persona["edad"]);
console.log(persona.lenguajes[0]);
console.log(persona.saludar());

persona.ciudad = "Londres";   // agregar
persona.edad++;               // modificar
delete persona.lenguajes;     // borrar
console.log(persona);
</script></div>
<div class="b-text">
<p><strong>Desestructurar y spread</strong> son atajos que vas a ver en todo código moderno. <code>Object.keys</code> y <code>Object.entries</code> te dejan recorrer un objeto, y <code>JSON</code> lo convierte a texto (para guardarlo o mandarlo por internet) y de vuelta.</p>
</div>
<div class="b-example"><script type="text/plain" class="js">
const auto = { marca: "Fiat", modelo: "600", anio: 1965 };

const { marca, anio } = auto;
console.log(marca, anio);

const actualizado = { ...auto, anio: 1970 };  // copia con un cambio
console.log(actualizado, auto.anio);

console.log(Object.keys(auto));
for (const [clave, valor] of Object.entries(auto)) {
  console.log(`${clave} = ${valor}`);
}

const json = JSON.stringify(auto);
console.log(json, JSON.parse(json).modelo);
</script></div>

<section class="mission" data-id="m7" data-core data-mins="30" data-title="Métodos de array" data-goal="Reemplazar bucles por map, filter, find y reduce, y encadenarlos como una receta.">
<h2 class="b-h">Concepto</h2>
<div class="b-text">
<p>Estos métodos reciben una función y la aplican a cada elemento. Son lo que más vas a usar en JavaScript real:</p>
<ul>
<li><code>map</code>: transforma cada elemento (devuelve un array del mismo largo).</li>
<li><code>filter</code>: se queda con los que cumplen la condición.</li>
<li><code>find</code>: devuelve el primero que cumple (o <code>undefined</code>).</li>
<li><code>reduce</code>: combina todo en un solo valor (una suma, un objeto...).</li>
<li><code>some</code> / <code>every</code>: ¿alguno cumple? / ¿todos cumplen?</li>
</ul>
</div>
<div class="b-example"><script type="text/plain" class="js">
const precios = [100, 250, 40, 980];

const conIva = precios.map(p => Math.round(p * 1.21));
const caros = precios.filter(p => p > 200);
const primeroBarato = precios.find(p => p < 50);
const total = precios.reduce((acum, p) => acum + p, 0);

console.log(conIva);
console.log(caros, primeroBarato, total);
console.log(precios.some(p => p > 900), precios.every(p => p > 50));
</script></div>
<div class="b-text">
<p><strong>Encadenar:</strong> como <code>map</code> y <code>filter</code> devuelven arrays nuevos, se pueden encadenar y se leen como una receta paso a paso. Ojo con <code>sort</code>: ordena <em>modificando</em> el array y, por defecto, compara como texto. Para números pasale <code>(a, b) =&gt; a - b</code>.</p>
</div>
<div class="b-example"><script type="text/plain" class="js">
const alumnos = [
  { nombre: "Ana", nota: 8 },
  { nombre: "Beto", nota: 4 },
  { nombre: "Caro", nota: 10 },
  { nombre: "Dani", nota: 6 },
];

const aprobados = alumnos
  .filter(a => a.nota >= 6)
  .map(a => a.nombre.toUpperCase());
console.log(aprobados);

const promedio = alumnos.reduce((suma, a) => suma + a.nota, 0) / alumnos.length;
console.log("Promedio:", promedio);

console.log([10, 1, 5, 100].sort());                // ¡ojo!
console.log([10, 1, 5, 100].sort((a, b) => a - b));
</script></div>

<h2 class="b-h">Predecí</h2>

<section class="mission" data-id="m8" data-mins="20" data-title="Scope y closures" data-goal="Entender dónde vive cada variable y cómo una función recuerda el lugar donde nació.">
<h2 class="b-h">Concepto</h2>
<div class="b-text">
<p>El <strong>scope</strong> es dónde existe una variable. <code>let</code> y <code>const</code> viven solo dentro del bloque <code>{ }</code> donde se declaran. Una función puede leer variables de afuera, pero las de adentro no se ven desde afuera.</p>
</div>
<div class="b-example"><script type="text/plain" class="js">
const global = "afuera";

function prueba() {
  const local = "adentro";
  console.log(global, local);   // ve las dos
}
prueba();

if (true) {
  const bloque = "solo dentro del if";
  console.log(bloque);
}

// Sacale las barras y ejecutá:
// console.log(local);
</script></div>
<div class="b-text">
<p>Un <strong>closure</strong> pasa cuando una función <em>recuerda</em> las variables del lugar donde fue creada, aun después de que ese lugar terminó de ejecutarse. Sirve para tener estado privado y para crear funciones a medida.</p>
</div>
<div class="b-example"><script type="text/plain" class="js">
function crearContador() {
  let cuenta = 0;               // nadie de afuera puede tocarla
  return function () {
    cuenta++;
    return cuenta;
  };
}

const contadorA = crearContador();
const contadorB = crearContador();
console.log(contadorA(), contadorA(), contadorA());
console.log(contadorB());       // cada uno tiene su propia cuenta

const multiplicarPor = (factor) => (n) => n * factor;
const triple = multiplicarPor(3);
console.log(triple(5));
</script></div>

<h2 class="b-h">Predecí</h2>

function memorizar(fn) {
  const cache = {};
  return (n) => {
    if (!(n in cache)) {
      cache[n] = fn(n);
    }
    return cache[n];
  };
}
</script>

<section class="mission" data-id="m9" data-mins="20" data-title="Clases" data-goal="Crear moldes de objetos con class, constructor, métodos, getters y herencia.">
<h2 class="b-h">Concepto</h2>
<div class="b-text">
<p>Una <strong>clase</strong> es un molde para crear muchos objetos con los mismos datos y comportamientos. El <code>constructor</code> se ejecuta cuando hacés <code>new</code>, y <code>this</code> es el objeto que se está creando. Un <code>get</code> es un método que se lee como propiedad. Con <code>extends</code> una clase hereda de otra, y <code>super(...)</code> llama al constructor del padre.</p>
</div>
<div class="b-example"><script type="text/plain" class="js">
class Cuenta {
  constructor(titular, saldo = 0) {
    this.titular = titular;
    this.saldo = saldo;
  }
  depositar(monto) {
    this.saldo += monto;
    return this.saldo;
  }
  get resumen() {
    return `${this.titular}: $${this.saldo}`;
  }
}

const c = new Cuenta("Lu", 100);
c.depositar(50);
console.log(c.resumen, c instanceof Cuenta);

class CuentaAhorro extends Cuenta {
  constructor(titular, saldo, tasa) {
    super(titular, saldo);
    this.tasa = tasa;
  }
  aplicarInteres() {
    return this.depositar(this.saldo * this.tasa);
  }
}

const ahorro = new CuentaAhorro("Mati", 1000, 0.05);
ahorro.aplicarInteres();
console.log(ahorro.resumen);
console.log(ahorro);
</script></div>

<h2 class="b-h">Predecí</h2>

<div class="hint">Usá el array <code>this.items</code>: <code>push</code> para apilar y <code>pop</code> para desapilar.</div>

<script type="text/plain" class="solution">
class Pila {

<section class="mission" data-id="m10" data-mins="30" data-title="Asincronía" data-goal="Manejar tareas que tardan: setTimeout, promesas, async/await, errores y trabajo en paralelo.">
<h2 class="b-h">Concepto</h2>
<div class="b-text">
<p>JavaScript hace una cosa a la vez, pero no se queda esperando: las tareas lentas (pedir datos a un servidor, un temporizador) se programan para <em>después</em>, y mientras tanto el resto del código sigue. <code>setTimeout(fn, ms)</code> ejecuta <code>fn</code> más tarde, recién cuando el código actual terminó.</p>
</div>
<div class="b-example"><script type="text/plain" class="js">
console.log("1. Antes");
setTimeout(() => console.log("3. El timer (0 ms)"), 0);
console.log("2. Después");
</script></div>
<div class="b-text">
<p>Una <strong>Promise</strong> representa un valor que va a llegar (o fallar). Con <code>async/await</code> escribís código asíncrono como si fuera paso a paso: <code>await</code> espera la promesa y te da su valor. Los errores se atrapan con <code>try / catch</code>, y <code>Promise.all</code> espera varias promesas a la vez.</p>
</div>
<div class="b-example"><script type="text/plain" class="js">
function pedirUsuario(id) {
  return new Promise((resolve, reject) => {
    setTimeout(() => {
      if (id > 0) resolve({ id, nombre: "Usuario " + id });
      else reject(new Error("ID inválido"));
    }, 300);
  });
}

async function main() {
  console.log("Pidiendo...");
  const u = await pedirUsuario(7);
  console.log("Llegó:", u);

  try {
    await pedirUsuario(-1);
  } catch (error) {
    console.log("Falló:", error.message);
  }

  const varios = await Promise.all([pedirUsuario(1), pedirUsuario(2)]);
  console.log(varios.map(u => u.nombre));
}

main();
</script></div>
<div class="b-tip"><p><strong>En la vida real</strong> esto es <code>const res = await fetch(url); const datos = await res.json();</code>. Es exactamente el mismo patrón: una función que devuelve una promesa.</p></div>

<section class="mission" data-id="m11" data-core data-mins="30" data-title="El DOM" data-goal="Controlar una página web desde JavaScript: encontrar elementos, cambiarlos y reaccionar a eventos.">
<h2 class="b-h">Concepto</h2>
<div class="b-text">
<p>En el navegador, JavaScript controla la página a través del <strong>DOM</strong>: un árbol de objetos que representa el HTML. Siempre son los mismos tres pasos:</p>
<ol>
<li><strong>Encontrar</strong> elementos: <code>document.querySelector("#id")</code> (el primero que coincide) o <code>querySelectorAll(".clase")</code> (todos).</li>
<li><strong>Cambiarlos</strong>: <code>textContent</code>, <code>classList</code>, <code>style</code>, <code>hidden</code>.</li>
<li><strong>Reaccionar</strong> a eventos: <code>addEventListener("click", fn)</code>.</li>
</ol>
<p>Acá cada ejemplo tiene una vista previa real. Ejecutalo y después hacé clic en la página.</p>
</div>
<div class="b-example">
<script type="text/plain" class="html">
<h1 id="titulo">Hola</h1>
<button id="btn">Sumar clic</button>
<p class="nota">Clics: 0</p>
</script>
<script type="text/plain" class="js">
const titulo = document.querySelector("#titulo");
const boton = document.querySelector("#btn");
const nota = document.querySelector(".nota");
let clics = 0;

titulo.textContent = "¡Hola desde JS!";
titulo.style.color = "tomato";

boton.addEventListener("click", () => {
  clics++;
  nota.textContent = `Clics: ${clics}`;
  console.log("clic número", clics);
});
</script>
</div>
<div class="b-text">
<p><strong>Crear elementos:</strong> <code>document.createElement("li")</code> crea un nodo nuevo; lo configurás y lo agregás a la página con <code>append</code>. Así se construyen listas a partir de datos, que es lo que hace cualquier app.</p>
</div>
<div class="b-example">
<script type="text/plain" class="html">
<input id="entrada" placeholder="Nueva tarea">
<button id="agregar">Agregar</button>
<ul id="lista"></ul>
</script>
<script type="text/plain" class="js">
const entrada = document.querySelector("#entrada");
const lista = document.querySelector("#lista");

function agregarTarea(texto) {
  const li = document.createElement("li");
  li.textContent = texto;
  li.addEventListener("click", () => li.classList.toggle("hecha"));
  lista.append(li);
}

["Aprender variables", "Entender map", "Dominar el DOM"].forEach(agregarTarea);

document.querySelector("#agregar").addEventListener("click", () => {
  if (entrada.value.trim() === "") return;
  agregarTarea(entrada.value);
  entrada.value = "";
});
</script>
</div>

<h2 class="b-h">Predecí</h2>
<div class="b-quiz" data-id="q11-1" data-answer="1" data-noverify data-prose>
<p class="q">Hay tres elementos con <code>class="item"</code>. ¿Qué devuelve <code>document.querySelector(".item")</code>?</p>
<script type="text/plain" class="opt">Un array con los tres</script>
<script type="text/plain" class="opt">El primero de los tres</script>
<script type="text/plain" class="opt">El último de los tres</script>
<script type="text/plain" class="opt">null, porque hay más de uno</script>
<div class="why"><p><code>querySelector</code> devuelve siempre el primero que coincide (o <code>null</code> si no hay ninguno). Para todos usá <code>querySelectorAll</code>, que devuelve una lista que se recorre con <code>for...of</code>.</p></div>
</div>
<div class="b-quiz" data-id="q11-2" data-answer="1" data-noverify data-prose>
<p class="q">Tenés <code>&lt;p id="m"&gt;&lt;/p&gt;</code> y ejecutás <code>m.textContent = "&lt;b&gt;Hola&lt;/b&gt;"</code>. ¿Qué se ve en la página?</p>
<script type="text/plain" class="opt">Hola, en negrita</script>
<script type="text/plain" class="opt">El texto <b>Hola</b> literal, con las etiquetas</script>
<script type="text/plain" class="opt">Nada</script>
<script type="text/plain" class="opt">Un error</script>
<div class="why"><p><code>textContent</code> trata todo como texto y no interpreta HTML. Eso es más seguro: evita que alguien inyecte código en tu página. <code>innerHTML</code> sí interpreta etiquetas; usalo solo con contenido tuyo.</p></div>
</div>

<h2 class="b-h">Desafíos</h2>
<div class="b-challenge" data-id="c11-1" data-title="Contador con botones">

categoriaMayor de __G es "comida" :: categoriaMayor(__G) ==> "comida"
categoriaMayor con otros datos :: categoriaMayor([{ fecha: "2026-10-01", categoria: "ocio", monto: 10 }, { fecha: "2026-10-02", categoria: "comida", monto: 5 }]) ==> "ocio"

<div class="hint"><code>totalPorCategoria</code> es como contar palabras: <code>totales[g.categoria] = (totales[g.categoria] || 0) + g.monto</code>.</div>
<div class="hint"><code>categoriaMayor</code> puede reutilizar <code>totalPorCategoria</code> y recorrer <code>Object.entries</code> buscando el máximo.</div>
<div class="hint"><code>delMes</code>: <code>filter</code> con <code>g.fecha.startsWith(mes)</code> ya crea un array nuevo, así que después podés usar <code>sort</code> sin tocar el original.</div>
<script type="text/plain" class="solution">
function totalPorCategoria(gastos) {
  const totales = {};
  for (const g of gastos) {
    totales[g.categoria] = (totales[g.categoria] || 0) + g.monto;
  }
  return totales;
}

function categoriaMayor(gastos) {
  const totales = totalPorCategoria(gastos);
  let mayor = null;
  for (const [categoria, total] of Object.entries(totales)) {
    if (mayor === null || total > totales[mayor]) mayor = categoria;
  }
  return mayor;
}

function delMes(gastos, mes) {
  return gastos
    .filter(g => g.fecha.startsWith(mes))
    .sort((a, b) => b.monto - a.monto);
}

function resumen(gastos) {
  const total = gastos.reduce((suma, g) => suma + g.monto, 0);
  return `${gastos.length} gastos · Total: $${total} · Mayor: ${categoriaMayor(gastos)}`;
}
</script>

function makeAIBox(title) {
  const body = h("div", { class: "ai-body" });
  const stop = h("button", { type: "button", hidden: true }, "Detener");
  const box = h("div", { class: "ai-box", hidden: true }, h("div", { class: "who" }, h("span", {}, title), stop), body);
  let ctl = null;
  stop.addEventListener("click", () => ctl && ctl.abort());
  async function ask(prompt, opts) {
    if (!SAMPLE) return;
    if (ctl) ctl.abort();
    ctl = new AbortController();
    const mine = ctl;
    box.hidden = false; stop.hidden = false;
    body.innerHTML = "<p>Pensando…</p>";
    try {
      const { truncated } = await SAMPLE(prompt, Object.assign({ signal: mine.signal, onText: ({ text }) => { body.innerHTML = md(text); } }, opts));
      if (truncated) body.append(h("p", { class: "frame-note" }, "(La respuesta se cortó por largo.)"));
    } catch (e) {
      const msg = aiErrorText(e);
      if (e && e.text && e.code !== "refused") body.innerHTML = md(e.text); else body.replaceChildren();
      if (msg) body.append(h("p", { class: "frame-note" }, msg));
      if (!msg && !body.textContent.trim()) box.hidden = true;
    } finally {
      if (ctl === mine) { stop.hidden = true; ctl = null; }
    }
  }
  return { box, ask };
}

function renderQuiz(b, n) {
  const card = h("section", { class: "quiz", id: b.id });
  card.append(h("p", { class: "eyebrow" }, "Predicción " + n), h("p", { class: "q", html: b.q || "¿Qué muestra la consola?" }));
  if (b.code) card.append(codeBlock(b.code));
  const opts = h("div", { class: "opts" + (b.prose ? " prose-opts" : ""), role: "group", "aria-label": "Opciones" });
  const buttons = b.options.map((o, i) => h("button", { class: "opt", type: "button", onclick: () => answer(i) }, h("span", { class: "opt-k" }, "ABCD"[i]), h("span", { class: "opt-v" }, o)));
  opts.append(...buttons);
  const fb = h("div", { class: "why", hidden: true });
  const out = makeConsole();
  card.append(opts, fb, out.el);
  function answer(i) {
    if (store.quiz[b.id] != null) return;
    store.quiz[b.id] = i;
    save();
    if (i === b.answer) addXP(10, "Predicción correcta"); else paintProgress();
    paint();
    if (currentMission) checkMissionComplete(currentMission);
  }
  function paint() {
    const s = store.quiz[b.id];
    if (s == null) return;
    opts.classList.add("answered");
    buttons.forEach((btn, i) => {
      btn.disabled = true;
      if (i === b.answer) btn.classList.add("correct");
      else if (i === s) btn.classList.add("wrong");
    });
    const ok = s === b.answer;
    fb.hidden = false;
    fb.innerHTML = '<p><span class="verdict ' + (ok ? "ok" : "bad") + '">' + (ok ? "¡Bien!" : "Era la " + "ABCD"[b.answer] + ".") + "</span> " + plainInner(b.why) + "</p>";
    if (b.code && !b.noverify) {
      const btn = h("button", { class: "btn ghost", type: "button" }, "▶ Ejecutar y comprobar");
      btn.addEventListener("click", async () => { btn.disabled = true; out.clear(); await runCode({ code: b.code, onEvent: out.event }); btn.disabled = false; });
      fb.append(h("div", { class: "toolbar", style: "margin-top:10px" }, btn));
    }
  }
  paint();
  return card;
}
const plainInner = (html) => html.replace(/^\s*<p>/, "").replace(/<\/p>\s*$/, "");

function renderChallenge(b, m, n) {
  const card = h("section", { class: "challenge" + (store.done[b.id] ? " solved" : ""), id: b.id });
  const status = h("span", { class: "status" }, store.done[b.id] ? "Resuelto" : "Pendiente");
  card.append(h("div", { class: "ch-head" }, h("p", { class: "eyebrow" }, "Desafío " + m.num + "." + n), status), h("h3", {}, b.title), h("div", { class: "prose", html: b.prompt }));
  if (b.pre) card.append(h("details", { class: "pre" }, h("summary", {}, "Código que ya está cargado"), codeBlock(b.pre)));

  let lastRun = null;
  const run = async () => {
    btnRun.disabled = true;
    out.clear();
    paintTests(null);
    const code = editor.value;
    const res = await runCode({ code, pre: b.pre, tests: b.tests, html: b.html, host: frameHost, onEvent: out.event });
    btnRun.disabled = false;
    lastRun = { res, code };
    paintTests(res);
    const all = res.results.every((r) => r.pass);
    if (all && !store.done[b.id]) {
      store.done[b.id] = true;
      save();
      card.classList.add("solved", "pop");
      status.textContent = "Resuelto";
      addXP(store.peek[b.id] ? 10 : 30, "Desafío resuelto");
      checkMissionComplete(m);
    } else if (all) toast("Todas las pruebas pasan");
  };
  const editor = makeEditor(store.code[b.id] != null ? store.code[b.id] : b.starter, {
    id: "ed-" + b.id, label: "Tu solución para " + b.title, onRun: run,
    onChange: (v) => { store.code[b.id] = v; save(); },
  });
  let frameHost = null;
  if (b.html != null) {
    frameHost = h("div", { class: "frame-host" });
    card.append(h("div", { class: "dom-split" },
      h("div", { class: "dom-col" }, h("p", { class: "label" }, "HTML de la página"), codeBlock(b.html, "html"), h("p", { class: "label" }, "Tu JavaScript"), editor.el),
      h("div", { class: "dom-col" }, h("p", { class: "label" }, "Vista previa"), frameHost, h("p", { class: "frame-note" }, "Las pruebas hacen clics y escriben en tu página; después podés seguir probando a mano."))));
    setTimeout(() => runCode({ code: "", html: b.html, host: frameHost }), 0);
  } else card.append(editor.el);

  const btnRun = h("button", { class: "btn primary", type: "button", onclick: run }, "▶ Probar ", h("span", { class: "k" }, "Ctrl+Enter"));
  const btnReset = h("button", { class: "btn ghost", type: "button" }, "Reiniciar");
  let resetArmed = false;
  btnReset.addEventListener("click", () => {
    if (!resetArmed) { resetArmed = true; btnReset.textContent = "¿Borrar tu código?"; btnReset.classList.add("warn"); setTimeout(() => { resetArmed = false; btnReset.textContent = "Reiniciar"; btnReset.classList.remove("warn"); }, 3000); return; }
    resetArmed = false; btnReset.textContent = "Reiniciar"; btnReset.classList.remove("warn");
    editor.setValue(b.starter);
  });
  const hintsEl = h("ol", { class: "hints", hidden: true });
  const btnHint = h("button", { class: "btn", type: "button" });
  const paintHints = () => {
    const shown = store.hints[b.id] || 0;
    hintsEl.replaceChildren(...b.hints.slice(0, shown).map((x) => h("li", { html: x })));
    hintsEl.hidden = shown === 0;
    btnHint.textContent = shown >= b.hints.length ? "Sin más pistas" : "Pista " + (shown + 1) + "/" + b.hints.length;
    btnHint.disabled = shown >= b.hints.length;
  };
  btnHint.addEventListener("click", () => { store.hints[b.id] = Math.min((store.hints[b.id] || 0) + 1, b.hints.length); save(); paintHints(); });
  paintHints();

  const ai = makeAIBox("Pista de Claude");
  const btnAI = h("button", { class: "btn ai ai-only", type: "button" }, "Pedile una pista a Claude");
  btnAI.addEventListener("click", () => ai.ask(hintPrompt(b, editor.value, lastRun), { modelTier: "quick" }));

  const solBox = h("div", { class: "solution", hidden: true });
  const btnSol = h("button", { class: "btn ghost", type: "button" }, "Ver solución");
  let solArmed = false;
  const showSolution = () => {
    const copy = h("button", { class: "btn", type: "button" }, "Copiar al editor");
    copy.addEventListener("click", () => editor.setValue(b.solution));
    solBox.replaceChildren(h("p", { class: "label" }, "Una solución posible"), codeBlock(b.solution), h("div", { class: "toolbar" }, copy));
    solBox.hidden = false;
    btnSol.hidden = true;
  };
  btnSol.addEventListener("click", () => {
    if (store.peek[b.id] || store.done[b.id]) { store.peek[b.id] = true; save(); showSolution(); return; }
    if (!solArmed) {
      solArmed = true;
      btnSol.textContent = "¿Seguro? Resolverlo después vale 10 XP en vez de 30";
      btnSol.classList.add("warn");
      setTimeout(() => { if (solArmed) { solArmed = false; btnSol.textContent = "Ver solución"; btnSol.classList.remove("warn"); } }, 4000);
      return;
    }
    store.peek[b.id] = true; save(); showSolution();
  });
  if (store.peek[b.id]) showSolution();

  const out = makeConsole();
  const testsList = h("ol", { class: "tests" });
  const testsCount = h("span", { class: "tests-count" });
  function paintTests(res) {
    testsList.replaceChildren();
    let passed = 0;
    b.tests.forEach((t, i) => {
      const r = res ? res.results[i] : null;
      const li = h("li", { class: "test" + (r ? (r.pass ? " pass" : " fail") : "") }, h("span", { class: "ic", "aria-hidden": "true" }, r ? (r.pass ? "✓" : "✗") : "·"));
      const body = h("div", {}, h("span", {}, t.name), r ? h("span", { class: "sr-only" }) : null);
      if (r && r.pass) passed++;
      if (r && !r.pass) {
        if (r.missing) body.append(h("span", { class: "detail" }, res.timedOut ? "Se cortó antes de llegar a esta prueba." : "No llegó a ejecutarse: tu código se detuvo antes por un error (mirá la consola)."));
        else if (r.error) {
          body.append(h("span", { class: "detail" }, r.error));
          const hint = explainError(r.error);
          if (hint) body.append(h("span", { class: "detail hint", html: mdInline(hint) }));
        } else if (t.kind === "eq") body.append(h("span", { class: "detail" }, "Esperaba " + r.exp + " · obtuve " + r.got));
        else if (t.kind === "log") body.append(h("span", { class: "detail" }, "No apareció en la consola: " + r.exp));
        else if (t.kind === "logs") body.append(h("span", { class: "detail" }, "Esperaba: " + r.exp + "\nObtuve:   " + r.got));
        else if (t.kind === "ok") body.append(h("span", { class: "detail" }, "La condición dio falso."));
      }
      li.append(body);
      testsList.append(li);
    });
    testsCount.textContent = res ? passed + "/" + b.tests.length + " pasan" : b.tests.length + " pruebas";
  }
  paintTests(null);

  card.append(
    h("div", { class: "toolbar" }, btnRun, btnReset, h("span", { class: "spacer" }), btnHint, btnAI, btnSol),
    out.el,
    h("div", { class: "tests-wrap" }, h("div", { class: "tests-head" }, h("p", { class: "label", style: "margin:0" }, "Pruebas"), testsCount), testsList),
    hintsEl, ai.box, solBox);
  return card;
}

function hintPrompt(b, code, lastRun) {
  let results = "Todavía no ejecutó las pruebas.";
  if (lastRun && lastRun.code === code) {
    results = lastRun.res.results.map((r, i) => (r.pass ? "✓ " : "✗ ") + b.tests[i].name +
      (r.pass ? "" : r.error ? " (" + r.error + ")" : r.exp ? " (esperaba " + r.exp + (r.got ? ", obtuvo " + r.got : "") + ")" : r.missing ? " (no se ejecutó: el código falló antes)" : "")).join("\n");
  }
  return "Sos tutor de JavaScript para alguien que está aprendiendo desde cero en una sola noche.\n\n" +
    "DESAFÍO: " + b.title + "\n" + plain(b.prompt) + "\n\n" +
    (b.pre ? "CÓDIGO YA CARGADO (no lo escribe el estudiante):\n" + FENCE + "js\n" + b.pre + "\n" + FENCE + "\n\n" : "") +
    "CÓDIGO DEL ESTUDIANTE:\n" + FENCE + "js\n" + code.slice(0, 6000) + "\n" + FENCE + "\n\n" +
    "RESULTADO DE LAS PRUEBAS:\n" + results + "\n\n" +
    "Dale UNA pista para avanzar, en español rioplatense (voseo), de 2 a 4 oraciones. Si hay un error concreto en su código, señalalo. " +
    "No escribas la solución completa: como mucho una línea de código de ejemplo. Si ya pasan todas las pruebas, felicitalo y sugerí una mejora breve.";
}

function renderMission(m) {
  currentMission = m;

    h("p", { class: "eyebrow" }, "Misión " + m.num + " de " + MISSIONS.length, h("span", {}, "≈" + m.mins + " min"), m.core ? h("span", { class: "chip" }, "Esencial") : null),
    h("h1", {}, m.title),

  for (const b of m.blocks) {
    if (b.type === "quiz" && !explained) { explained = true; view.append(renderExplain(m)); }

  const next = MISSIONS[m.num];
  view.append(h("div", { class: "next" }, next

      h("span", { class: "nav-num" }, String(m.num)), h("span", { class: "nav-title mission" }, m.title), h("span", { class: "nav-count" })));
  }
  nav.append(h("div", { class: "rail-label" }, "Referencia"),
    h("a", { class: "nav-item text", href: "#chuleta", "data-id": "chuleta" }, h("span", { class: "nav-num" }, "{}"), h("span", { class: "nav-title" }, "Chuleta")));
}
function route() {
  const id = decodeURIComponent(location.hash.slice(1)) || "inicio";
  const m = MISSIONS.find((x) => x.id === id);
  if (m) { renderMission(m); store.last = m.id; save(); }
  else if (id === "chuleta") renderCheats();
  else renderHome();
  const active = m ? m.id : id === "chuleta" ? "chuleta" : "inicio";
  $$("#nav a").forEach((a) => { if (a.dataset.id === active) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  const cur = $('#nav a[aria-current="page"]');
  if (cur && cur.scrollIntoView && window.matchMedia("(max-width: 900px)").matches) cur.scrollIntoView({ block: "nearest", inline: "center" });
  window.scrollTo(0, 0);
  paintProgress();
  requestAnimationFrame(syncEditors);
}

// ---------------------------------------------------------------- session clock & sprints
const t0 = Date.now();
let sprint = null;
const clock = (ms) => { const s = Math.max(0, Math.round(ms / 1000)); const hh = Math.floor(s / 3600), mm = Math.floor((s % 3600) / 60), ss = s % 60; return (hh ? hh + ":" + String(mm).padStart(2, "0") : mm) + ":" + String(ss).padStart(2, "0"); };
function paintSprint() {
  const btn = $("#sprint");
  if (!sprint) { btn.textContent = "Sprint 25"; btn.classList.remove("on"); return; }
  btn.classList.add("on");
  btn.textContent = (sprint.phase === "foco" ? "Foco " : "Pausa ") + clock(sprint.end - Date.now());
}
$("#sprint").addEventListener("click", () => {
  if (sprint) { sprint = null; toast("Sprint detenido"); }
  else { sprint = { phase: "foco", end: Date.now() + 25 * 60000 }; toast("25 minutos de foco. Celular lejos."); }
  paintSprint();
});
setInterval(() => {
  $("#session").textContent = clock(Date.now() - t0);
  if (sprint && sprint.end <= Date.now()) {
    if (sprint.phase === "foco") { sprint = { phase: "pausa", end: Date.now() + 5 * 60000 }; toast("¡Sprint terminado! 5 minutos de pausa: parate, estirate, tomá agua."); }
    else { sprint = null; toast("Fin de la pausa. Arrancá otro sprint cuando quieras."); }
  }
  if (sprint) paintSprint();
}, 1000);

// ---------------------------------------------------------------- tutor chat
const turns = [];
let chatCtl = null;
function openTutor(prefill) {
  if (!SAMPLE) return;
  $("#tutor").hidden = false; $("#scrim").hidden = false;
  paintSuggestions();
  if (prefill) $("#chat-input").value = prefill;
  $("#chat-input").focus();
}
function closeTutor() { $("#tutor").hidden = true; $("#scrim").hidden = true; }
function paintSuggestions() {
  const m = currentMission;
  const list = m
    ? ["Dame un ejercicio extra de " + m.title.toLowerCase(), "¿Cuál es el error más común en " + m.title.toLowerCase() + "?", "Explicame esto con una analogía"]
    : ["¿Qué diferencia hay entre let y const?", "¿Para qué se usa JavaScript en el mundo real?", "Armame un plan para seguir mañana"];
  $("#suggest").replaceChildren(...list.map((s) => h("button", { type: "button", onclick: () => { $("#chat-input").value = s; sendChat(); } }, s)));
}
function chatRules() {
  const m = currentMission;
  return "Sos el tutor de JavaScript de \"Desvelo JS\", una app donde alguien está aprendiendo JavaScript desde cero en una sola noche. " +
    "Hablá en español rioplatense (voseo), con calidez pero directo. Respondé corto (máximo 150 palabras) salvo que te pidan más. " +
    "Usá ejemplos de código breves en bloques " + FENCE + "js. Si te piden la solución de un desafío, primero dale una pista y ofrecé la solución si la sigue pidiendo. " +
    "Si te pide un ejercicio, dáselo con un enunciado claro y un ejemplo de entrada/salida, sin la solución. " +
    (m ? "Ahora está en la Misión " + m.num + " de 12: \"" + m.title + "\" (" + m.goal + ")." : "Ahora está en la pantalla de inicio.") +
    " Temario completo: variables, funciones, decisiones, bucles, arrays, objetos, métodos de array, closures, clases, asincronía, DOM y un proyecto final.";
}
async function sendChat() {
  const input = $("#chat-input");
  const text = input.value.trim();
  if (!text || !SAMPLE || chatCtl) return;
  input.value = "";
  const chat = $("#chat");
  chat.append(h("div", { class: "msg user", html: md(text) }));
  const bubble = h("div", { class: "msg bot" }, h("p", {}, "Pensando…"));
  chat.append(bubble);
  chat.scrollTop = chat.scrollHeight;
  turns.push({ role: "user", content: text });
  while (turns.length > 14) turns.shift();
  if (turns[0] && turns[0].role !== "user") turns.shift();
  chatCtl = new AbortController();
  $("#chat-send").hidden = true; $("#chat-stop").hidden = false;
  try {
    const { text: answer } = await SAMPLE([{ role: "user", content: chatRules() }, ...turns], {
      cache: false, signal: chatCtl.signal,
      onText: ({ text: t }) => { bubble.innerHTML = md(t); chat.scrollTop = chat.scrollHeight; },
    });
    turns.push({ role: "assistant", content: answer });
  } catch (e) {
    const msg = aiErrorText(e);
    if (e && e.text && e.code !== "refused") { bubble.innerHTML = md(e.text); turns.push({ role: "assistant", content: e.text }); }
    else bubble.replaceChildren();
    if (msg) bubble.append(h("p", { class: "msg-err" }, msg));
    if (!bubble.textContent.trim()) bubble.remove();
  } finally {
    chatCtl = null;
    $("#chat-send").hidden = false; $("#chat-stop").hidden = true;
  }
}
$("#tutor-btn").addEventListener("click", () => openTutor());
$("#tutor-close").addEventListener("click", closeTutor);
$("#scrim").addEventListener("click", closeTutor);
$("#chat-stop").addEventListener("click", () => chatCtl && chatCtl.abort());
$("#chat-form").addEventListener("submit", (e) => { e.preventDefault(); sendChat(); });
$("#chat-input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendChat(); } });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#tutor").hidden) closeTutor(); });

// ---------------------------------------------------------------- boot
const setTopH = () => document.documentElement.style.setProperty("--top-h", $("#topbar").offsetHeight + "px");
window.addEventListener("resize", setTopH);
setTopH();
buildNav();
window.addEventListener("hashchange", route);
route();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { setTopH(); syncEditors(); });

// Self-check hook: runs every solution against its tests and every quiz against its answer.
window.desvelo = {
  missions: MISSIONS,
  async verify() {
    const report = [];
    for (const m of MISSIONS) for (const b of m.blocks) {
      if (b.type === "challenge") {
        const host = b.html != null ? $("#offscreen") : null;
        const ok = await runCode({ code: b.solution, pre: b.pre, tests: b.tests, html: b.html, host });
        const bad = ok.results.map((r, i) => r.pass ? null : { test: b.tests[i].name, r }).filter(Boolean);
        if (bad.length || ok.gotError) report.push({ id: b.id, problem: "la solución no pasa", bad, gotError: ok.gotError });
        const st = await runCode({ code: b.starter, pre: b.pre, tests: b.tests, html: b.html, host });
        if (st.results.every((r) => r.pass)) report.push({ id: b.id, problem: "el código inicial ya pasa" });
      } else if (b.type === "quiz" && !b.noverify) {
        const lines = [];
        await runCode({ code: b.code, onEvent: (e) => { if (e.kind === "log") lines.push(e.text); } });
        if (lines.join("\n") !== b.options[b.answer]) report.push({ id: b.id, problem: "la respuesta no coincide", got: lines.join("\n"), want: b.options[b.answer] });
      } else if (b.type === "example") {
        const errs = [];
        await runCode({ code: b.code, html: b.html, host: b.html != null ? $("#offscreen") : null, onEvent: (e) => { if (e.kind === "error") errs.push(e.text); } });
        if (errs.length) report.push({ id: b.id, problem: "el ejemplo da error", errs });
      }
    }
    return report;
  },
};
})();
</script>
