<section class="mission" data-id="m6" data-track="base" data-mins="30" data-title="Listas (arrays)" data-goal="Guardar muchos valores en una sola variable, leerlos por posición y recorrerlos.">
<h2 class="b-h">Una variable, muchos valores</h2>
<div class="b-text">
<p>¿Y si tenés que guardar los nombres de 30 alumnos? Crear 30 variables sería un lío. Un <dfn data-g="array">array</dfn> (o lista) guarda muchos valores, en orden, dentro de una sola variable. Se escribe con corchetes <code>[ ]</code> y los valores separados por comas.</p>
<p>Imaginalo como un tren: cada vagón tiene un valor y un número de posición, que se llama <dfn data-g="indice">índice</dfn>. <strong>Los índices empiezan en 0</strong>, no en 1.</p>
</div>
<div class="b-trace"><script type="text/plain" class="js">
const frutas = ["manzana", "banana", "kiwi"];
console.log(frutas[0]);
console.log(frutas[2]);
console.log(frutas.length);
</script><script type="text/plain" class="steps">
1 ¦ frutas = ["manzana", "banana", "kiwi"] ¦  ¦ Se crea una caja que guarda una lista de 3 textos. Posiciones: "manzana" en la 0, "banana" en la 1, "kiwi" en la 2.
2 ¦  ¦ manzana ¦ <code>frutas[0]</code> significa "el elemento en la posición 0": el primero.
3 ¦  ¦ kiwi ¦ <code>frutas[2]</code> es el tercero. Como las posiciones empiezan en 0, el tercero está en la 2.
4 ¦  ¦ 3 ¦ <code>.length</code> dice cuántos elementos tiene la lista: 3. Fijate que la última posición (2) es siempre <code>length - 1</code>.
</script></div>
<div class="b-quiz" data-id="q5-1" data-answer="1">
<script type="text/plain" class="code">
const lista = [10, 20, 30];
console.log(lista[3], lista.length);
</script>
<script type="text/plain" class="opt">30 3</script>
<script type="text/plain" class="opt">undefined 3</script>
<script type="text/plain" class="opt">Error</script>
<script type="text/plain" class="opt">undefined 4</script>
<div class="why"><p>Las posiciones van de 0 a 2. <code>lista[3]</code> no existe, y JavaScript no da error: devuelve <code>undefined</code>.</p></div>
</div>

<h2 class="b-h">Agregar, sacar y buscar</h2>
<div class="b-text">
<ul>
<li><code>lista.push(x)</code>: agrega <code>x</code> al final.</li>
<li><code>lista.pop()</code>: saca el último elemento (y te lo devuelve).</li>
<li><code>lista[1] = "pera"</code>: reemplaza lo que hay en la posición 1.</li>
<li><code>lista.includes(x)</code>: ¿está <code>x</code> en la lista? <code>true</code> o <code>false</code>.</li>
<li><code>lista.indexOf(x)</code>: en qué posición está <code>x</code> (da -1 si no está).</li>
</ul>
</div>
<div class="b-example"><script type="text/plain" class="js">
const compras = ["pan", "leche"];
compras.push("yerba");
console.log(compras);
console.log(compras.length);

compras[0] = "pan integral";
console.log(compras);

const ultimo = compras.pop();
console.log("Saqué:", ultimo);
console.log(compras);

console.log(compras.includes("leche"));
console.log(compras.indexOf("leche"));
</script></div>
<div class="b-text"><p>¿Por qué se puede modificar <code>compras</code> si es <code>const</code>? Porque <code>const</code> sella la <em>caja</em>: no podés guardar otra lista en ella. Pero no impide cambiar lo que hay <em>dentro</em> de la lista.</p></div>
<div class="b-challenge" data-mini data-id="t6-1" data-title="Lista de compras">
<div class="prompt"><p>Partiendo de <code>const compras = ["pan", "leche"]</code>, agregá <code>"café"</code> al final con <code>push</code>. Después mostrá en la consola cuántos elementos tiene la lista, usando <code>.length</code>.</p></div>
<script type="text/plain" class="starter">
const compras = ["pan", "leche"];
// agregá "café"

// mostrá cuántos elementos hay

</script>
<script type="text/plain" class="tests">
La lista quedó ["pan", "leche", "café"] :: compras ==> ["pan", "leche", "café"]
Usás push :: src ==> \.push\(
Mostrás la cantidad usando .length :: __logs.some(l => l.includes("3")) && /\.length/.test(__src)
</script>
<div class="hint"><code>compras.push("café");</code></div>
<div class="hint"><code>console.log(compras.length);</code></div>
<script type="text/plain" class="solution">
const compras = ["pan", "leche"];
compras.push("café");
console.log(compras.length);
</script>
</div>

<h2 class="b-h">Recorrer una lista</h2>
<div class="b-text"><p>Para hacer algo con cada elemento, se recorre la lista con un bucle. La forma más clara es <code>for...of</code>: en cada vuelta, la variable toma el siguiente elemento.</p></div>
<div class="b-trace"><script type="text/plain" class="js">
const precios = [100, 250, 40];
let total = 0;
for (const precio of precios) {
  total = total + precio;
}
console.log(total);
</script><script type="text/plain" class="steps">
1 ¦ precios = [100, 250, 40] ¦  ¦ Una lista con tres precios.
2 ¦ total = 0 ¦  ¦ El acumulador arranca en 0.
3 ¦ precio = 100 ¦  ¦ Primera vuelta: <code>precio</code> toma el primer elemento, 100.
4 ¦ total = 100 ¦  ¦ 0 + 100 = 100.
3 ¦ precio = 250 ¦  ¦ Segunda vuelta: <code>precio</code> pasa a ser el segundo elemento.
4 ¦ total = 350 ¦  ¦ 100 + 250 = 350.
3 ¦ precio = 40 ¦  ¦ Tercera vuelta: el último elemento.
4 ¦ total = 390 ¦  ¦ 350 + 40 = 390.
5 ¦ -precio ¦ 390 ¦ No quedan elementos: el bucle termina y se muestra el total.
</script></div>
<div class="b-text"><p>También podés usar el <code>for</code> con contador para recorrer las posiciones, de 0 a <code>length - 1</code>. Sirve cuando además del elemento necesitás saber su posición:</p></div>
<div class="b-example"><script type="text/plain" class="js">
const podio = ["Ana", "Beto", "Caro"];
for (let i = 0; i < podio.length; i++) {
  console.log(`Puesto ${i + 1}: ${podio[i]}`);
}
</script>
<ol class="explain">
<li><code>i</code> arranca en 0 (la primera posición) y avanza mientras sea menor que <code>podio.length</code> (3).</li>
<li><code>podio[i]</code> es el elemento en la posición <code>i</code>.</li>
<li>Mostramos <code>i + 1</code> porque las personas cuentan desde 1, aunque JavaScript cuente desde 0.</li>
</ol>
</div>

<h2 class="b-h">Copiar no es lo mismo que asignar</h2>
<div class="b-text"><p>Un detalle que confunde a todo el mundo: si hacés <code>const b = a</code> con una lista, <strong>no</strong> se copia. Las dos variables apuntan a <em>la misma</em> lista: si cambiás una, cambia la otra. Para hacer una copia de verdad se usa <code>[...a]</code> (los tres puntos "vuelcan" los elementos dentro de una lista nueva).</p></div>
<div class="b-example"><script type="text/plain" class="js">
const a = [1, 2, 3];
const b = a;        // misma lista, otro nombre
const c = [...a];   // copia independiente

b.push(4);
console.log(a);
console.log(c);
</script></div>
<div class="b-quiz" data-id="q5-2" data-answer="1">
<script type="text/plain" class="code">
const x = [1, 2];
const y = x;
y.push(3);
console.log(x.length);
</script>
<script type="text/plain" class="opt">2</script>
<script type="text/plain" class="opt">3</script>
<script type="text/plain" class="opt">undefined</script>
<script type="text/plain" class="opt">Error: x es const</script>
<div class="why"><p><code>x</code> e <code>y</code> son la misma lista con dos nombres. Y <code>const</code> impide guardar otra cosa en la variable, no modificar el contenido de la lista.</p></div>
</div>

<div class="b-recap"><ul>
<li>Un array guarda muchos valores en orden: <code>["a", "b", "c"]</code>.</li>
<li>Las posiciones empiezan en 0. <code>lista[0]</code> es el primero; <code>lista.length</code>, la cantidad.</li>
<li><code>push</code> agrega al final, <code>pop</code> saca el último, <code>includes</code> pregunta si está.</li>
<li><code>for (const x of lista)</code> recorre todos los elementos.</li>
<li><code>b = a</code> no copia la lista; <code>[...a]</code>, sí.</li>
</ul></div>

<h2 class="b-h">Desafíos</h2>
<div class="b-challenge" data-id="c5-1" data-title="El máximo, a mano">
<div class="prompt"><p>Escribí <code>maximo(nums)</code> que devuelva el número más grande de la lista, recorriéndola con un bucle (sin usar <code>Math.max</code>).</p></div>
<script type="text/plain" class="starter">
function maximo(nums) {

}
</script>
<script type="text/plain" class="tests">
maximo([3, 9, 2]) da 9 :: maximo([3, 9, 2]) ==> 9
Funciona con negativos :: maximo([-5, -1, -9]) ==> -1
Un solo elemento :: maximo([7]) ==> 7
Sin usar Math.max :: !src ==> Math\.max

<div class="hint">Guardá "el mayor visto hasta ahora" en una variable, recorré la lista y actualizala cuando encuentres uno más grande.</div>

<div class="b-challenge" data-id="c5-4" data-title="Promedio">
<div class="prompt"><p>Escribí <code>promedio(notas)</code> que devuelva el promedio de una lista de números: la suma de todos, dividida por la cantidad.</p></div>
<script type="text/plain" class="starter">
function promedio(notas) {

}
</script>
<script type="text/plain" class="tests">
promedio([8, 6, 10]) da 8 :: promedio([8, 6, 10]) ==> 8
promedio([5]) da 5 :: promedio([5]) ==> 5
promedio([7, 8]) da 7.5 :: promedio([7, 8]) ==> 7.5

}

<script type="text/plain" class="tests">
[1, 2, 2, 3, 1] → [1, 2, 3] :: sinDuplicados([1, 2, 2, 3, 1]) ==> [1, 2, 3]
Funciona con textos :: sinDuplicados(["a", "b", "a"]) ==> ["a", "b"]
Lista vacía :: sinDuplicados([]) ==> []
No modifica la original :: (() => { const o = [1, 1]; sinDuplicados(o); return o.length === 2; })()

<script type="text/plain" class="solution">
function sinDuplicados(arr) {
  const resultado = [];
  for (const x of arr) {
    if (!resultado.includes(x)) {
      resultado.push(x);
    }

<!-- ============================ MISIÓN 7 ============================ -->
<section class="mission" data-id="m7" data-track="base" data-mins="30" data-title="Objetos" data-goal="Agrupar los datos de una misma cosa con nombre, leerlos, cambiarlos y combinarlos con listas.">
<h2 class="b-h">Una ficha con datos</h2>
<div class="b-text">
<p>Un array sirve para muchos valores en orden. Pero ¿cómo guardás los datos de <em>una persona</em>: nombre, edad, ciudad? Para eso está el <dfn data-g="objeto">objeto</dfn>: una ficha donde cada dato tiene un nombre.</p>
<p>Se escribe con llaves <code>{ }</code> y, adentro, pares <code>nombre: valor</code> separados por comas. Cada par se llama <dfn data-g="propiedad">propiedad</dfn>.</p>
</div>
<div class="b-trace"><script type="text/plain" class="js">
const persona = { nombre: "Ana", edad: 30 };
console.log(persona.nombre);
persona.edad = 31;
persona.ciudad = "Lima";
console.log(persona);
</script><script type="text/plain" class="steps">
1 ¦ persona = { nombre: "Ana", edad: 30 } ¦  ¦ Se crea un objeto con dos propiedades: <code>nombre</code> vale "Ana" y <code>edad</code> vale 30.
2 ¦  ¦ Ana ¦ Para leer una propiedad: el objeto, un punto y el nombre de la propiedad. <code>persona.nombre</code> es "Ana".
3 ¦ persona = { nombre: "Ana", edad: 31 } ¦  ¦ Se cambia el valor de una propiedad que ya existía.
4 ¦ persona = { nombre: "Ana", edad: 31, ciudad: "Lima" } ¦  ¦ Si la propiedad no existía, se agrega.
5 ¦  ¦ { nombre: 'Ana', edad: 31, ciudad: 'Lima' } ¦ Al mostrar el objeto entero se ven todas sus propiedades.
</script></div>
<div class="b-text"><p>Cuando un objeto tiene muchas propiedades, se escribe una por línea. Es exactamente lo mismo; solo se lee mejor:</p></div>
<div class="b-example"><script type="text/plain" class="js">
const libro = {
  titulo: "Rayuela",
  autor: "Julio Cortázar",
  paginas: 600,
  leido: false,
};

console.log(libro.titulo);
console.log(libro.autor + " escribió " + libro.titulo);
console.log(libro.paginas > 300);

libro.leido = true;
console.log(libro);
</script>
<ol class="explain">
<li>Un objeto con cuatro propiedades de distintos tipos: texto, número y booleano.</li>
<li><code>libro.titulo</code> lee una propiedad.</li>
<li>Las propiedades se usan como cualquier variable: se pueden pegar con textos...</li>
<li>...o usar en comparaciones.</li>
<li><code>libro.leido = true</code> cambia una propiedad.</li>
</ol>
</div>
<div class="b-challenge" data-mini data-id="t7-1" data-title="Tu mascota">
<div class="prompt"><p>Creá un objeto <code>mascota</code> con tres propiedades: <code>nombre</code> (texto), <code>especie</code> (texto) y <code>edad</code> (número). Después mostrá en la consola solo el nombre.</p></div>

</script>

Tiene especie (texto) :: typeof mascota.especie === "string"
Tiene edad (número) :: typeof mascota.edad === "number"
Mostrás el nombre :: __logs.includes(mascota.nombre)
</script>

</div>

<h2 class="b-h">Corchetes: cuando el nombre está en una variable</h2>
<div class="b-text"><p>Además del punto, podés leer una propiedad con corchetes y su nombre como texto: <code>persona["nombre"]</code>. Sirve cuando el nombre de la propiedad está guardado en una variable.</p></div>
<div class="b-quiz" data-id="q6-2" data-answer="0">
<script type="text/plain" class="code">
const user = { nombre: "Lu" };
const clave = "nombre";
console.log(user.clave, user[clave]);
</script>
<script type="text/plain" class="opt">undefined Lu</script>
<script type="text/plain" class="opt">Lu Lu</script>
<script type="text/plain" class="opt">nombre Lu</script>
<script type="text/plain" class="opt">Error</script>
<div class="why"><p><code>user.clave</code> busca una propiedad que se llame literalmente "clave", y no existe. <code>user[clave]</code> usa el <em>valor</em> de la variable, o sea <code>user["nombre"]</code>.</p></div>
</div>

<h2 class="b-h">Listas de objetos</h2>
<div class="b-text"><p>En la vida real casi siempre vas a tener <strong>listas de objetos</strong>: los productos de una tienda, los mensajes de un chat, los alumnos de un curso. Se recorren con <code>for...of</code> como cualquier lista, y en cada vuelta tenés un objeto completo.</p></div>
<div class="b-example"><script type="text/plain" class="js">
const alumnos = [
  { nombre: "Ana", nota: 8 },
  { nombre: "Beto", nota: 4 },
  { nombre: "Caro", nota: 10 },
];

for (const alumno of alumnos) {
  if (alumno.nota >= 6) {
    console.log(alumno.nombre + " aprobó");
  } else {
    console.log(alumno.nombre + " tiene que recuperar");
  }
}
</script>
<ol class="explain">
<li>Una lista con tres objetos, uno por alumno.</li>
<li>En cada vuelta, <code>alumno</code> es uno de esos objetos.</li>
<li><code>alumno.nota</code> y <code>alumno.nombre</code> leen los datos del alumno de esa vuelta.</li>
<li>Combina todo lo que viste: listas, objetos, bucles y decisiones.</li>
</ol>
</div>

<h2 class="b-h">Extra: copiar un objeto</h2>
<div class="b-text"><p>Igual que con las listas, <code>const b = a</code> no copia un objeto. Para crear uno nuevo con los mismos datos se usan los tres puntos: <code>{ ...a }</code>. Y podés cambiar algo en el mismo paso.</p></div>
<div class="b-example"><script type="text/plain" class="js">
const base = { nombre: "Lu", edad: 30 };
const copia = { ...base, edad: 31 };

console.log(base);
console.log(copia);
</script></div>
<div class="b-quiz" data-id="q6-3" data-answer="3">
<script type="text/plain" class="code">
const base = { a: 1, b: 2 };
const nuevo = { ...base, b: 3, c: 4 };
console.log(nuevo);
</script>
<script type="text/plain" class="opt">{ a: 1, b: 2, c: 4 }</script>
<script type="text/plain" class="opt">{ b: 3, c: 4 }</script>
<script type="text/plain" class="opt">{ a: 1, b: 2, b: 3, c: 4 }</script>
<script type="text/plain" class="opt">{ a: 1, b: 3, c: 4 }</script>
<div class="why"><p>Los tres puntos copian <code>a</code> y <code>b</code>; después <code>b: 3</code> pisa el valor anterior y <code>c</code> se agrega. Un objeto no puede tener dos propiedades con el mismo nombre.</p></div>
</div>

<div class="b-recap"><ul>
<li>Un objeto agrupa datos con nombre: <code>{ nombre: "Ana", edad: 30 }</code>.</li>
<li>Se lee y se cambia con punto: <code>persona.edad = 31</code>. Si la propiedad no existe, se crea.</li>
<li>Con corchetes, <code>persona[clave]</code>, el nombre puede venir de una variable.</li>
<li>Las listas de objetos se recorren con <code>for...of</code>.</li>
<li><code>{ ...a }</code> crea una copia del objeto.</li>
</ul></div>

<section class="mission" data-id="m8" data-track="base" data-mins="35" data-title="Tu primera página" data-goal="Controlar una página web desde JavaScript: encontrar elementos, cambiarlos y reaccionar cuando alguien hace clic.">
<h2 class="b-h">Cómo está hecha una página</h2>
<div class="b-text">
<p>Una página web se escribe en <strong>HTML</strong>: un lenguaje de etiquetas que dice qué hay en la página. Por ejemplo, <code>&lt;h1&gt;</code> es un título, <code>&lt;p&gt;</code> un párrafo y <code>&lt;button&gt;</code> un botón. Casi todas las etiquetas se abren y se cierran: <code>&lt;p&gt;Hola&lt;/p&gt;</code>.</p>
<p>A una etiqueta le podés poner un <code>id</code>, un nombre único para encontrarla: <code>&lt;h1 id="titulo"&gt;</code>. HTML arma la página; JavaScript la hace reaccionar.</p>
<p>Desde JavaScript, la página se maneja a través del <dfn data-g="dom">DOM</dfn>. Siempre son los mismos tres pasos:</p>
<ol>
<li><strong>Encontrar</strong> un elemento: <code>document.querySelector("#titulo")</code>. <code>document</code> es la página; el <code>#</code> significa "el que tiene este id".</li>
<li><strong>Cambiarlo</strong>: por ejemplo, su texto con <code>.textContent = "nuevo texto"</code>.</li>
<li><strong>Reaccionar</strong> a lo que hace la persona (un clic, escribir) con <code>addEventListener</code>.</li>
</ol>
</div>
<div class="b-example">
<script type="text/plain" class="html">
<h1 id="titulo">Hola</h1>
<p id="mensaje">Este texto lo escribió el HTML.</p>
</script>
<script type="text/plain" class="js">
const titulo = document.querySelector("#titulo");
titulo.textContent = "¡Hola desde JavaScript!";
titulo.style.color = "tomato";

const mensaje = document.querySelector("#mensaje");
mensaje.textContent = "Y este lo cambió JavaScript.";
</script>
<ol class="explain">
<li>Busca en la página el elemento con <code>id="titulo"</code> y lo guarda en la variable <code>titulo</code>.</li>
<li>Le cambia el texto. Mirá la vista previa antes y después de ejecutar.</li>
<li><code>.style</code> cambia cómo se ve: acá, el color.</li>
<li>Lo mismo con el párrafo: encontrarlo y cambiarle el texto.</li>
</ol>
</div>
<div class="b-challenge" data-mini data-id="t8-1" data-title="Cambiá el título">
<div class="prompt"><p>Encontrá el título con <code>document.querySelector("#titulo")</code> y cambiale el texto a <code>¡Lo cambié yo!</code> usando <code>textContent</code>.</p></div>

</script>

</script>

</script>

</div>

<h2 class="b-h">Reaccionar a un clic</h2>
<div class="b-text">
<p>Un <dfn data-g="evento">evento</dfn> es algo que pasa en la página: un clic, una tecla, escribir en un campo. Con <code>addEventListener</code> le decís a un elemento: <em>"cuando pase tal evento, ejecutá esta función"</em>.</p>
<p>La función se escribe ahí mismo, casi siempre como función flecha sin parámetros: <code>() =&gt; { ... }</code>. Fijate que no la llamás vos: se la entregás al botón, y el navegador la va a llamar <strong>cada vez</strong> que alguien haga clic.</p>
</div>
<div class="b-example">
<script type="text/plain" class="html">
<button id="btn">Sumar clic</button>
<p id="nota">Clics: 0</p>
</script>
<script type="text/plain" class="js">
const boton = document.querySelector("#btn");
const nota = document.querySelector("#nota");
let clics = 0;

boton.addEventListener("click", () => {
  clics++;
  nota.textContent = `Clics: ${clics}`;
  console.log("clic número", clics);
});
</script>
<ol class="explain">
<li>Encontramos el botón y el párrafo.</li>
<li>Creamos un contador de clics que arranca en 0.</li>
<li><code>addEventListener("click", ...)</code>: "cuando hagan clic en el botón, ejecutá esta función".</li>
<li>Adentro de la función: sumamos 1 al contador y actualizamos el texto del párrafo.</li>
<li>Ejecutá el código y después hacé clic varias veces en el botón de la vista previa.</li>
</ol>
</div>

<h2 class="b-h">Crear elementos nuevos</h2>
<div class="b-text"><p><code>document.createElement("li")</code> crea un elemento nuevo (acá, un ítem de lista). Lo configurás y lo agregás a la página con <code>append</code>. Así se construyen listas a partir de datos, que es lo que hace cualquier aplicación.</p></div>
<div class="b-example">
<script type="text/plain" class="html">
<input id="entrada" placeholder="Nueva tarea">
<button id="agregar">Agregar</button>
<ul id="lista"></ul>
</script>
<script type="text/plain" class="js">
const entrada = document.querySelector("#entrada");
const lista = document.querySelector("#lista");

function agregarTarea(texto) {
  const li = document.createElement("li");
  li.textContent = texto;
  lista.append(li);
}

agregarTarea("Aprender variables");
agregarTarea("Entender funciones");

document.querySelector("#agregar").addEventListener("click", () => {
  if (entrada.value.trim() === "") {
    return;
  }
  agregarTarea(entrada.value);
  entrada.value = "";
});
</script>
<ol class="explain">
<li>Encontramos el campo de texto y la lista vacía.</li>
<li><code>agregarTarea</code> crea un <code>li</code>, le pone el texto y lo agrega al final de la lista.</li>
<li>La llamamos dos veces para arrancar con dos tareas.</li>
<li>Al hacer clic en "Agregar": si el campo está vacío, <code>return</code> corta la función sin hacer nada.</li>
<li>Si no, agrega lo que se escribió (<code>entrada.value</code>) y vacía el campo.</li>
</ol>
</div>

<h2 class="b-h">Predecí</h2>
<div class="b-quiz" data-id="q11-1" data-answer="1" data-noverify data-prose>
<p class="q">Hay tres elementos con <code>class="item"</code>. ¿Qué devuelve <code>document.querySelector(".item")</code>?</p>
<script type="text/plain" class="opt">Un array con los tres</script>

<script type="text/plain" class="opt">El último de los tres</script>
<script type="text/plain" class="opt">null, porque hay más de uno</script>
<div class="why"><p><code>querySelector</code> devuelve siempre el primero que coincide (o <code>null</code> si no hay ninguno). Para todos usá <code>querySelectorAll</code>, que devuelve una lista que se recorre con <code>for...of</code>.</p></div>
</div>
<div class="b-quiz" data-id="q11-2" data-answer="1" data-noverify data-prose>
<p class="q">Tenés <code>&lt;p id="m"&gt;&lt;/p&gt;</code> y ejecutás <code>m.textContent = "&lt;b&gt;Hola&lt;/b&gt;"</code>. ¿Qué se ve en la página?</p>
<script type="text/plain" class="opt">Hola, en negrita</script>
<script type="text/plain" class="opt">El texto <b>Hola</b> literal, con las etiquetas</script>
<script type="text/plain" class="opt">Nada</script>
<script type="text/plain" class="opt">Un error</script>
<div class="why"><p><code>textContent</code> trata todo como texto y no interpreta HTML. Eso es más seguro: evita que alguien inyecte código en tu página. <code>innerHTML</code> sí interpreta etiquetas; usalo solo con contenido tuyo.</p></div>
</div>

<div class="b-recap"><ul>
<li>HTML arma la página; JavaScript la modifica a través del DOM.</li>
<li><code>document.querySelector("#id")</code> encuentra un elemento (el <code>#</code> busca por id).</li>
<li><code>.textContent</code> cambia su texto; <code>.style</code>, cómo se ve.</li>
<li><code>addEventListener("click", () =&gt; { ... })</code> ejecuta esa función cada vez que alguien hace clic.</li>
<li><code>document.createElement</code> crea elementos nuevos y <code>append</code> los agrega a la página.</li>
</ul></div>

<!-- ============================ MISIÓN 9 ============================ -->
<section class="mission" data-id="m9" data-track="mas" data-mins="35" data-title="Métodos de array" data-goal="Reemplazar bucles por map, filter, find y reduce, y encadenarlos como una receta.">
<h2 class="b-h">Funciones como valores</h2>
<div class="b-text">
<p>Esta misión arranca la parte <strong>Para seguir</strong>. Si llegaste hasta acá desde cero: ya sabés lo esencial de JavaScript.</p>
<p>Una idea clave para lo que viene: en JavaScript una función es un valor más, como un número o un texto. Se puede guardar en una variable y, sobre todo, <strong>pasar como argumento a otra función</strong>. Las funciones flecha cortas son ideales para eso: <code>n =&gt; n * 2</code> se lee "dado n, devolvé n * 2" (con un solo parámetro, los paréntesis son opcionales).</p>
</div>
<div class="b-example"><script type="text/plain" class="js">
function aplicar(fn, valor) {
  return fn(valor);
}

console.log(aplicar(n => n * 2, 21));
console.log(aplicar(texto => texto.toUpperCase(), "grito"));
</script>
<ol class="explain">
<li><code>aplicar</code> recibe una función (<code>fn</code>) y un valor, y devuelve el resultado de llamar a <code>fn</code> con ese valor.</li>
<li>Le pasamos una función que duplica: devuelve 42.</li>
<li>Le pasamos otra función, que pasa a mayúsculas: devuelve "GRITO". Misma <code>aplicar</code>, distinto comportamiento.</li>
</ol>
</div>
<div class="b-challenge" data-mini data-id="c2-3" data-title="Dos veces">
<div class="prompt"><p>Escribí <code>dosVeces(fn, x)</code>, que aplique la función <code>fn</code> dos veces seguidas sobre <code>x</code> y devuelva el resultado. Por ejemplo, <code>dosVeces(n =&gt; n + 3, 1)</code> da <code>7</code>.</p></div>
<script type="text/plain" class="starter">
function dosVeces(fn, x) {

}
</script>
<script type="text/plain" class="tests">
dosVeces(n => n + 3, 1) devuelve 7 :: dosVeces(n => n + 3, 1) ==> 7
dosVeces(s => s + "!", "hola") devuelve "hola!!" :: dosVeces(s => s + "!", "hola") ==> "hola!!"
dosVeces(n => n * n, 3) devuelve 81 :: dosVeces(n => n * n, 3) ==> 81
</script>
<div class="hint"><code>fn(x)</code> aplica la función una vez. ¿Qué pasa si le pasás ese resultado otra vez a <code>fn</code>?</div>
<div class="hint"><code>return fn(fn(x));</code></div>
<script type="text/plain" class="solution">
function dosVeces(fn, x) {
  return fn(fn(x));
}
</script>
</div>
<h2 class="b-h">Concepto</h2>
<div class="b-text">
<p>Estos métodos reciben una función y la aplican a cada elemento. Son lo que más vas a usar en JavaScript real:</p>
<ul>
<li><code>map</code>: transforma cada elemento (devuelve un array del mismo largo).</li>
<li><code>filter</code>: se queda con los que cumplen la condición.</li>
<li><code>find</code>: devuelve el primero que cumple (o <code>undefined</code>).</li>
<li><code>reduce</code>: combina todo en un solo valor (una suma, un objeto...).</li>
<li><code>some</code> / <code>every</code>: ¿alguno cumple? / ¿todos cumplen?</li>
</ul>
</div>
<div class="b-example"><script type="text/plain" class="js">
const precios = [100, 250, 40, 980];

const conIva = precios.map(p => Math.round(p * 1.21));
const caros = precios.filter(p => p > 200);
const primeroBarato = precios.find(p => p < 50);
const total = precios.reduce((acum, p) => acum + p, 0);

console.log(conIva);
console.log(caros, primeroBarato, total);
console.log(precios.some(p => p > 900), precios.every(p => p > 50));
</script></div>
<div class="b-text">

<section class="mission" data-id="m10" data-track="mas" data-mins="20" data-title="Scope y closures" data-goal="Entender dónde vive cada variable y cómo una función recuerda el lugar donde nació.">
<h2 class="b-h">Concepto</h2>
<div class="b-text">
<p>El <strong>scope</strong> es dónde existe una variable. <code>let</code> y <code>const</code> viven solo dentro del bloque <code>{ }</code> donde se declaran. Una función puede leer variables de afuera, pero las de adentro no se ven desde afuera.</p>
</div>
<div class="b-example"><script type="text/plain" class="js">
const global = "afuera";

function prueba() {
  const local = "adentro";
  console.log(global, local);   // ve las dos
}
prueba();

if (true) {
  const bloque = "solo dentro del if";
  console.log(bloque);
}

// Sacale las barras y ejecutá:
// console.log(local);
</script></div>
<div class="b-text">
<p>Un <strong>closure</strong> pasa cuando una función <em>recuerda</em> las variables del lugar donde fue creada, aun después de que ese lugar terminó de ejecutarse. Sirve para tener estado privado y para crear funciones a medida.</p>
</div>
<div class="b-example"><script type="text/plain" class="js">
function crearContador() {
  let cuenta = 0;               // nadie de afuera puede tocarla
  return function () {
    cuenta++;
    return cuenta;
  };
}

const contadorA = crearContador();
const contadorB = crearContador();
console.log(contadorA(), contadorA(), contadorA());
console.log(contadorB());       // cada uno tiene su propia cuenta

const multiplicarPor = (factor) => (n) => n * factor;
const triple = multiplicarPor(3);
console.log(triple(5));
</script></div>

<h2 class="b-h">Predecí</h2>

}

<div class="why"><p>El <code>let x</code> de adentro es <em>otra</em> variable que solo existe en la función. La de afuera queda intacta. Si hubieras escrito <code>x = 2</code> sin <code>let</code>, sí la cambiabas.</p></div>
</div>

<section class="mission" data-id="m11" data-track="mas" data-mins="20" data-title="Clases" data-goal="Crear moldes de objetos con class, constructor, métodos, getters y herencia.">
<h2 class="b-h">Concepto</h2>
<div class="b-text">
<p>Una <strong>clase</strong> es un molde para crear muchos objetos con los mismos datos y comportamientos. El <code>constructor</code> se ejecuta cuando hacés <code>new</code>, y <code>this</code> es el objeto que se está creando. Un <code>get</code> es un método que se lee como propiedad. Con <code>extends</code> una clase hereda de otra, y <code>super(...)</code> llama al constructor del padre.</p>
</div>
<div class="b-example"><script type="text/plain" class="js">
class Cuenta {
  constructor(titular, saldo = 0) {
    this.titular = titular;
    this.saldo = saldo;
  }
  depositar(monto) {
    this.saldo += monto;
    return this.saldo;
  }
  get resumen() {
    return `${this.titular}: $${this.saldo}`;
  }
}

const c = new Cuenta("Lu", 100);
c.depositar(50);
console.log(c.resumen, c instanceof Cuenta);

class CuentaAhorro extends Cuenta {
  constructor(titular, saldo, tasa) {
    super(titular, saldo);
    this.tasa = tasa;
  }
  aplicarInteres() {
    return this.depositar(this.saldo * this.tasa);
  }
}

const ahorro = new CuentaAhorro("Mati", 1000, 0.05);
ahorro.aplicarInteres();
console.log(ahorro.resumen);
console.log(ahorro);
</script></div>

<h2 class="b-h">Predecí</h2>
<div class="b-quiz" data-id="q9-1" data-answer="1">

<div class="why"><p>Por dentro, una clase es una función especial. <code>class</code> es una sintaxis más cómoda sobre el sistema de prototipos que JavaScript tuvo siempre.</p></div>

<div class="b-challenge" data-id="c9-2" data-title="Una pila">
<div class="prompt"><p>Una <strong>pila</strong> es como una pila de platos: el último que ponés es el primero que sacás. Creá la clase <code>Pila</code> con:</p>
<ul><li><code>apilar(x)</code>: agrega arriba.</li><li><code>desapilar()</code>: saca y devuelve el de arriba (o <code>undefined</code> si está vacía).</li><li><code>verTope()</code>: devuelve el de arriba sin sacarlo.</li><li><code>tamanio</code>: un <strong>getter</strong> con la cantidad de elementos.</li><li><code>estaVacia()</code>: <code>true</code> si no hay nada.</li></ul></div>
<script type="text/plain" class="starter">
class Pila {
  constructor() {
    this.items = [];
  }
}
</script>
<script type="text/plain" class="tests">
Arranca vacía :: new Pila().estaVacia() ==> true
apilar y verTope :: (() => { const p = new Pila(); p.apilar(1); p.apilar(2); return p.verTope(); })() ==> 2
desapilar devuelve el último :: (() => { const p = new Pila(); p.apilar("a"); p.apilar("b"); return [p.desapilar(), p.desapilar()]; })() ==> ["b", "a"]
tamanio es un getter :: (() => { const p = new Pila(); p.apilar(1); p.apilar(1); return p.tamanio; })() ==> 2
desapilar en una pila vacía da undefined :: new Pila().desapilar() === undefined
</script>
<div class="hint">Usá el array <code>this.items</code>: <code>push</code> para apilar y <code>pop</code> para desapilar.</div>
<div class="hint">El getter: <code>get tamanio() { return this.items.length; }</code></div>
<script type="text/plain" class="solution">
class Pila {
  constructor() {
    this.items = [];
  }
  apilar(x) {
    this.items.push(x);
  }
  desapilar() {
    return this.items.pop();
  }
  verTope() {
    return this.items[this.items.length - 1];
  }
  get tamanio() {
    return this.items.length;
  }
  estaVacia() {
    return this.items.length === 0;
  }
}

<section class="mission" data-id="m12" data-track="mas" data-mins="30" data-title="Asincronía" data-goal="Manejar tareas que tardan: setTimeout, promesas, async/await, errores y trabajo en paralelo.">
<h2 class="b-h">Concepto</h2>
<div class="b-text">
<p>JavaScript hace una cosa a la vez, pero no se queda esperando: las tareas lentas (pedir datos a un servidor, un temporizador) se programan para <em>después</em>, y mientras tanto el resto del código sigue. <code>setTimeout(fn, ms)</code> ejecuta <code>fn</code> más tarde, recién cuando el código actual terminó.</p>
</div>
<div class="b-example"><script type="text/plain" class="js">
console.log("1. Antes");
setTimeout(() => console.log("3. El timer (0 ms)"), 0);
console.log("2. Después");
</script></div>
<div class="b-text">
<p>Una <strong>Promise</strong> representa un valor que va a llegar (o fallar). Con <code>async/await</code> escribís código asíncrono como si fuera paso a paso: <code>await</code> espera la promesa y te da su valor. Los errores se atrapan con <code>try / catch</code>, y <code>Promise.all</code> espera varias promesas a la vez.</p>
</div>
<div class="b-example"><script type="text/plain" class="js">
function pedirUsuario(id) {
  return new Promise((resolve, reject) => {
    setTimeout(() => {
      if (id > 0) resolve({ id, nombre: "Usuario " + id });
      else reject(new Error("ID inválido"));
    }, 300);
  });
}

async function main() {
  console.log("Pidiendo...");
  const u = await pedirUsuario(7);
  console.log("Llegó:", u);

  try {
    await pedirUsuario(-1);
  } catch (error) {
    console.log("Falló:", error.message);
  }

  const varios = await Promise.all([pedirUsuario(1), pedirUsuario(2)]);
  console.log(varios.map(u => u.nombre));
}

main();
</script></div>
<div class="b-tip"><p><strong>En la vida real</strong> esto es <code>const res = await fetch(url); const datos = await res.json();</code>. Es exactamente el mismo patrón: una función que devuelve una promesa.</p></div>

<script type="text/plain" class="tests">
totalPorCategoria suma bien :: totalPorCategoria(__G) ==> {"comida":9100,"transporte":1800,"ocio":5600}
totalPorCategoria([]) da {} :: totalPorCategoria([]) ==> {}
categoriaMayor de __G es "comida" :: categoriaMayor(__G) ==> "comida"
categoriaMayor con otros datos :: categoriaMayor([{ fecha: "2026-10-01", categoria: "ocio", monto: 10 }, { fecha: "2026-10-02", categoria: "comida", monto: 5 }]) ==> "ocio"
delMes filtra y ordena de mayor a menor :: delMes(__G, "2026-10").map(g => g.monto) ==> [5600, 3100, 1800, 900, 900]
delMes no modifica el original :: (() => { const antes = JSON.stringify(__G); delMes(__G, "2026-10"); return JSON.stringify(__G) === antes; })()
resumen arma el texto :: resumen(__G) ==> "6 gastos · Total: $16500 · Mayor: comida"

<div class="hint"><code>totalPorCategoria</code> es como contar palabras: <code>totales[g.categoria] = (totales[g.categoria] || 0) + g.monto</code>.</div>
<div class="hint"><code>categoriaMayor</code> puede reutilizar <code>totalPorCategoria</code> y recorrer <code>Object.entries</code> buscando el máximo.</div>
<div class="hint"><code>delMes</code>: <code>filter</code> con <code>g.fecha.startsWith(mes)</code> ya crea un array nuevo, así que después podés usar <code>sort</code> sin tocar el original.</div>
<script type="text/plain" class="solution">
function totalPorCategoria(gastos) {
  const totales = {};
  for (const g of gastos) {
    totales[g.categoria] = (totales[g.categoria] || 0) + g.monto;
  }
  return totales;
}

function categoriaMayor(gastos) {
  const totales = totalPorCategoria(gastos);
  let mayor = null;
  for (const [categoria, total] of Object.entries(totales)) {
    if (mayor === null || total > totales[mayor]) mayor = categoria;
  }
  return mayor;
}

function delMes(gastos, mes) {
  return gastos
    .filter(g => g.fecha.startsWith(mes))
    .sort((a, b) => b.monto - a.monto);
}

function resumen(gastos) {
  const total = gastos.reduce((suma, g) => suma + g.monto, 0);
  return `${gastos.length} gastos · Total: $${total} · Mayor: ${categoriaMayor(gastos)}`;
}
</script>

<dl class="glossary">
<dt data-id="programa">Programa</dt><dd>Una lista de instrucciones que la computadora ejecuta en orden, de arriba hacia abajo.</dd>
<dt data-id="instruccion">Instrucción</dt><dd>Una orden para la computadora, como <code>console.log("hola");</code>. Suele ocupar una línea y terminar con punto y coma.</dd>
<dt data-id="javascript">JavaScript</dt><dd>Un lenguaje de programación. Es el que entienden todos los navegadores web, por eso es el lenguaje de las páginas interactivas. No tiene nada que ver con Java, aunque el nombre se parezca.</dd>
<dt data-id="consola">Consola</dt><dd>Un espacio donde el programa escribe mensajes con <code>console.log</code>. Sirve para ver qué está pasando adentro del programa.</dd>
<dt data-id="string">String (texto)</dt><dd>Un valor de texto. Se escribe entre comillas: <code>"hola"</code>, <code>'hola'</code> o <code>`hola`</code>. Aunque adentro haya dígitos, como <code>"42"</code>, sigue siendo texto.</dd>
<dt data-id="numero">Number (número)</dt><dd>Un valor numérico, sin comillas: <code>42</code>, <code>-7</code>, <code>3.14</code>. Los decimales se escriben con punto.</dd>
<dt data-id="booleano">Boolean (booleano)</dt><dd>Un valor que solo puede ser <code>true</code> (verdadero) o <code>false</code> (falso). Es la respuesta de las comparaciones.</dd>
<dt data-id="undefined">undefined</dt><dd>"Sin valor". Es lo que tiene una variable que todavía no recibió nada, y lo que devuelve una función que no tiene <code>return</code>.</dd>
<dt data-id="comentario">Comentario</dt><dd>Texto que JavaScript ignora, para dejar notas. Empieza con <code>//</code> y llega hasta el final de la línea.</dd>
<dt data-id="error">Error</dt><dd>El aviso que da JavaScript cuando no puede ejecutar una línea. Dice qué pasó y en qué línea. Después de un error, el programa se detiene.</dd>
<dt data-id="variable">Variable</dt><dd>Una caja con nombre que guarda un valor. Se crea con <code>let</code> (se puede cambiar) o <code>const</code> (sellada).</dd>
<dt data-id="valor">Valor</dt><dd>Un dato concreto: un número, un texto, <code>true</code> o <code>false</code>, una lista, un objeto...</dd>
<dt data-id="asignar">Asignar</dt><dd>Guardar un valor en una variable con <code>=</code>. En programación <code>=</code> no significa "es igual"; significa "guardá".</dd>
<dt data-id="tipo">Tipo</dt><dd>La clase de dato que es un valor: number, string, boolean, undefined, objeto... <code>typeof</code> te lo dice.</dd>
<dt data-id="template">Template literal</dt><dd>Un texto entre comillas invertidas <code>`…`</code> donde podés meter valores con <code>${…}</code>: <code>`Hola, ${nombre}`</code>.</dd>
<dt data-id="metodo">Método</dt><dd>Una función que viene incorporada en un valor y se usa con un punto: <code>texto.toUpperCase()</code>, <code>lista.push(x)</code>.</dd>
<dt data-id="funcion">Función</dt><dd>Un bloque de código con nombre que se puede ejecutar (llamar) cuantas veces quieras. Como una receta.</dd>
<dt data-id="llamar">Llamar a una función</dt><dd>Ejecutarla, escribiendo su nombre seguido de paréntesis: <code>saludar()</code>. Definirla solo la guarda; llamarla la ejecuta.</dd>
<dt data-id="parametro">Parámetro</dt><dd>Una variable que la función recibe cuando la llaman. Se escribe entre los paréntesis de la definición: en <code>function saludar(nombre)</code>, el parámetro es <code>nombre</code>.</dd>
<dt data-id="argumento">Argumento</dt><dd>El valor concreto que le pasás a una función al llamarla. En <code>saludar("Ana")</code>, el argumento es <code>"Ana"</code>.</dd>
<dt data-id="return">return</dt><dd>La instrucción con la que una función entrega su resultado a quien la llamó. La función termina en ese momento.</dd>
<dt data-id="bloque">Bloque</dt><dd>Un grupo de instrucciones entre llaves <code>{ }</code>, como el cuerpo de una función o lo que ejecuta un <code>if</code>.</dd>
<dt data-id="comparacion">Comparación</dt><dd>Una pregunta entre dos valores (<code>&gt;</code>, <code>&lt;</code>, <code>===</code>, <code>!==</code>...) que se responde con <code>true</code> o <code>false</code>.</dd>
<dt data-id="condicion">Condición</dt><dd>La pregunta que va entre los paréntesis de un <code>if</code> o de un bucle. Decide si se ejecuta un bloque.</dd>
<dt data-id="bucle">Bucle</dt><dd>Una estructura que repite un bloque de código varias veces: <code>for</code>, <code>while</code>, <code>for...of</code>. Cada repetición se llama vuelta o iteración.</dd>
<dt data-id="array">Array (lista)</dt><dd>Un valor que guarda varios valores en orden, entre corchetes: <code>[1, 2, 3]</code>.</dd>
<dt data-id="indice">Índice</dt><dd>La posición de un elemento dentro de un array. El primero está en la posición 0.</dd>
<dt data-id="objeto">Objeto</dt><dd>Un valor que agrupa datos con nombre, entre llaves: <code>{ nombre: "Ana", edad: 30 }</code>.</dd>
<dt data-id="propiedad">Propiedad</dt><dd>Cada par <code>nombre: valor</code> de un objeto. Se lee con punto: <code>persona.nombre</code>.</dd>
<dt data-id="dom">DOM</dt><dd>La representación de la página web que JavaScript puede leer y modificar. Se accede a ella con <code>document</code>.</dd>
<dt data-id="evento">Evento</dt><dd>Algo que pasa en la página (un clic, una tecla, escribir en un campo) y a lo que JavaScript puede reaccionar con <code>addEventListener</code>.</dd>
</dl>
</template>

<script>
(() => {
"use strict";

// ---------------------------------------------------------------- helpers
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const FENCE = "```";

// ---------------------------------------------------------------- storage (per-viewer convenience only)
const KEY = "desvelo-js-v1";
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { store = {}; }
for (const k of ["done", "quiz", "code", "peek", "hints"]) if (!store[k] || typeof store[k] !== "object") store[k] = {};
if (typeof store.xp !== "number") store.xp = 0;
let saveTimer;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* sin almacenamiento */ } }, 150);
}

// ---------------------------------------------------------------- content parsing
function dedent(s) {
  s = String(s).replace(/^\s*\n/, "").replace(/\s+$/, "");
  const lines = s.split("\n");
  const ind = Math.min(...lines.filter((l) => l.trim()).map((l) => l.match(/^ */)[0].length));
  return Number.isFinite(ind) && ind > 0 ? lines.map((l) => l.slice(ind)).join("\n") : s;
}
const txt = (root, sel) => { const el = root.querySelector(sel); return el ? dedent(el.textContent) : null; };
function parseTests(text) {
  return text.split("\n").map((l) => l.trim()).filter(Boolean).map((line) => {
    const i = line.indexOf(" :: ");
    const name = line.slice(0, i).trim();
    const rest = line.slice(i + 4).trim();
    const j = rest.lastIndexOf(" ==> ");
    const expr = j >= 0 ? rest.slice(0, j).trim() : rest;
    const right = j >= 0 ? rest.slice(j + 5).trim() : null;
    if (expr === "src") return { name, kind: "src", re: right };
    if (expr === "!src") return { name, kind: "nsrc", re: right };
    if (expr === "log" || expr === "logs") return { name, kind: expr, exp: JSON.parse(right) };
    if (right !== null) return { name, kind: "eq", expr, exp: JSON.parse(right) };
    return { name, kind: "ok", expr };
  });
}
const splitFrame = (s) => { const i = s.indexOf("›"); return i < 0 ? ["", s.trim()] : [s.slice(0, i).trim(), s.slice(i + 1).trim()]; };
function parseSteps(text) {
  return text.split("\n").map((l) => l.trim()).filter(Boolean).map((line) => {
    const [ln, vars, out, ...rest] = line.split("¦");
    const ops = vars.split(";").map((s) => s.trim()).filter(Boolean).map((s) => {
      if (s.startsWith("-")) {
        const t = s.slice(1).trim();
        if (t.endsWith("›")) return { del: "frame", frame: t.slice(0, -1).trim() };
        const [frame, name] = splitFrame(t);
        return { del: "var", frame, name };
      }
      const i = s.indexOf(" = ");
      const [frame, name] = splitFrame(s.slice(0, i));
      return { frame, name, value: s.slice(i + 3).trim() };
    });
    return { line: Number(ln.trim()), ops, out: out.trim() === "" ? null : out.trim(), html: rest.join("¦").trim() };
  });
}
const TPL = document.getElementById("contenido").content;
const MISSIONS = $$(".mission", TPL).map((sec, idx) => {
  const m = { id: sec.dataset.id, idx, num: idx, title: sec.dataset.title, mins: Number(sec.dataset.mins), goal: sec.dataset.goal, track: sec.dataset.track || "base", blocks: [] };
  let ex = 0, tr = 0;
  for (const el of sec.children) {
    const c = el.classList;
    if (c.contains("b-h")) m.blocks.push({ type: "heading", text: el.textContent.trim() });
    else if (c.contains("b-text")) m.blocks.push({ type: "text", html: el.innerHTML });
    else if (c.contains("b-tip")) m.blocks.push({ type: "tip", html: el.innerHTML });
    else if (c.contains("b-recap")) m.blocks.push({ type: "recap", html: el.innerHTML });
    else if (c.contains("b-trace")) m.blocks.push({ type: "trace", id: m.id + "-t" + (++tr), code: txt(el, ".js"), steps: parseSteps(txt(el, ".steps")) });
    else if (c.contains("b-example")) m.blocks.push({
      type: "example", id: m.id + "-e" + (++ex), code: txt(el, ".js") || "", html: txt(el, ".html"),
      explain: el.querySelector("ol.explain") ? el.querySelector("ol.explain").innerHTML : null, expectError: el.hasAttribute("data-error"),
    });
    else if (c.contains("b-quiz")) m.blocks.push({
      type: "quiz", id: el.dataset.id, answer: Number(el.dataset.answer), noverify: el.hasAttribute("data-noverify"), prose: el.hasAttribute("data-prose"),
      q: el.querySelector(".q") ? el.querySelector(".q").innerHTML : null, code: txt(el, ".code"),
      options: $$(".opt", el).map((o) => dedent(o.textContent)), why: el.querySelector(".why").innerHTML,
    });
    else if (c.contains("b-challenge")) m.blocks.push({
      type: "challenge", id: el.dataset.id, title: el.dataset.title, mini: el.hasAttribute("data-mini"), prompt: el.querySelector(".prompt").innerHTML,
      pre: txt(el, ".pre"), html: txt(el, ".html"), starter: txt(el, ".starter") || "",
      tests: parseTests(txt(el, ".tests") || ""), hints: $$(".hint", el).map((x) => x.innerHTML), solution: txt(el, ".solution") || "",
    });
  }
  return m;
});
const CHEATS = $$(".cs", TPL).map((el) => ({ title: el.dataset.title, code: dedent(el.querySelector("script").textContent) }));
const GLOSSARY = new Map($$(".glossary dt", TPL).map((dt) => [dt.dataset.id, { term: dt.innerHTML, def: dt.nextElementSibling.innerHTML }]));
const itemsOf = (m) => m.blocks.filter((b) => b.type === "quiz" || b.type === "challenge");
const isDone = (b) => (b.type === "quiz" ? store.quiz[b.id] != null : !!store.done[b.id]);
const ALL_ITEMS = MISSIONS.flatMap(itemsOf);
const TRACKS = [
  { id: "base", name: "Fundamentos", note: "Para esta noche" },
  { id: "mas", name: "Para seguir", note: "Cuando los Fundamentos estén firmes" },
];

// ---------------------------------------------------------------- syntax highlighting
const KW = new Set("const let var function return if else for while do break continue switch case default new class extends super this async await try catch finally throw typeof instanceof in of delete void yield static get set import export from".split(" "));
const LIT = new Set(["true", "false", "null", "undefined", "NaN", "Infinity"]);
const TOK = /(\/\/[^\n]*|\/\*[\s\S]*?(?:\*\/|$))|(`(?:\\[\s\S]|[^\\`])*`?|"(?:\\.|[^\\"\n])*"?|'(?:\\.|[^\\'\n])*'?)|(\b\d[\d_]*(?:\.\d+)?(?:e[+-]?\d+)?\b)|([A-Za-z_$][\w$]*)(\s*\()?/g;
function highlight(src) {
  let out = "", last = 0, m;
  TOK.lastIndex = 0;
  while ((m = TOK.exec(src))) {
    out += esc(src.slice(last, m.index));
    if (m[1]) out += '<span class="t-com">' + esc(m[1]) + "</span>";
    else if (m[2]) out += '<span class="t-str">' + esc(m[2]) + "</span>";
    else if (m[3]) out += '<span class="t-num">' + esc(m[3]) + "</span>";
    else {
      const w = m[4];
      const cls = KW.has(w) ? "t-kw" : LIT.has(w) ? "t-lit" : m[5] ? "t-fn" : /^[A-Z]/.test(w) ? "t-cls" : "";
      out += cls ? '<span class="' + cls + '">' + esc(w) + "</span>" : esc(w);
      if (m[5]) out += esc(m[5]);
    }
    last = TOK.lastIndex;
  }
  return out + esc(src.slice(last));
}
function highlightHTML(src) {
  return esc(src).replace(/(&lt;\/?)([a-zA-Z][\w-]*)([\s\S]*?)(\/?&gt;)/g, (_, a, tag, attrs, b) =>
    '<span class="t-com">' + a + '</span><span class="t-kw">' + tag + "</span>" +
    attrs.replace(/([\w-]+)(=)("[^"]*")/g, '<span class="t-fn">$1</span>$2<span class="t-str">$3</span>') +
    '<span class="t-com">' + b + "</span>");
}
const codeBlock = (code, lang) => h("pre", { class: "code-ro", html: lang === "html" ? highlightHTML(code) : highlight(code) });

// ---------------------------------------------------------------- tiny markdown (for Claude's answers)
function mdInline(s) {
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}
function mdBlocks(s) {
  let html = "";
  for (const para of s.split(/\n{2,}/)) {
    const lines = para.split("\n").filter((l) => l.trim());
    if (!lines.length) continue;
    if (lines.every((l) => /^\s*[-*]\s+/.test(l))) html += "<ul>" + lines.map((l) => "<li>" + mdInline(l.replace(/^\s*[-*]\s+/, "")) + "</li>").join("") + "</ul>";
    else if (lines.every((l) => /^\s*\d+[.)]\s+/.test(l))) html += "<ol>" + lines.map((l) => "<li>" + mdInline(l.replace(/^\s*\d+[.)]\s+/, "")) + "</li>").join("") + "</ol>";
    else html += "<p>" + lines.map((l) => mdInline(l.replace(/^#+\s*/, ""))).join("<br>") + "</p>";
  }
  return html;
}
function md(text) {
  const parts = text.split(/```[\w-]*\n?([\s\S]*?)(?:```|$)/g);
  let html = "";
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 0) html += mdBlocks(parts[i]);
    else html += '<pre class="code-ro">' + highlight(parts[i].replace(/\n$/, "")) + "</pre>";
  }
  return html;
}

// ---------------------------------------------------------------- code runner (sandboxed)
// Runs inside a Web Worker (or a sandboxed iframe for DOM lessons). Stringified, so it must be self-contained.
function desveloRuntime(MODE, RID, SRC) {
  "use strict";
  const G = globalThis;
  const post = MODE === "worker" ? (m) => G.postMessage(m) : (m) => { m.__desvelo = RID; G.parent.postMessage(m, "*"); };
  const logs = [];
  const isId = (k) => /^[A-Za-z_$][\w$]*$/.test(k);
  const q = (s) => "'" + s.replace(/\\/g, "\\\\").replace(/'/g, "\\'").replace(/\n/g, "\\n") + "'";
  function fmt(v, d, seen) {
    d = d || 0; seen = seen || new Set();
    const t = typeof v;
    if (t === "string") return d === 0 ? v : q(v);
    if (t === "number") return Object.is(v, -0) ? "-0" : String(v);
    if (t === "bigint") return v + "n";
    if (t === "boolean" || v === undefined || v === null) return String(v);
    if (t === "symbol") return v.toString();
    if (t === "function") {
      const s = Function.prototype.toString.call(v);
      return /^class\b/.test(s) ? "[class " + (v.name || "anónima") + "]" : "[Function: " + (v.name || "anónima") + "]";
    }
    if (v instanceof Error) return d === 0 ? v.name + ": " + v.message : "[" + v.name + ": " + v.message + "]";
    if (seen.has(v)) return "[Circular]";
    if (v instanceof Promise) return "Promise { … }";
    if (typeof Element !== "undefined" && v instanceof Element) {
      const cls = typeof v.className === "string" && v.className.trim() ? "." + v.className.trim().split(/\s+/).join(".") : "";
      return "<" + v.tagName.toLowerCase() + (v.id ? "#" + v.id : "") + cls + ">";
    }
    if (v instanceof Date) return isNaN(v) ? "Invalid Date" : v.toISOString();
    if (v instanceof RegExp) return String(v);
    if (d > 2) return Array.isArray(v) ? "[Array]" : "[Object]";
    seen.add(v);
    try {
      if (Array.isArray(v) || (typeof NodeList !== "undefined" && v instanceof NodeList)) {
        const items = Array.from(v, (x) => fmt(x, d + 1, seen));
        const pre = Array.isArray(v) ? "" : "NodeList(" + v.length + ") ";
        return pre + (items.length ? "[ " + items.join(", ") + " ]" : "[]");
      }
      if (v instanceof Map) {
        const items = Array.from(v, ([k, x]) => fmt(k, d + 1, seen) + " => " + fmt(x, d + 1, seen));
        return "Map(" + v.size + ") " + (items.length ? "{ " + items.join(", ") + " }" : "{}");
      }
      if (v instanceof Set) {
        const items = Array.from(v, (x) => fmt(x, d + 1, seen));
        return "Set(" + v.size + ") " + (items.length ? "{ " + items.join(", ") + " }" : "{}");
      }
      const proto = Object.getPrototypeOf(v);
      const ctor = proto && proto.constructor;
      const name = proto === null ? "[Object: null prototype] " : ctor && ctor !== Object && ctor.name ? ctor.name + " " : "";
      const items = Object.keys(v).map((k) => (isId(k) ? k : q(k)) + ": " + fmt(v[k], d + 1, seen));
      return name + (items.length ? "{ " + items.join(", ") + " }" : "{}");
    } finally { seen.delete(v); }
  }
  const errText = (e) => (e && typeof e === "object" && "message" in e) ? (e.name || "Error") + ": " + e.message : "Se lanzó: " + fmt(e, 1);
  const errLine = (e) => { const m = e && e.stack && String(e.stack).match(/(?:blob:|about:srcdoc)[^\s)]*?:(\d+):\d+/); return m ? Number(m[1]) : null; };
  const report = (e, prefix) => post({ kind: "error", text: (prefix || "") + errText(e), line: errLine(e) });

  const send = (type) => (...args) => {
    const text = args.map((a) => fmt(a)).join(" ");
    if (type === "log") logs.push(text);
    post({ kind: "log", type, text });
  };
  const con = G.console;
  con.log = send("log"); con.info = send("log"); con.debug = send("log"); con.table = send("log");
  con.warn = send("warn"); con.error = send("error");
  con.clear = () => post({ kind: "clear" });

  const st = G.setTimeout.bind(G), ct = G.clearTimeout.bind(G), si = G.setInterval.bind(G), ci = G.clearInterval.bind(G);
  const timers = new Set(), intervals = new Set();
  let mainDone = false, sent = false;
  function check() {
    if (!mainDone || sent) return;
    st(() => {
      if (sent) return;
      if (MODE !== "worker" || (timers.size === 0 && intervals.size === 0)) { sent = true; post({ kind: "done" }); }
    }, 0);
  }
  G.setTimeout = (fn, ms, ...a) => {
    const id = st(() => { timers.delete(id); try { if (typeof fn === "function") fn(...a); } catch (e) { report(e); } check(); }, ms);
    timers.add(id);
    return id;
  };
  G.clearTimeout = (id) => { timers.delete(id); ct(id); check(); };
  G.setInterval = (fn, ms, ...a) => { const id = si(() => { try { fn(...a); } catch (e) { report(e); } }, ms); intervals.add(id); return id; };
  G.clearInterval = (id) => { intervals.delete(id); ci(id); check(); };

  G.addEventListener("unhandledrejection", (e) => { e.preventDefault(); report(e.reason, "Promesa rechazada sin catch → "); });
  G.addEventListener("error", (e) => {
    if (e.preventDefault) e.preventDefault();
    const msg = String(e.message || "Error").replace(/^Uncaught /, "");
    post({ kind: "error", text: msg, line: e.lineno || errLine(e.error) });
    if (!G.__started) { mainDone = true; check(); }
  });

  const eq = (a, b) => {
    if (Object.is(a, b)) return true;
    if (typeof a === "number" && typeof b === "number") return Math.abs(a - b) < 1e-9;
    if (!a || !b || typeof a !== "object" || typeof b !== "object") return false;
    if (Array.isArray(a) !== Array.isArray(b)) return false;
    const ka = Object.keys(a), kb = Object.keys(b);
    if (ka.length !== kb.length) return false;
    return ka.every((k) => Object.prototype.hasOwnProperty.call(b, k) && eq(a[k], b[k]));
  };
  G.__eq = eq;
  G.__src = SRC;
  G.__logs = logs;
  const CODE = SRC.replace(/\/\*[\s\S]*?\*\/|\/\/[^\n]*/g, "");
  G.__visible = (el) => !!el && !(el.hidden || el.style.display === "none" || el.classList.contains("oculto") || (G.getComputedStyle && G.getComputedStyle(el).display === "none"));
  G.__runTests = async (T) => {
    for (let i = 0; i < T.length; i++) {
      const t = T[i];
      let r;
      try {
        if (t.k === "eq") { const got = await t.f(); r = { pass: eq(got, t.e), got: fmt(got, 1), exp: fmt(t.e, 1) }; }
        else if (t.k === "ok") r = { pass: !!(await t.f()) };
        else if (t.k === "log") r = { pass: logs.includes(t.e), exp: t.e };
        else if (t.k === "logs") r = { pass: eq(logs.slice(), t.e), got: logs.join(" · ") || "(nada)", exp: t.e.join(" · ") };
        else if (t.k === "src") r = { pass: new RegExp(t.re).test(CODE) };
        else r = { pass: !new RegExp(t.re).test(CODE) };
      } catch (e) { r = { pass: false, error: errText(e) }; }
      r.kind = "test"; r.i = i;
      post(r);
    }
  };
  G.__start = (main) => {
    G.__started = true;
    main().catch((e) => report(e)).finally(() => { mainDone = true; check(); });
  };
}

const engineReady = new Promise((resolve) => {

function runCode({ code, pre = null, tests = [], html = null, host = null, onEvent = null }) {
  return engineReady.then((engine) => new Promise((resolve) => {
    const mode = html != null ? "frame" : engine;
    const rid = "r" + (++ridSeq) + Math.random().toString(36).slice(2, 8);
    const userLines = code.split("\n").length;
    const { prog, before } = buildProgram(code, pre, tests);
    const runtimeCall = "(" + desveloRuntime.toString() + ")(" + lit(mode) + "," + lit(rid) + "," + lit(code) + ");";
    const results = new Array(tests.length).fill(null);
    let finished = false, gotError = false, logs = 0, offset = 0, cleanup = () => {}, timer;
    const fixLine = (n) => { const l = n - offset; return n && l >= 1 && l <= userLines ? l : null; };
    const handle = (m) => {
      if (m.kind === "done") { finish(false); return; }
      if (m.kind === "log") logs++;
      if (m.kind === "test") { results[m.i] = m; return; }
      if (m.kind === "error") { gotError = true; m.line = fixLine(m.line); }
      if (onEvent) onEvent(m);
    };
    function finish(timedOut) {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      if (mode !== "frame" || !html || timedOut) cleanup();
      resolve({ results: results.map((r, i) => r || { i, pass: false, missing: true }), timedOut, gotError, logs });
    }
    if (mode === "worker") {
      const src = prog + runtimeCall + "\n__start(__main);\n";
      offset = before;
      const url = URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
      const w = new Worker(url);
      w.onmessage = (e) => handle(e.data);
      w.onerror = (e) => {
        e.preventDefault();
        handle({ kind: "error", text: String(e.message || "Error de sintaxis").replace(/^Uncaught /, ""), line: e.lineno });
        finish(false);

      cleanup = () => { w.terminate(); URL.revokeObjectURL(url); };

      const target = host || $("#offscreen");
      if (target.__rid) frameHandlers.delete(target.__rid);
      target.__rid = rid;
      const A = '<!doctype html><html><head><meta charset="utf-8"><style>' + FRAME_CSS + "</style></head><body>\n" + (html || "").replace(/<\/script/gi, "") + "\n<script>" + runtimeCall + "<\/script>\n<script>\n";

const ERROR_HINTS = [
  [/^\w*Error: (\w+) is not defined/, (m) => m[1] === "document" || m[1] === "window"
    ? "Acá no hay página web: `document` solo existe en los ejercicios con vista previa."
    : "JavaScript no conoce nada llamado `" + m[1] + "`. ¿Está bien escrito? (Mayúsculas y minúsculas cuentan.) Si es una variable, ¿la creaste antes con `let` o `const`? Si es un texto, ¿le faltan las comillas?"],
  [/Cannot read properties of (undefined|null) \(reading '([^']+)'\)/, (m) => "Intentaste leer `." + m[2] + "` de algo que vale `" + m[1] + "` (o sea, de algo vacío). Revisá que esa variable tenga el valor que creés."],
  [/Cannot set properties of (undefined|null)/, (m) => "Intentaste cambiar una propiedad de algo que vale `" + m[1] + "`. ¿El `querySelector` encontró el elemento? Revisá el id."],
  [/([\w.$[\]"']+) is not a function/, (m) => "`" + m[1] + "` no es una función, así que no se puede llamar con paréntesis. ¿Está bien escrito el nombre?"],
  [/Assignment to constant variable/, () => "Intentaste guardar un valor nuevo en una `const` (caja sellada). Si el valor tiene que cambiar, creala con `let`."],
  [/Identifier '(\w+)' has already been declared/, (m) => "Creaste `" + m[1] + "` dos veces. Para cambiar una variable que ya existe no se repite `let`/`const`: escribí solo `" + m[1] + " = ...`."],
  [/Cannot access '(\w+)' before initialization/, (m) => "Usaste `" + m[1] + "` antes de la línea donde se crea. Recordá que el código se ejecuta de arriba hacia abajo."],
  [/Unexpected end of input/, () => "Falta cerrar algo: una llave `}`, un paréntesis `)` o un corchete `]`."],
  [/missing \) after/, () => "Falta cerrar un paréntesis `)`."],
  [/Invalid or unexpected token/, () => "Hay un carácter que JavaScript no esperaba. Muchas veces es un texto al que le falta la comilla de cierre."],
  [/Unexpected token|Unexpected identifier|Unexpected string|Unexpected number|Invalid left-hand side|Unexpected strict mode/, () => "Error de escritura (sintaxis): revisá llaves, paréntesis, comas y comillas cerca de esa línea."],
  [/await is only valid/, () => "`await` solo funciona adentro de una función `async`."],
  [/Class constructor (\w+) cannot be invoked without 'new'/, (m) => "Para crear un " + m[1] + " usá `new " + m[1] + "(...)`."],
  [/is not a constructor/, () => "Eso no se puede usar con `new`. ¿Es una clase?"],
  [/is not iterable/, () => "Intentaste recorrer con `for...of` algo que no es una lista ni un texto."],
  [/Maximum call stack size exceeded/, () => "Una función se llama a sí misma sin parar."],
  [/Promesa rechazada sin catch/, () => "Una promesa falló y nadie atrapó el error. Usá `try / catch` alrededor del `await`."],
];
function explainError(text) {
  for (const [re, fn] of ERROR_HINTS) { const m = text.match(re); if (m) return fn(m); }
  return null;
}

function makeEditor(code, { id, label, onRun, onChange } = {}) {
  const wrap = h("div", { class: "editor" });
  const pre = h("pre", { class: "editor-hl", "aria-hidden": "true" });
  const ta = h("textarea", { class: "editor-ta", id, spellcheck: "false", autocapitalize: "off", autocomplete: "off", autocorrect: "off", wrap: "soft", "aria-label": label || "Editor de código" });
  ta.value = code;
  wrap.append(pre, ta);
  let escMode = false, lastW = 0;
  const sync = () => {
    pre.innerHTML = highlight(ta.value) + "\n";
    ta.style.height = "auto";
    ta.style.height = ta.scrollHeight + "px";
  };
  const insert = (text) => {
    ta.focus();
    let ok = false;
    try { ok = document.execCommand("insertText", false, text); } catch (e) { ok = false; }
    if (!ok) { ta.setRangeText(text, ta.selectionStart, ta.selectionEnd, "end"); ta.dispatchEvent(new Event("input")); }
  };
  ta.addEventListener("input", () => { sync(); if (onChange) onChange(ta.value); });
  ta.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); if (onRun) onRun(); return; }
    if (e.key === "Escape") { escMode = true; return; }
    if (e.key === "Tab" && !escMode && !e.shiftKey && !e.ctrlKey && !e.altKey && !e.metaKey) { e.preventDefault(); insert("  "); return; }
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing && ta.selectionStart === ta.selectionEnd) {
      const before = ta.value.slice(0, ta.selectionStart);
      const line = before.slice(before.lastIndexOf("\n") + 1);
      let ind = line.match(/^\s*/)[0];
      if (/[{[(]\s*$/.test(line)) ind += "  ";
      e.preventDefault();
      insert("\n" + ind);
      return;
    }
    escMode = false;
  });
  if (typeof ResizeObserver !== "undefined") {
    new ResizeObserver(() => { const w = wrap.clientWidth; if (w && w !== lastW) { lastW = w; sync(); } }).observe(wrap);
  }
  wrap.__sync = sync;
  sync();

    el: wrap,
    get value() { return ta.value; },
    setValue(v) { ta.value = v; sync(); if (onChange) onChange(v); },
    sync,
  };
}

      const st = b.steps[s];

      for (const op of st.ops) {
        if (op.del === "frame") frames.delete(op.frame);
        else if (op.del === "var") { const f = frames.get(op.frame); if (f) f.delete(op.name); }
        else {

    rows.forEach((r, i) => r.classList.toggle("cur", !!cur && cur.line === i + 1));

    if (!filled.length) varsEl.append(h("p", { class: "tr-empty" }, "Todavía no hay cajas."));

    counter.textContent = k === 0 ? "Antes de empezar" : "Paso " + k + " de " + N;
    prev.disabled = k === 0;
    next.disabled = k === N;
  }
  prev.addEventListener("click", () => { if (k > 0) { k--; paint(); } });
  next.addEventListener("click", () => { if (k < N) { k++; paint(); if (k === N) prev.focus(); } });

    h("div", { class: "tr-head" }, h("p", { class: "eyebrow" }, "Paso a paso"), counter),

const gpop = $("#gpop");

function closeGloss() {
  if (gpopFor) gpopFor.setAttribute("aria-expanded", "false");

  gpopFor = null;

function openGloss(el) {
  const g = GLOSSARY.get(el.dataset.g);
  if (!g) return;
  if (gpopFor === el) { closeGloss(); return; }
  closeGloss();
  gpop.innerHTML = "<strong>" + g.term + "</strong><p>" + g.def + '</p><a href="#glosario">Ver todo el glosario</a>';
  gpop.hidden = false;
  gpopFor = el;
  el.setAttribute("aria-expanded", "true");
  const r = el.getBoundingClientRect();
  const w = Math.min(320, window.innerWidth - 32);
  gpop.style.width = w + "px";
  const left = Math.max(16, Math.min(r.left, window.innerWidth - w - 16)) + window.scrollX;
  gpop.style.left = left + "px";
  gpop.style.top = (r.bottom + window.scrollY + 6) + "px";
}
document.addEventListener("click", (e) => {
  const d = e.target.closest("dfn[data-g]");
  if (d) { e.preventDefault(); openGloss(d); return; }
  if (!e.target.closest("#gpop")) closeGloss();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeGloss();
  const d = e.target && e.target.closest ? e.target.closest("dfn[data-g]") : null;
  if (d && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openGloss(d); }

function route() {
  closeGloss();
  const id = decodeURIComponent(location.hash.slice(1)) || "inicio";
  const m = MISSIONS.find((x) => x.id === id);
  if (m) { renderMission(m); store.last = m.id; save(); }
  else if (id === "chuleta") renderCheats();
  else if (id === "glosario") renderGlossary();
  else renderHome();
  const active = m ? m.id : id === "chuleta" || id === "glosario" ? id : "inicio";
  $$("#nav a").forEach((a) => { if (a.dataset.id === active) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  const cur = $('#nav a[aria-current="page"]');
  if (cur && cur.scrollIntoView && window.matchMedia("(max-width: 900px)").matches) cur.scrollIntoView({ block: "nearest", inline: "center" });
  window.scrollTo(0, 0);
  enhanceTerms($("#view"));
  paintProgress();
  requestAnimationFrame(syncEditors);
}

// ---------------------------------------------------------------- session clock & sprints
const t0 = Date.now();
let sprint = null;
const clock = (ms) => { const s = Math.max(0, Math.round(ms / 1000)); const hh = Math.floor(s / 3600), mm = Math.floor((s % 3600) / 60), ss = s % 60; return (hh ? hh + ":" + String(mm).padStart(2, "0") : mm) + ":" + String(ss).padStart(2, "0"); };
function paintSprint() {
  const btn = $("#sprint");
  if (!sprint) { btn.textContent = "Sprint 25"; btn.classList.remove("on"); return; }
  btn.classList.add("on");
  btn.textContent = (sprint.phase === "foco" ? "Foco " : "Pausa ") + clock(sprint.end - Date.now());
}
$("#sprint").addEventListener("click", () => {
  if (sprint) { sprint = null; toast("Sprint detenido"); }
  else { sprint = { phase: "foco", end: Date.now() + 25 * 60000 }; toast("25 minutos de foco. Celular lejos."); }
  paintSprint();
});
setInterval(() => {
  $("#session").textContent = clock(Date.now() - t0);
  if (sprint && sprint.end <= Date.now()) {
    if (sprint.phase === "foco") { sprint = { phase: "pausa", end: Date.now() + 5 * 60000 }; toast("¡Sprint terminado! 5 minutos de pausa: parate, estirate, tomá agua."); }
    else { sprint = null; toast("Fin de la pausa. Arrancá otro sprint cuando quieras."); }
  }
  if (sprint) paintSprint();
}, 1000);

// ---------------------------------------------------------------- tutor chat
const turns = [];
let chatCtl = null;
function openTutor(prefill) {
  if (!SAMPLE) return;
  $("#tutor").hidden = false; $("#scrim").hidden = false;
  paintSuggestions();
  if (prefill) $("#chat-input").value = prefill;
  $("#chat-input").focus();
}
function closeTutor() { $("#tutor").hidden = true; $("#scrim").hidden = true; }
function paintSuggestions() {
  const m = currentMission;
  const list = m
    ? ["No entendí bien " + m.title.toLowerCase() + ": explicámelo desde cero", "Dame un ejercicio fácil de " + m.title.toLowerCase(), "Explicámelo con un ejemplo de la vida real"]
    : ["¿Qué es exactamente programar?", "¿Para qué se usa JavaScript en el mundo real?", "¿Cómo sigo aprendiendo después de esta noche?"];
  $("#suggest").replaceChildren(...list.map((s) => h("button", { type: "button", onclick: () => { $("#chat-input").value = s; sendChat(); } }, s)));
}
function chatRules() {
  const m = currentMission;
  return "Sos el tutor de JavaScript de \"Desvelo JS\", una app donde alguien está aprendiendo JavaScript desde cero en una sola noche. " + BEGINNER + " " +
    "Respondé corto (máximo 150 palabras) salvo que te pidan más. Usá ejemplos de código breves en bloques " + FENCE + "js y explicá qué hace cada línea nueva. " +
    "Si te piden la solución de un desafío, primero dale una pista y ofrecé la solución si la sigue pidiendo. " +
    "Si te pide un ejercicio, dáselo con un enunciado claro y un ejemplo de lo que debería mostrar, sin la solución, y usando solo temas que ya vio. " +
    (m ? "Ahora está en la Misión " + m.num + ": \"" + m.title + "\" (" + m.goal + ")." : "Ahora está en una pantalla general.") +
    " Orden del curso: " + MISSIONS.map((x) => x.num + ". " + x.title).join(", ") + ".";
}
async function sendChat() {
  const input = $("#chat-input");
  const text = input.value.trim();
  if (!text || !SAMPLE || chatCtl) return;
  input.value = "";
  const chat = $("#chat");
  chat.append(h("div", { class: "msg user", html: md(text) }));
  const bubble = h("div", { class: "msg bot" }, h("p", {}, "Pensando…"));
  chat.append(bubble);
  chat.scrollTop = chat.scrollHeight;
  turns.push({ role: "user", content: text });
  while (turns.length > 14) turns.shift();
  if (turns[0] && turns[0].role !== "user") turns.shift();
  chatCtl = new AbortController();
  $("#chat-send").hidden = true; $("#chat-stop").hidden = false;
  try {
    const { text: answer } = await SAMPLE([{ role: "user", content: chatRules() }, ...turns], {
      cache: false, signal: chatCtl.signal,
      onText: ({ text: t }) => { bubble.innerHTML = md(t); chat.scrollTop = chat.scrollHeight; },
    });
    turns.push({ role: "assistant", content: answer });
  } catch (e) {
    const msg = aiErrorText(e);
    if (e && e.text && e.code !== "refused") { bubble.innerHTML = md(e.text); turns.push({ role: "assistant", content: e.text }); }
    else bubble.replaceChildren();
    if (msg) bubble.append(h("p", { class: "msg-err" }, msg));
    if (!bubble.textContent.trim()) bubble.remove();
  } finally {
    chatCtl = null;
    $("#chat-send").hidden = false; $("#chat-stop").hidden = true;
  }
}
$("#tutor-btn").addEventListener("click", () => openTutor());
$("#tutor-close").addEventListener("click", closeTutor);
$("#scrim").addEventListener("click", closeTutor);
$("#chat-stop").addEventListener("click", () => chatCtl && chatCtl.abort());
$("#chat-form").addEventListener("submit", (e) => { e.preventDefault(); sendChat(); });
$("#chat-input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendChat(); } });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#tutor").hidden) closeTutor(); });

// ---------------------------------------------------------------- boot
const setTopH = () => document.documentElement.style.setProperty("--top-h", $("#topbar").offsetHeight + "px");
window.addEventListener("resize", () => { setTopH(); closeGloss(); });
setTopH();
buildNav();
window.addEventListener("hashchange", route);
route();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { setTopH(); syncEditors(); });

// Self-check hook: every solution against its tests, every quiz against its answer, every trace against the real output.
window.desvelo = {
  missions: MISSIONS,
  glossary: GLOSSARY,
  async verify() {
    const report = [];
    const host = $("#offscreen");
    for (const m of MISSIONS) for (const b of m.blocks) {
      if (b.type === "challenge") {
        const ok = await runCode({ code: b.solution, pre: b.pre, tests: b.tests, html: b.html, host: b.html != null ? host : null });
        const bad = ok.results.map((r, i) => r.pass ? null : { test: b.tests[i].name, r }).filter(Boolean);
        if (bad.length || ok.gotError) report.push({ id: b.id, problem: "la solución no pasa", bad, gotError: ok.gotError });
        const st = await runCode({ code: b.starter, pre: b.pre, tests: b.tests, html: b.html, host: b.html != null ? host : null });
        if (st.results.every((r) => r.pass)) report.push({ id: b.id, problem: "el código inicial ya pasa" });
      } else if (b.type === "quiz" && !b.noverify) {
        const lines = [];
        await runCode({ code: b.code, onEvent: (e) => { if (e.kind === "log") lines.push(e.text); } });
        if (lines.join("\n") !== b.options[b.answer]) report.push({ id: b.id, problem: "la respuesta no coincide", got: lines.join("\n"), want: b.options[b.answer] });
      } else if (b.type === "example") {
        const errs = [];
        await runCode({ code: b.code, html: b.html, host: b.html != null ? host : null, onEvent: (e) => { if (e.kind === "error") errs.push(e.text); } });
        if (b.expectError ? !errs.length : errs.length) report.push({ id: b.id, problem: b.expectError ? "el ejemplo debería dar error" : "el ejemplo da error", errs });
      } else if (b.type === "trace") {
        const lines = [], errs = [];
        await runCode({ code: b.code, onEvent: (e) => { if (e.kind === "log") lines.push(e.text); if (e.kind === "error") errs.push(e.text); } });
        const want = b.steps.filter((s) => s.out != null).map((s) => s.out);
        const nLines = b.code.split("\n").length;
        const badLine = b.steps.find((s) => s.line < 0 || s.line > nLines);
        if (errs.length || lines.join("\n") !== want.join("\n") || badLine) report.push({ id: b.id, problem: "el paso a paso no coincide", got: lines, want, errs, badLine });
      }
    }
    for (const d of $$("dfn[data-g]", TPL)) if (!GLOSSARY.has(d.dataset.g)) report.push({ problem: "término sin definición", term: d.dataset.g });
    return report;
  },
};
})();
