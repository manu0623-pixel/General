<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Desvelo JS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky top bar with progress + clock; mission rail on the left, lesson column on the right; the editors are the hero. Dark-first (it's a night session). */
:root {
  --bg: #0e1120;
  --surface: #161a2d;
  --surface-2: #1e2339;
  --line: #2b3152;
  --fg: #ebe8dc;
  --muted: #9ba1bf;
  --accent: #f7df1e;
  --accent-ink: #17150a;
  --accent-text: #f7df1e;
  --info: #93b4ff;
  --ok: #5ad6a6;
  --bad: #ff8379;
  --warn: #ffb35c;
  --code-bg: #0a0d19;
  --page: #ffffff;
  --t-kw: #c7a6ff; --t-str: #a6e58f; --t-num: #ffb86b; --t-com: #6f7799; --t-fn: #7fc8ff; --t-lit: #ff9ac1; --t-cls: #ffd479;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --radius: 10px;
  --top-h: 56px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f4fa; --surface: #ffffff; --surface-2: #eaedf6; --line: #d4d8e8; --fg: #171a2b; --muted: #596080;
    --accent: #f7df1e; --accent-ink: #17150a; --accent-text: #806500; --info: #3b5cc2; --ok: #11805b; --bad: #c43333; --warn: #a35a00;
    --code-bg: #f8f8fc; --page: #ffffff;
    --t-kw: #6d3fd0; --t-str: #2b7a2b; --t-num: #b05500; --t-com: #878ea8; --t-fn: #1c69b6; --t-lit: #b5306c; --t-cls: #8a6100;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f3f4fa; --surface: #ffffff; --surface-2: #eaedf6; --line: #d4d8e8; --fg: #171a2b; --muted: #596080;
  --accent: #f7df1e; --accent-ink: #17150a; --accent-text: #806500; --info: #3b5cc2; --ok: #11805b; --bad: #c43333; --warn: #a35a00;
  --code-bg: #f8f8fc; --page: #ffffff;
  --t-kw: #6d3fd0; --t-str: #2b7a2b; --t-num: #b05500; --t-com: #878ea8; --t-fn: #1c69b6; --t-lit: #b5306c; --t-cls: #8a6100;
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.6; -webkit-text-size-adjust: 100%; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, kbd, pre, textarea { font-family: var(--font-mono); }
html:not(.has-ai) .ai-only { display: none !important; }

/* ---------- top bar ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; flex-wrap: wrap; gap: 10px 18px; padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; letter-spacing: -0.01em; white-space: nowrap; }
.mark { width: 28px; height: 28px; border-radius: 6px; background: var(--accent); position: relative; overflow: hidden; flex: none; }
.mark::before { content: ""; position: absolute; width: 16px; height: 16px; border-radius: 50%; background: var(--accent-ink); left: 5px; top: 7px; }
.mark::after { content: ""; position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); left: 10px; top: 3px; }
.progress { flex: 1 1 180px; display: flex; align-items: center; gap: 10px; min-width: 0; max-width: 380px; }
.bar { flex: 1; height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar span { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .5s ease; }
.prog-text, .xp, .clock { font-family: var(--font-mono); font-size: .8rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.prog-text { color: var(--muted); }
.stats { display: flex; align-items: center; gap: 8px; }
.xp { background: var(--accent); color: var(--accent-ink); padding: 2px 8px; border-radius: 99px; font-weight: 600; }
.level { font-size: .85rem; color: var(--muted); white-space: nowrap; }
.clock { display: flex; align-items: center; gap: 8px; color: var(--muted); margin-left: auto; }
.top-btn { font: inherit; font-size: .82rem; font-weight: 700; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; white-space: nowrap; min-height: 34px; font-variant-numeric: tabular-nums; }
.top-btn:hover { border-color: var(--muted); }
.top-btn.on { border-color: var(--accent); color: var(--accent-text); }
.top-btn.tutor { border-color: var(--info); color: var(--info); }
@media (max-width: 680px) {
  .topbar { padding: 8px 16px; gap: 8px 10px; }
  .progress { order: 9; flex-basis: 100%; max-width: none; }
  .level, .clock-label { display: none; }
}

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); max-width: 1260px; margin: 0 auto; }
.rail { position: sticky; top: calc(var(--top-h) + env(safe-area-inset-top, 0px)); align-self: start; max-height: calc(100vh - var(--top-h)); overflow-y: auto; padding: 20px 12px 40px 20px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.rail-label { font-family: var(--font-mono); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 14px 10px 6px; }
.nav-item { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 8px; text-decoration: none; color: var(--muted); font-size: .92rem; line-height: 1.3; }
.nav-item:hover { background: var(--surface-2); color: var(--fg); }
.nav-item[aria-current="page"] { background: var(--surface-2); color: var(--fg); font-weight: 700; }
.nav-num { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font-family: var(--font-mono); font-size: .75rem; border: 1px solid var(--line); font-weight: 600; }
.nav-item.done .nav-num { background: var(--ok); color: var(--bg); border-color: transparent; }
.nav-item[aria-current="page"] .nav-num { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.nav-count { font-family: var(--font-mono); font-size: .72rem; font-variant-numeric: tabular-nums; }
main { min-width: 0; padding: 32px 36px 96px; }
.main-inner { max-width: 820px; display: flex; flex-direction: column; gap: 20px; }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; max-height: none; flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 10px 16px; gap: 6px; }
  .rail-label, .nav-item .nav-title.mission, .nav-count { display: none; }
  .nav-item { grid-template-columns: auto; flex: none; padding: 4px; }
  .nav-item.text { grid-template-columns: auto auto; padding: 4px 10px 4px 4px; }
  main { padding: 22px 16px 96px; }
}

/* ---------- type ---------- */
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.1rem, 5vw, 3.1rem); line-height: 1.04; letter-spacing: -0.025em; margin: 0; text-wrap: balance; }
h2.sec { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; letter-spacing: -0.01em; margin: 22px 0 0; text-wrap: balance; display: flex; align-items: baseline; gap: 12px; }
h2.sec small { font-family: var(--font-mono); font-size: .72rem; font-weight: 400; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.eyebrow { font-family: var(--font-mono); font-size: .74rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.chip { font-family: var(--font-mono); font-size: .68rem; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--accent); color: var(--accent-text); }
.goal { color: var(--muted); font-size: 1.1rem; max-width: 60ch; margin: 0; }
.m-head { display: flex; flex-direction: column; gap: 10px; padding-bottom: 6px; }
.prose { max-width: 68ch; }
.prose p { margin: 0 0 .75em; }
.prose p:last-child, .prose ul:last-child { margin-bottom: 0; }
.prose ul, .prose ol { padding-left: 1.25em; margin: 0 0 .75em; }
.prose li { margin: .25em 0; }
.prose code, .tip code, .why code, .test code, .hints code, .ai-body code, .msg code, .err-h code, .map code { font-size: .87em; background: var(--surface-2); padding: .06em .36em; border-radius: 4px; overflow-wrap: anywhere; }
.tip { border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; background: var(--surface); max-width: 72ch; font-size: .96rem; }
.tip p { margin: 0; }
kbd { font-size: .74rem; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--muted); white-space: nowrap; }

/* ---------- code ---------- */
.code-ro { margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; font-size: 13.5px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; tab-size: 2; color: var(--fg); }
.t-kw { color: var(--t-kw); } .t-str { color: var(--t-str); } .t-num { color: var(--t-num); } .t-com { color: var(--t-com); font-style: italic; } .t-fn { color: var(--t-fn); } .t-lit { color: var(--t-lit); } .t-cls { color: var(--t-cls); }
.editor { position: relative; background: var(--code-bg); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
.editor:focus-within { border-color: color-mix(in srgb, var(--accent) 70%, var(--line)); }
.editor-hl, .editor-ta { margin: 0; padding: 14px 16px; border: 0; font-family: var(--font-mono); font-size: 14px; line-height: 1.6; tab-size: 2; letter-spacing: 0; white-space: pre-wrap; overflow-wrap: anywhere; word-break: normal; font-variant-ligatures: none; }
.editor-hl { position: absolute; inset: 0; pointer-events: none; overflow: hidden; color: var(--fg); }
.editor-ta { position: relative; display: block; width: 100%; min-height: 4.4em; resize: none; overflow: hidden; background: transparent; color: transparent; -webkit-text-fill-color: transparent; caret-color: var(--accent); outline: none; }
.editor-ta::selection { background: color-mix(in srgb, var(--accent) 32%, transparent); }
@media (pointer: coarse) { .editor-hl, .editor-ta { font-size: 16px; } }
.console { font-family: var(--font-mono); font-size: 13px; line-height: 1.55; background: var(--code-bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; max-height: 300px; overflow: auto; }
.console::before { content: "Consola"; display: block; font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.ln { white-space: pre-wrap; overflow-wrap: anywhere; padding: 1px 0; }
.ln.warn { color: var(--warn); }
.ln.error { color: var(--bad); }
.ln.note { color: var(--muted); font-style: italic; }
.err-h { display: block; color: var(--fg); font-family: var(--font-body); font-size: .9rem; margin-top: 2px; }

/* ---------- buttons ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { font: inherit; font-size: .9rem; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; min-height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; }
.btn.ai { background: transparent; border-color: color-mix(in srgb, var(--info) 55%, var(--line)); color: var(--info); }
.btn.warn { border-color: var(--warn); color: var(--warn); }
.btn:disabled { opacity: .55; cursor: progress; }
.btn .k { font-family: var(--font-mono); font-size: .7rem; font-weight: 400; opacity: .7; }
.spacer { flex: 1; }

/* ---------- example ---------- */
.example { display: flex; flex-direction: column; gap: 10px; }
.ex-label { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.label { font-family: var(--font-mono); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
.dom-split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.dom-col { min-width: 0; display: flex; flex-direction: column; }
.dom-col .code-ro { margin-bottom: 12px; }
@media (max-width: 760px) { .dom-split { grid-template-columns: minmax(0, 1fr); } }
.frame-host iframe { display: block; width: 100%; height: 260px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--page); }
.frame-note { font-size: .8rem; color: var(--muted); margin: 6px 0 0; }

/* ---------- quiz ---------- */
.quiz { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.quiz .q { margin: 0; font-weight: 700; font-size: 1.05rem; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 560px) { .opts { grid-template-columns: minmax(0, 1fr); } }
.opt { text-align: left; display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); cursor: pointer; font: inherit; min-width: 0; }
.opt:hover { border-color: var(--muted); }
.opt-k { font-family: var(--font-mono); font-size: .72rem; color: var(--muted); padding-top: 3px; flex: none; }
.opt-v { font-family: var(--font-mono); font-size: .9rem; white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
.opts.prose-opts .opt-v { font-family: var(--font-body); font-size: .95rem; }
.answered .opt { cursor: default; }
.answered .opt:not(.correct):not(.wrong) { opacity: .6; }
.opt.correct { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 15%, var(--surface-2)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 13%, var(--surface-2)); }
.why { font-size: .96rem; }
.why p { margin: 0; }
.verdict { font-weight: 700; }
.verdict.ok { color: var(--ok); }
.verdict.bad { color: var(--bad); }

/* ---------- challenge ---------- */
.challenge { border: 1px solid var(--line); border-radius: 16px; padding: 20px; background: var(--surface); display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.challenge.solved { border-color: color-mix(in srgb, var(--ok) 65%, var(--line)); }
.ch-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.challenge h3 { font-family: var(--font-display); font-weight: 700; font-size: 1.4rem; margin: 0; line-height: 1.2; text-wrap: balance; }
.status { font-family: var(--font-mono); font-size: .68rem; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; white-space: nowrap; }
.solved .status { color: var(--bg); background: var(--ok); border-color: transparent; }
details.pre summary { cursor: pointer; font-size: .9rem; color: var(--muted); margin-bottom: 8px; }
.tests-wrap { display: flex; flex-direction: column; gap: 8px; }
.tests-head { display: flex; justify-content: space-between; align-items: baseline; }
.tests-count { font-family: var(--font-mono); font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tests { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.test { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: start; font-size: .93rem; }
.test .ic { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: .72rem; font-weight: 700; border: 1px solid var(--line); color: var(--muted); margin-top: 2px; font-family: var(--font-mono); }
.test.pass .ic { background: var(--ok); color: var(--bg); border-color: transparent; }
.test.fail .ic { background: var(--bad); color: var(--bg); border-color: transparent; }
.test .detail { display: block; font-family: var(--font-mono); font-size: .8rem; color: var(--muted); overflow-wrap: anywhere; white-space: pre-wrap; }
.test .detail.hint { font-family: var(--font-body); font-size: .88rem; color: var(--fg); }
.hints { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; font-size: .95rem; }
.ai-box { border: 1px dashed color-mix(in srgb, var(--info) 70%, var(--line)); border-radius: 12px; padding: 12px 16px; background: color-mix(in srgb, var(--info) 7%, transparent); display: flex; flex-direction: column; gap: 6px; }
.ai-box .who { font-family: var(--font-mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--info); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.ai-box .who button { font: inherit; background: none; border: 0; color: var(--info); cursor: pointer; text-decoration: underline; padding: 0; }
.ai-body { font-size: .96rem; overflow-wrap: anywhere; }
.ai-body p { margin: 0 0 .6em; }
.ai-body p:last-child { margin-bottom: 0; }
.ai-body ul, .ai-body ol { margin: 0 0 .6em; padding-left: 1.2em; }
.ai-body pre, .msg pre { margin: .4em 0 .6em; font-size: 12.5px; }
.solution { display: flex; flex-direction: column; gap: 8px; }
.next { display: flex; justify-content: flex-end; padding-top: 12px; }
.next .btn { font-size: 1rem; padding: 10px 18px; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.012); } 100% { transform: scale(1); } }
.challenge.pop { animation: pop .45s ease-out; }

/* ---------- home ---------- */
.hero { display: flex; flex-direction: column; gap: 14px; padding-top: 6px; }
.hero h1 { font-size: clamp(2.8rem, 8vw, 4.8rem); }
.hero h1 em { font-style: normal; color: var(--accent-text); }
.lead { font-size: 1.18rem; max-width: 56ch; color: var(--muted); margin: 0; }
.hero .toolbar { margin-top: 6px; }
.night { display: flex; flex-direction: column; gap: 8px; }
.strip { display: flex; gap: 3px; height: 46px; }
.seg { flex: var(--w) 1 0; min-width: 0; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--font-mono); font-size: .75rem; color: var(--muted); text-decoration: none; position: relative; overflow: hidden; }
.seg.core { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); color: var(--fg); }
.seg .fill { position: absolute; inset: auto 0 0 0; height: var(--p); background: color-mix(in srgb, var(--ok) 40%, transparent); }
.seg span { position: relative; }
.seg.done { background: color-mix(in srgb, var(--ok) 30%, var(--surface-2)); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .85rem; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; border: 1px solid var(--line); background: var(--surface-2); }
.legend i.core { border-color: var(--accent); }
.legend i.done { background: color-mix(in srgb, var(--ok) 50%, var(--surface-2)); }
.method { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 10px; counter-reset: paso; }
.method li { counter-increment: paso; padding: 14px 14px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.method li::before { content: counter(paso, decimal-leading-zero); font-family: var(--font-mono); font-size: .75rem; color: var(--accent-text); }
.method strong { font-family: var(--font-display); font-size: 1.12rem; }
.method span { font-size: .93rem; color: var(--muted); }
.map { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(230px, 100%), 1fr)); gap: 10px; }
.map a { display: flex; flex-direction: column; gap: 6px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; text-decoration: none; background: var(--surface); }
.map a:hover { border-color: var(--muted); }
.map .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: .74rem; color: var(--muted); }
.map strong { font-family: var(--font-display); font-size: 1.1rem; line-height: 1.2; }
.map .mini { height: 4px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.map .mini span { display: block; height: 100%; background: var(--ok); }
.foot { font-size: .88rem; color: var(--muted); }

/* ---------- cheats ---------- */

<!-- ============================ MISIÓN 0 ============================ -->
<section class="mission" data-id="m0" data-track="base" data-mins="25" data-title="Primeros pasos" data-goal="Entender qué es programar, cómo lee JavaScript tu código y cómo mostrar mensajes en pantalla.">
<h2 class="b-h">¿Qué es programar?</h2>
<div class="b-text">
<p>Programar es escribir <dfn data-g="instruccion">instrucciones</dfn> para que una computadora las siga. Se parece a una receta de cocina: pasos concretos, uno después del otro. A esa lista de instrucciones se le llama <dfn data-g="programa">programa</dfn>.</p>
<p>La diferencia con una receta es que la computadora no tiene sentido común: hace <em>exactamente</em> lo que escribiste, ni más ni menos. Si te equivocás en una letra, no adivina lo que quisiste decir. Por eso al principio vas a ver muchos errores, y está perfecto: así aprende todo el mundo.</p>
<p><dfn data-g="javascript">JavaScript</dfn> es un <strong>lenguaje de programación</strong>: una forma de escribir instrucciones que la computadora entiende. Es el lenguaje de la web: cuando tocás un botón en una página y algo cambia sin recargar, casi seguro hay JavaScript detrás.</p>
</div>

<h2 class="b-h">Tu primera instrucción</h2>
<div class="b-text">
<p>Para saber qué está haciendo un programa, necesitamos que nos muestre cosas. Para eso existe la <dfn data-g="consola">consola</dfn>: un espacio donde el programa escribe mensajes. La instrucción para escribir en ella es <code>console.log(...)</code>.</p>
</div>
<div class="b-example"><script type="text/plain" class="js">
console.log("¡Hola, mundo!");
console.log("Estoy aprendiendo JavaScript");
</script>
<ol class="explain">
<li><code>console</code> es la consola, el lugar donde aparecen los mensajes.</li>
<li><code>.log</code> significa "anotá". El punto une las dos palabras: "consola, anotá...".</li>
<li>Entre los paréntesis <code>( )</code> va lo que querés mostrar.</li>
<li><code>"¡Hola, mundo!"</code>: las comillas indican que es un texto que se muestra tal cual, letra por letra.</li>
<li>El punto y coma <code>;</code> termina la instrucción, como el punto al final de una oración.</li>
</ol>
</div>
<div class="b-tip"><p><strong>Probá:</strong> tocá <strong>Ejecutar</strong> para correr el código. Después cambiá los textos entre comillas y ejecutalo de nuevo. No se rompe nada: probá todo lo que se te ocurra.</p></div>
<div class="b-challenge" data-mini data-id="t0-1" data-title="Presentate">
<div class="prompt"><p>Escribí una instrucción que muestre en la consola <code>Hola, soy</code> seguido de tu nombre. Por ejemplo: <code>Hola, soy Lu</code>.</p></div>
<script type="text/plain" class="starter">
// Escribí tu console.log acá abajo

</script>
<script type="text/plain" class="tests">
Mostrás "Hola, soy" y tu nombre :: __logs.some(l => /^Hola, soy \S/.test(l))
</script>
<div class="hint">Copiá la forma del ejemplo, <code>console.log("...");</code>, y cambiá el texto de adentro de las comillas.</div>
<script type="text/plain" class="solution">
console.log("Hola, soy Lu");
</script>
</div>

<h2 class="b-h">El orden importa</h2>
<div class="b-text">
<p>JavaScript lee tu código <strong>de arriba hacia abajo, una línea por vez</strong>, igual que vos leés una receta. Termina una instrucción y recién ahí pasa a la siguiente.</p>
<p>Abajo tenés tu primera vista <strong>paso a paso</strong>. Tocá <em>Siguiente</em> y mirá qué línea se ejecuta (la marcada en amarillo) y qué aparece en la consola. Vas a encontrar estas vistas en todo el curso: usalas cada vez que algo no te cierre.</p>
</div>
<div class="b-trace"><script type="text/plain" class="js">
console.log("Primero");
console.log("Segundo");
console.log("Tercero");
</script><script type="text/plain" class="steps">
1 ¦  ¦ Primero ¦ JavaScript arranca por la línea 1 y la ejecuta: aparece <code>Primero</code> en la consola.
2 ¦  ¦ Segundo ¦ Recién cuando terminó la línea 1, pasa a la 2.
3 ¦  ¦ Tercero ¦ Y después a la 3. No hay más líneas, así que el programa termina.
</script></div>
<div class="b-quiz" data-id="q0-1" data-answer="0" data-noverify data-prose>
<p class="q">Si en el código de arriba ponés la línea de <code>"Tercero"</code> en primer lugar, ¿qué pasa?</p>
<script type="text/plain" class="opt">"Tercero" se muestra primero</script>
<script type="text/plain" class="opt">Se sigue mostrando Primero, Segundo, Tercero</script>
<script type="text/plain" class="opt">Da un error</script>
<script type="text/plain" class="opt">No se muestra nada</script>
<div class="why"><p>JavaScript no reordena nada: ejecuta las líneas en el orden en que las escribiste. Si querés comprobarlo, cambiá el orden en cualquier ejemplo y ejecutalo.</p></div>
</div>

<h2 class="b-h">Textos y números</h2>
<div class="b-text">
<p>Lo que va entre comillas es un <dfn data-g="string">texto</dfn> (en programación se le dice <em>string</em>). JavaScript lo muestra tal cual, sin fijarse qué dice.</p>
<p>Los <dfn data-g="numero">números</dfn> van <strong>sin comillas</strong>, y con ellos JavaScript puede hacer cuentas: <code>+</code> suma, <code>-</code> resta, <code>*</code> multiplica y <code>/</code> divide.</p>
</div>
<div class="b-example"><script type="text/plain" class="js">
console.log(2 + 3);
console.log("2 + 3");
console.log(10 * 4);
console.log(25 / 2);
</script>
<ol class="explain">
<li><code>2 + 3</code> sin comillas: son números, así que hace la cuenta y muestra <code>5</code>.</li>
<li><code>"2 + 3"</code> con comillas: es un texto, así que lo muestra tal cual, sin calcular.</li>
<li><code>*</code> es multiplicar (en programación no se usa la x).</li>
<li><code>/</code> es dividir. Los decimales se escriben con punto, no con coma: <code>12.5</code>.</li>
</ol>
</div>
<div class="b-quiz" data-id="q0-2" data-answer="1">
<script type="text/plain" class="code">
console.log(5 + 5);
console.log("5 + 5");
</script>
<script type="text/plain" class="opt">10
10</script>
<script type="text/plain" class="opt">10
5 + 5</script>
<script type="text/plain" class="opt">5 + 5
10</script>
<script type="text/plain" class="opt">5 + 5
5 + 5</script>
<div class="why"><p>La primera línea tiene números: hace la cuenta. La segunda está entre comillas: es un texto y se muestra tal cual.</p></div>
</div>
<div class="b-challenge" data-mini data-id="t0-2" data-title="Una cuenta">
<div class="prompt"><p>¿Cuántas horas tiene una semana? Mostrá en la consola el resultado de <code>24 * 7</code>. Dejá que JavaScript haga la cuenta: sin comillas.</p></div>
<script type="text/plain" class="starter">
// Mostrá el resultado de 24 * 7 con console.log

</script>
<script type="text/plain" class="tests">
Aparece 168 en la consola :: log ==> "168"
Usás * para multiplicar :: src ==> \*
</script>
<div class="hint">Lo que va dentro de los paréntesis de <code>console.log</code> puede ser una cuenta: <code>console.log(24 * 7);</code>. Sin comillas, así no es un texto.</div>
<script type="text/plain" class="solution">
console.log(24 * 7);
</script>
</div>

<h2 class="b-h">Comentarios</h2>
<div class="b-text">
<p>Todo lo que escribas después de <code>//</code> es un <dfn data-g="comentario">comentario</dfn>: JavaScript lo ignora. Sirve para dejar notas para las personas (o para vos en el futuro). También sirve para "apagar" una línea sin borrarla.</p>
</div>
<div class="b-example"><script type="text/plain" class="js">
// Esta línea es una nota: JavaScript no la ejecuta
console.log("Esta sí se ejecuta");
// console.log("Esta está apagada");
</script></div>

<h2 class="b-h">Los errores son normales</h2>
<div class="b-text">
<p>Cuando JavaScript no entiende algo, se detiene y muestra un <dfn data-g="error">error</dfn>. No significa que hiciste algo terrible: es la computadora diciéndote <em>"no entendí esta línea"</em>. Acá cada error viene con el número de línea y una explicación en castellano.</p>
</div>
<div class="b-example" data-error><script type="text/plain" class="js">
console.log("Esta línea anda");
consol.log("Esta tiene un error de tipeo");
console.log("Esta nunca llega a ejecutarse");
</script>
<ol class="explain">
<li>La línea 1 se ejecuta bien.</li>
<li>En la línea 2 dice <code>consol</code> en vez de <code>console</code>. JavaScript no conoce nada con ese nombre, así que se detiene y avisa en qué línea.</li>
<li>La línea 3 no se ejecuta: después de un error, el programa se corta. Arreglá la línea 2 y ejecutá de nuevo.</li>
</ol>
</div>
<div class="b-challenge" data-mini data-id="t0-3" data-title="Arreglá el programa">
<div class="prompt"><p>Este programa tiene dos errores. Ejecutalo, leé qué línea marca el error, arreglala y repetí hasta que la consola muestre las tres líneas.</p></div>
<script type="text/plain" class="starter">
console.log("Ya casi");
Console.log("sé programar");
console.log("en JavaScript);
</script>
<script type="text/plain" class="tests">
La consola muestra las tres líneas :: logs ==> ["Ya casi","sé programar","en JavaScript"]
</script>
<div class="hint">Ejecutalo y fijate qué número de línea dice el error. Arreglá esa línea primero.</div>
<div class="hint">Todo texto necesita comillas de apertura <strong>y</strong> de cierre.</div>
<div class="hint">Mayúsculas y minúsculas importan: no es lo mismo <code>Console</code> que <code>console</code>.</div>
<script type="text/plain" class="solution">
console.log("Ya casi");
console.log("sé programar");
console.log("en JavaScript");
</script>
</div>

<div class="b-recap"><ul>
<li>Un programa es una lista de instrucciones que se ejecutan <strong>de arriba hacia abajo</strong>, una por vez.</li>
<li><code>console.log(...)</code> muestra algo en la consola.</li>
<li>Los textos van entre comillas y se muestran tal cual. Los números van sin comillas y se puede hacer cuentas con ellos.</li>
<li><code>//</code> crea un comentario, que JavaScript ignora.</li>
<li>Un error te dice en qué línea se trabó JavaScript. Leelo, arreglá y volvé a ejecutar.</li>
</ul></div>
</section>

<!-- ============================ MISIÓN 1 ============================ -->
<section class="mission" data-id="m1" data-track="base" data-mins="30" data-title="Variables" data-goal="Guardar datos para usarlos después, como si fueran cajas con etiqueta.">
<h2 class="b-h">La idea</h2>
<div class="b-text">
<p>Muchas veces necesitás <strong>recordar</strong> un dato para usarlo más adelante: el nombre de alguien, un precio, los puntos de un juego. Para eso existen las <dfn data-g="variable">variables</dfn>.</p>
<p>Pensá una variable como una <strong>caja con una etiqueta</strong>. La etiqueta es el nombre; adentro guardás un <dfn data-g="valor">valor</dfn>. Cuando después escribís el nombre, JavaScript abre la caja y usa lo que hay adentro.</p>
</div>
<div class="b-example"><script type="text/plain" class="js">
let edad = 25;
console.log(edad);
</script>
<ol class="explain">
<li><code>let</code> significa "creá una caja nueva".</li>
<li><code>edad</code> es la etiqueta, el nombre de la caja.</li>
<li><code>=</code> significa "guardá adentro". Ojo: en programación <strong>no</strong> significa "es igual a" como en matemática. Se lee "guardá 25 en la caja edad". Esto se llama <dfn data-g="asignar">asignar</dfn>.</li>
<li><code>25</code> es el valor que se guarda.</li>
<li><code>console.log(edad)</code>: como <code>edad</code> no tiene comillas, JavaScript busca la caja con ese nombre y muestra lo que hay adentro, o sea 25.</li>
</ol>
</div>

<h2 class="b-h">Las cajas pueden cambiar</h2>
<div class="b-text">
<p>A una caja creada con <code>let</code> le podés cambiar el contenido. Para cambiarla <strong>no</strong> se vuelve a escribir <code>let</code> (la caja ya existe): solo el nombre, <code>=</code> y el valor nuevo. El valor viejo se pierde. Seguilo paso a paso:</p>
</div>
<div class="b-trace"><script type="text/plain" class="js">
let edad = 25;
console.log(edad);
edad = 26;
console.log(edad);
</script><script type="text/plain" class="steps">
1 ¦ edad = 25 ¦  ¦ <code>let</code> crea una caja llamada <code>edad</code> y guarda adentro el número 25. Mirá el panel de cajas.
2 ¦  ¦ 25 ¦ <code>console.log(edad)</code>: JavaScript abre la caja <code>edad</code>, encuentra 25 y lo muestra.
3 ¦ edad = 26 ¦  ¦ Guardamos 26 en la misma caja. El 25 se pierde: una caja guarda un solo valor a la vez.
4 ¦  ¦ 26 ¦ Se vuelve a mostrar <code>edad</code>, pero ahora la caja tiene 26.
</script></div>
<div class="b-quiz" data-id="q1-a" data-answer="1">
<script type="text/plain" class="code">
let puntos = 10;
puntos = 20;
console.log(puntos);
</script>
<script type="text/plain" class="opt">10</script>
<script type="text/plain" class="opt">20</script>
<script type="text/plain" class="opt">30</script>
<script type="text/plain" class="opt">10
20</script>
<div class="why"><p>La segunda línea reemplaza el 10 por un 20. Una caja guarda un solo valor; no suma ni acumula, a menos que se lo pidas.</p></div>
</div>

<h2 class="b-h">Con comillas o sin comillas</h2>
<div class="b-text">
<p>Esta es la confusión más común al empezar, así que conviene frenar acá:</p>
<ul>
<li><code>console.log(nombre)</code>, sin comillas, significa "mostrá lo que hay <strong>adentro</strong> de la caja <code>nombre</code>".</li>
<li><code>console.log("nombre")</code>, con comillas, significa "mostrá la palabra <em>nombre</em>, tal cual".</li>
</ul>
</div>
<div class="b-quiz" data-id="q1-b" data-answer="1">
<script type="text/plain" class="code">
let nombre = "Lu";
console.log("nombre");
console.log(nombre);
</script>
<script type="text/plain" class="opt">Lu
Lu</script>
<script type="text/plain" class="opt">nombre
Lu</script>
<script type="text/plain" class="opt">nombre
nombre</script>
<script type="text/plain" class="opt">Lu
nombre</script>
<div class="why"><p>Con comillas es un texto literal: muestra la palabra <em>nombre</em>. Sin comillas es la caja: muestra lo que tiene adentro, <code>Lu</code>.</p></div>
</div>
<div class="b-challenge" data-mini data-id="t1-1" data-title="Tus primeras cajas">
<div class="prompt"><p>Creá una variable <code>nombre</code> con tu nombre (entre comillas, porque es texto) y otra <code>edad</code> con tu edad (sin comillas, porque es un número). Después mostrá las dos con <code>console.log</code>.</p></div>
<script type="text/plain" class="starter">

// 2. Mostralas en la consola

</script>
<script type="text/plain" class="tests">

edad guarda un número :: typeof edad === "number"
Mostrás el nombre en la consola :: __logs.some(l => l.includes(nombre))
Mostrás la edad en la consola :: __logs.some(l => l.includes(String(edad)))
</script>

</div>

<h2 class="b-h">Calcular con variables</h2>
<div class="b-text">
<p>Lo más útil de las variables es que podés usarlas en cuentas. Mirá esta línea, que al principio parece rara:</p>
<p><code>total = total + 50;</code></p>
<p>En matemática no tendría sentido, pero acordate de que <code>=</code> significa "guardá". JavaScript la lee en dos tiempos: <strong>primero</strong> calcula lo de la derecha (<code>total + 50</code>, usando lo que hay en la caja en ese momento) y <strong>después</strong> guarda el resultado en la caja de la izquierda.</p>
</div>
<div class="b-trace"><script type="text/plain" class="js">
let precio = 100;
let cantidad = 3;
let total = precio * cantidad;
console.log(total);
total = total + 50;
console.log(total);
</script><script type="text/plain" class="steps">
1 ¦ precio = 100 ¦  ¦ Se crea la caja <code>precio</code> con 100.
2 ¦ cantidad = 3 ¦  ¦ Se crea la caja <code>cantidad</code> con 3.
3 ¦ total = 300 ¦  ¦ Primero se calcula la derecha: <code>precio * cantidad</code> → 100 * 3 → 300. Después se crea la caja <code>total</code> y se guarda 300.
4 ¦  ¦ 300 ¦ Se muestra lo que hay en <code>total</code>.
5 ¦ total = 350 ¦  ¦ Derecha primero: <code>total + 50</code> → 300 + 50 → 350. Ese resultado se guarda de nuevo en <code>total</code>.
6 ¦  ¦ 350 ¦ Ahora <code>total</code> vale 350.
</script></div>
<div class="b-text">
<p>Como sumarle algo a una variable es muy común, hay atajos: <code>total += 50</code> es lo mismo que <code>total = total + 50</code>, y <code>contador++</code> le suma 1.</p>
<p>Otro truco: <code>console.log</code> puede mostrar varias cosas a la vez si las separás con comas, y les pone un espacio en el medio. <code>console.log("Total:", total)</code> muestra <code>Total: 350</code>.</p>
</div>
<div class="b-quiz" data-id="q1-c" data-answer="1">
<script type="text/plain" class="code">

x = x + 2;
x = x * 10;
console.log(x);
</script>
<script type="text/plain" class="opt">52</script>
<script type="text/plain" class="opt">70</script>
<script type="text/plain" class="opt">17</script>
<script type="text/plain" class="opt">7</script>
<div class="why"><p>Paso a paso: <code>x</code> empieza en 5; después 5 + 2 = 7; después 7 * 10 = 70. Cada línea usa el valor que dejó la anterior.</p></div>
</div>
<div class="b-challenge" data-mini data-id="t1-2" data-title="Sumar puntos">

No escribiste 15 a mano :: !src ==> \b15\b
</script>
<div class="hint"><code>puntos = puntos + 10;</code> calcula 0 + 10 y lo guarda en <code>puntos</code>.</div>
<div class="hint">Con el atajo es más corto: <code>puntos += 5;</code></div>

</div>

<h2 class="b-h">const: cajas selladas</h2>
<div class="b-text">
<p>Además de <code>let</code> existe <code>const</code> (de "constante"). Crea una caja <strong>sellada</strong>: guardás un valor al crearla y después no se puede cambiar. Si lo intentás, da error.</p>
<p>¿Para qué querrías una caja que no cambia? Para protegerte de errores: si un dato no debería cambiar (una fecha de nacimiento, el precio de un producto), <code>const</code> te avisa si por accidente lo pisás.</p>
<p><strong>Regla práctica:</strong> usá <code>const</code>, y cambiala por <code>let</code> solo cuando necesites cambiar el valor. (En código viejo vas a ver <code>var</code>: es la forma antigua, no la uses.)</p>
</div>
<div class="b-example" data-error><script type="text/plain" class="js">
const pais = "Uruguay";
console.log(pais);
pais = "Chile";
console.log(pais);
</script>
<ol class="explain">
<li>Se crea la caja sellada <code>pais</code> con el texto "Uruguay".</li>
<li>Se muestra: Uruguay.</li>
<li>Guardar otro valor en una <code>const</code> da error: <em>Assignment to constant variable</em> ("asignación a una variable constante").</li>
<li>Esta línea no llega a ejecutarse. Probá cambiar <code>const</code> por <code>let</code> en la línea 1 y ejecutá de nuevo.</li>
</ol>
</div>

<h2 class="b-h">Cómo ponerles nombre</h2>
<div class="b-text">
<ul>
<li><strong>Sin espacios.</strong> Si son varias palabras, se juntan y cada palabra nueva empieza con mayúscula: <code>precioTotal</code>. (Se llama <em>camelCase</em>, porque las mayúsculas parecen jorobas de camello.)</li>
<li><strong>No pueden empezar con un número:</strong> <code>jugador1</code> sí, <code>1jugador</code> no.</li>
<li><strong>Mayúsculas y minúsculas importan:</strong> <code>edad</code> y <code>Edad</code> son dos cajas distintas.</li>
<li><strong>Que digan qué guardan:</strong> <code>precio</code> se entiende; <code>x</code>, no.</li>
<li><strong>Mejor sin tildes ni ñ:</strong> funcionan, pero traen problemas. <code>anio</code> en vez de <code>año</code>.</li>
</ul>
</div>

<h2 class="b-h">Tipos de datos</h2>
<div class="b-text">
<p>Cada valor tiene un <dfn data-g="tipo">tipo</dfn>. Por ahora te alcanza con estos cuatro:</p>
<ul>
<li><strong>number</strong> (número): <code>42</code>, <code>-3</code>, <code>9.99</code>. Sin comillas.</li>
<li><strong>string</strong> (texto): <code>"hola"</code>, <code>"42"</code>. Siempre entre comillas, aunque adentro haya números.</li>
<li><strong>boolean</strong> (<dfn data-g="booleano">booleano</dfn>): solo dos valores posibles, <code>true</code> (verdadero) o <code>false</code> (falso). Sirve para cosas de sí o no: ¿hay stock? ¿es mayor de edad?</li>
<li><strong>undefined</strong> (<dfn data-g="undefined">indefinido</dfn>): una caja que existe pero todavía no tiene nada adentro.</li>
</ul>
<p><code>typeof</code> te dice de qué tipo es un valor.</p>
</div>
<div class="b-example"><script type="text/plain" class="js">
let producto = "Mate";
let precio = 900;
let hayStock = true;
let descuento;

console.log(typeof producto);
console.log(typeof precio);
console.log(typeof hayStock);
console.log(descuento);
console.log(typeof "900");
</script>
<ol class="explain">
<li><code>producto</code> guarda un texto: su tipo es <code>string</code>.</li>
<li><code>precio</code> guarda un número: <code>number</code>.</li>
<li><code>hayStock</code> guarda <code>true</code>: <code>boolean</code>.</li>
<li><code>let descuento;</code> crea la caja sin guardar nada, por eso muestra <code>undefined</code>.</li>
<li><code>"900"</code> está entre comillas, así que es un texto (<code>string</code>), aunque adentro haya dígitos.</li>
</ol>
</div>
<div class="b-quiz" data-id="q1-d" data-answer="1">
<script type="text/plain" class="code">
console.log(typeof "25");
</script>
<script type="text/plain" class="opt">number</script>
<script type="text/plain" class="opt">string</script>
<script type="text/plain" class="opt">25</script>
<script type="text/plain" class="opt">boolean</script>
<div class="why"><p>Las comillas mandan: cualquier cosa entre comillas es un texto. <code>25</code> sin comillas sería un número.</p></div>
</div>

<div class="b-recap"><ul>
<li>Una variable es una <strong>caja con nombre</strong> que guarda un valor.</li>
<li><code>let</code> crea una caja que se puede cambiar; <code>const</code>, una sellada. Usá <code>const</code> salvo que necesites cambiarla.</li>
<li><code>=</code> significa "guardá", no "es igual".</li>
<li>En <code>x = x + 1</code>, primero se calcula la derecha y después se guarda en la izquierda.</li>
<li>Sin comillas es una caja; con comillas es un texto literal.</li>
<li>Tipos básicos: number, string, boolean y undefined.</li>
</ul></div>

<!-- ============================ MISIÓN 2 ============================ -->
<section class="mission" data-id="m2" data-track="base" data-mins="30" data-title="Números y textos" data-goal="Hacer cuentas, armar mensajes combinando textos y variables, y convertir un texto en número.">
<h2 class="b-h">Más operaciones con números</h2>
<div class="b-text">
<p>Ya conocés <code>+ - * /</code>. Hay dos más que conviene tener a mano:</p>
<ul>
<li><code>%</code> (resto): lo que sobra de una división. <code>17 % 5</code> da 2, porque si repartís 17 caramelos entre 5 personas, cada una recibe 3 y <strong>sobran 2</strong>. Sirve mucho para saber si un número es par: <code>n % 2</code> da 0 cuando lo es.</li>
<li><code>**</code> (potencia): <code>2 ** 3</code> es 2 × 2 × 2 = 8.</li>
</ul>
<p>Como en matemática, la multiplicación y la división se hacen antes que la suma y la resta. Si querés otro orden, usá paréntesis.</p>
</div>
<div class="b-example"><script type="text/plain" class="js">
console.log(17 % 5);
console.log(10 % 2);
console.log(2 ** 3);
console.log(2 + 3 * 4);
console.log((2 + 3) * 4);
</script>
<ol class="explain">
<li>17 entre 5 da 3 y sobran 2: muestra <code>2</code>.</li>
<li>10 entre 2 da 5 y no sobra nada: <code>0</code>. Por eso 10 es par.</li>
<li>2 a la tercera: <code>8</code>.</li>
<li>Primero la multiplicación (3 * 4 = 12) y después la suma: <code>14</code>.</li>
<li>Los paréntesis cambian el orden: 2 + 3 = 5, después 5 * 4 = <code>20</code>.</li>
</ol>
</div>
<div class="b-quiz" data-id="q2-a" data-answer="1">
<script type="text/plain" class="code">
console.log(10 % 3);
</script>
<script type="text/plain" class="opt">3</script>
<script type="text/plain" class="opt">1</script>
<script type="text/plain" class="opt">3.3333333333333335</script>
<script type="text/plain" class="opt">0</script>
<div class="why"><p>10 entre 3 da 3 (porque 3 × 3 = 9) y sobra 1. <code>%</code> te da lo que sobra.</p></div>
</div>
<div class="b-challenge" data-mini data-id="t2-1" data-title="Minutos de un día">
<div class="prompt"><p>Creá <code>const minutosPorDia</code> con la cantidad de minutos que tiene un día. Dejá que JavaScript haga la cuenta: un día tiene 24 horas y cada hora tiene 60 minutos.</p></div>
<script type="text/plain" class="starter">
// creá minutosPorDia

</script>
<script type="text/plain" class="tests">
minutosPorDia vale 1440 :: minutosPorDia ==> 1440
JavaScript hace la cuenta (no escribiste 1440) :: !src ==> 1440
</script>
<div class="hint">Del lado derecho del <code>=</code> puede ir una cuenta: <code>const minutosPorDia = 24 * 60;</code></div>
<script type="text/plain" class="solution">

</script>
</div>

<h2 class="b-h">Unir textos</h2>
<div class="b-text">
<p>Con textos, <code>+</code> no suma: <strong>pega</strong> uno detrás del otro (se dice <em>concatenar</em>). Ojo con los espacios: JavaScript no agrega ninguno por su cuenta.</p>
</div>
<div class="b-example"><script type="text/plain" class="js">
const nombre = "Ana";
console.log("Hola" + nombre);
console.log("Hola " + nombre);
console.log("Hola, " + nombre + "!");

const saludo = "Buenas" + " " + "noches";
console.log(saludo);
</script>
<ol class="explain">
<li>Se guarda el texto "Ana" en <code>nombre</code>.</li>
<li>Pega "Hola" y "Ana" tal cual: <code>HolaAna</code>, sin espacio.</li>
<li>Con un espacio adentro de las comillas de "Hola " sí queda separado.</li>
<li>Se pueden pegar varias piezas: texto, variable, texto.</li>
<li>El resultado de pegar textos también se puede guardar en una variable.</li>
</ol>
</div>
<div class="b-text">
<p>Pegar con <code>+</code> se vuelve incómodo cuando hay muchas piezas. Por eso existen los <dfn data-g="template">template literals</dfn>: textos escritos entre <strong>comillas invertidas</strong> <code>`</code>. Adentro, todo lo que pongas entre <code>${</code> y <code>}</code> se reemplaza por su valor.</p>
<p>¿Dónde está la comilla invertida? En los teclados en español suele estar en la tecla que está a la derecha de la <kbd>P</kbd> (junto con el acento <code>^</code>), o al lado del <kbd>Enter</kbd>. A veces hay que tocarla dos veces o tocarla y después la barra espaciadora.</p>
</div>
<div class="b-example"><script type="text/plain" class="js">
const producto = "medialunas";
const precio = 400;
const cantidad = 3;

console.log("Llevás " + cantidad + " " + producto + " por $" + precio * cantidad);
console.log(`Llevás ${cantidad} ${producto} por $${precio * cantidad}`);
</script>
<ol class="explain">
<li>Las dos últimas líneas muestran exactamente lo mismo.</li>
<li>La primera pega cinco pedazos con <code>+</code>, y hay que acordarse de cada espacio.</li>
<li>La segunda escribe el texto de corrido y mete los valores con <code>${...}</code>. Se lee mucho mejor.</li>
<li>Adentro de <code>${ }</code> puede ir una cuenta: <code>${precio * cantidad}</code> se reemplaza por 1200.</li>
<li>En <code>$${...}</code> el primer <code>$</code> es el signo pesos, un carácter común del texto.</li>
</ol>
</div>
<div class="b-challenge" data-mini data-id="t2-2" data-title="Armá una frase">
<div class="prompt"><p>Tenés <code>const nombre = "Ana"</code> y <code>const ciudad = "Lima"</code>. Creá <code>const frase</code> con el texto <code>Ana vive en Lima.</code> usando un template literal con las dos variables.</p></div>
<script type="text/plain" class="starter">

const ciudad = "Lima";
// creá frase con un template literal

</script>
<script type="text/plain" class="tests">
frase es "Ana vive en Lima." :: frase ==> "Ana vive en Lima."
Usás un template literal con ${} :: src ==> `[^`]*\$\{
Usás las variables (no escribiste "Ana vive" a mano) :: !src ==> Ana vive
</script>
<div class="hint">Empezá con comillas invertidas: <code>const frase = `...`;</code></div>
<div class="hint">Adentro va: <code>${nombre} vive en ${ciudad}.</code></div>
<script type="text/plain" class="solution">
const nombre = "Ana";
const ciudad = "Lima";
const frase = `${nombre} vive en ${ciudad}.`;
</script>
</div>

<h2 class="b-h">Cosas que saben hacer los textos</h2>
<div class="b-text">
<p>Los textos traen herramientas incorporadas, que se llaman <dfn data-g="metodo">métodos</dfn>. Se usan poniendo un punto después del texto (o de la variable) y paréntesis al final: <code>palabra.toUpperCase()</code> se lee "palabra, pasate a mayúsculas". Algunos muy útiles:</p>
<ul>
<li><code>.length</code>: cuántos caracteres tiene. Este va sin paréntesis porque es un dato, no una acción.</li>
<li><code>.toUpperCase()</code> y <code>.toLowerCase()</code>: pasar a mayúsculas o a minúsculas.</li>
<li><code>.includes("algo")</code>: ¿contiene ese texto? Responde <code>true</code> o <code>false</code>.</li>
<li><code>.trim()</code>: saca los espacios de los costados.</li>
</ul>
</div>
<div class="b-example"><script type="text/plain" class="js">
const palabra = "JavaScript";
console.log(palabra.length);
console.log(palabra.toUpperCase());
console.log(palabra.includes("Script"));
console.log("   hola   ".trim());
</script></div>

<h2 class="b-h">La trampa: "5" no es 5</h2>
<div class="b-text">
<p><code>"5"</code>, con comillas, es un texto que contiene el carácter 5. <code>5</code>, sin comillas, es un número. Se ven parecidos, pero se comportan distinto:</p>
</div>
<div class="b-example"><script type="text/plain" class="js">
console.log(5 + 3);
console.log("5" + 3);
console.log(Number("5") + 3);
</script>
<ol class="explain">
<li>Dos números: suma, da <code>8</code>.</li>
<li>Si uno de los dos es texto, <code>+</code> pega: "5" pegado a 3 da <code>53</code>.</li>
<li><code>Number("5")</code> convierte el texto en número. Ahora sí suma: <code>8</code>.</li>
</ol>
</div>
<div class="b-text">
<p>Esto importa mucho en la vida real: todo lo que una persona escribe en un formulario llega como texto, aunque sea un número. Antes de hacer cuentas, convertilo con <code>Number()</code>.</p>
</div>
<div class="b-quiz" data-id="q2-c" data-answer="1">
<script type="text/plain" class="code">
console.log("10" + 5);
</script>
<script type="text/plain" class="opt">15</script>
<script type="text/plain" class="opt">105</script>
<script type="text/plain" class="opt">10 5</script>
<script type="text/plain" class="opt">Error</script>
<div class="why"><p><code>"10"</code> es un texto, así que <code>+</code> pega en lugar de sumar: "10" y "5" quedan pegados como "105".</p></div>
</div>

<div class="b-recap"><ul>
<li><code>%</code> da el resto de una división; <code>**</code>, una potencia. Los paréntesis cambian el orden de las cuentas.</li>
<li>Con textos, <code>+</code> pega. Los espacios hay que ponerlos vos.</li>
<li>Los template literals (comillas invertidas) meten valores en un texto con <code>${ }</code>.</li>
<li>Los métodos son acciones que traen los valores: <code>texto.toUpperCase()</code>.</li>
<li><code>"5"</code> no es <code>5</code>. <code>Number()</code> convierte un texto en número.</li>
</ul></div>

<!-- ============================ MISIÓN 3 ============================ -->
<section class="mission" data-id="m3" data-track="base" data-mins="35" data-title="Funciones" data-goal="Escribir tus propias instrucciones reutilizables: definirlas, llamarlas, pasarles datos y recibir un resultado.">
<h2 class="b-h">¿Para qué sirven?</h2>
<div class="b-text">
<p>Imaginá que en tu programa tenés que calcular un precio con descuento en veinte lugares distintos. Podrías copiar la cuenta veinte veces... y si un día cambia el descuento, tendrías que corregirla en veinte lugares.</p>
<p>Una <dfn data-g="funcion">función</dfn> resuelve eso: es una <strong>receta con nombre</strong>. La escribís una vez y después la usás cuantas veces quieras, diciendo solo su nombre. De hecho ya usaste una: <code>console.log</code> es una función que alguien escribió por vos.</p>
</div>

<h2 class="b-h">Definir y llamar</h2>
<div class="b-text">
<p>Una función tiene dos momentos distintos:</p>
<ol>
<li><strong>Definirla</strong>: escribir la receta. Esto <em>no</em> la ejecuta; solo la guarda con un nombre.</li>
<li><strong><dfn data-g="llamar">Llamarla</dfn></strong>: decirle "ejecutate ahora", escribiendo su nombre seguido de paréntesis.</li>
</ol>
</div>
<div class="b-example"><script type="text/plain" class="js">
function saludar() {
  console.log("¡Hola!");
  console.log("¿Cómo estás?");
}

saludar();
saludar();
</script>
<ol class="explain">
<li><code>function</code> avisa: "voy a definir una función".</li>
<li><code>saludar</code> es el nombre de la función (con las mismas reglas que los nombres de variables).</li>
<li>Los paréntesis <code>()</code> son para los datos que recibe. Por ahora, ninguno.</li>
<li>Las llaves <code>{ }</code> encierran las instrucciones de la receta: eso es un <dfn data-g="bloque">bloque</dfn>. Las líneas de adentro se escriben corridas a la derecha (con sangría) para que se vea qué está adentro.</li>
<li>Las líneas 1 a 4 solo guardan la receta: todavía no se muestra nada.</li>
<li><code>saludar();</code> la llama: recién ahí se ejecuta lo de adentro. Como la llamamos dos veces, se ejecuta dos veces.</li>
</ol>
</div>
<div class="b-text"><p>Seguí paso a paso cómo JavaScript "salta" adentro de la función cuando la llamás y después vuelve:</p></div>
<div class="b-trace"><script type="text/plain" class="js">
function saludar() {
  console.log("¡Hola!");
}

console.log("Arranca el programa");
saludar();
console.log("Volví de la función");
saludar();
</script><script type="text/plain" class="steps">
1 ¦ saludar = [función] ¦  ¦ JavaScript lee la definición y guarda la receta con el nombre <code>saludar</code>. Todavía no ejecuta lo que hay adentro.
5 ¦  ¦ Arranca el programa ¦ Pasa de largo la definición y sigue con la primera instrucción.
6 ¦  ¦  ¦ <code>saludar()</code>: llamamos a la función. JavaScript salta adentro de ella...
2 ¦  ¦ ¡Hola! ¦ ...y ejecuta sus instrucciones.
3 ¦  ¦  ¦ Llegó a la llave de cierre: la función terminó. JavaScript vuelve al lugar desde donde la llamaron.
7 ¦  ¦ Volví de la función ¦ Sigue con la línea que viene después de la llamada.
8 ¦  ¦  ¦ Otra llamada: vuelve a saltar adentro de la función.
2 ¦  ¦ ¡Hola! ¦ La receta se ejecuta de nuevo.
3 ¦  ¦  ¦ Fin de la función. No quedan más líneas: el programa termina.
</script></div>
<div class="b-challenge" data-mini data-id="t3-1" data-title="Tu primera función">
<div class="prompt"><p>Definí una función llamada <code>cantar</code> que muestre <code>La la la</code> en la consola. Después llamala <strong>tres veces</strong>.</p></div>
<script type="text/plain" class="starter">
// 1. Definí la función cantar


// 2. Llamala tres veces

</script>
<script type="text/plain" class="tests">
Existe la función cantar :: typeof cantar === "function"
La consola muestra "La la la" tres veces :: logs ==> ["La la la","La la la","La la la"]
</script>
<div class="hint">La definición es igual a la de <code>saludar</code> del ejemplo, cambiando el nombre y el texto.</div>
<div class="hint">Para llamarla: <code>cantar();</code>. Escribilo en tres líneas, afuera de las llaves.</div>
<script type="text/plain" class="solution">
function cantar() {
  console.log("La la la");
}

cantar();
cantar();
cantar();
</script>
</div>

<h2 class="b-h">Parámetros: pasarle datos</h2>
<div class="b-text">
<p>Una receta es más útil si le podés dar ingredientes. Los <dfn data-g="parametro">parámetros</dfn> son cajas que la función recibe cuando la llaman. Se escriben entre los paréntesis de la definición; el valor concreto (el <dfn data-g="argumento">argumento</dfn>) se pone entre los paréntesis de la llamada.</p>
</div>
<div class="b-trace"><script type="text/plain" class="js">
function saludar(nombre) {
  console.log("Hola, " + nombre);
}

saludar("Ana");
saludar("Leo");
</script><script type="text/plain" class="steps">
1 ¦ saludar = [función] ¦  ¦ Se guarda la función. Fijate que tiene un parámetro: <code>nombre</code>.
5 ¦  ¦  ¦ Llamamos a <code>saludar</code> y le pasamos <code>"Ana"</code>.
1 ¦ saludar() › nombre = "Ana" ¦  ¦ Al entrar, se crea la caja <code>nombre</code> <strong>adentro de la función</strong>, con el valor que le pasamos: "Ana".
2 ¦  ¦ Hola, Ana ¦ Se usa la caja: "Hola, " pegado con "Ana".
3 ¦ -saludar() › ¦  ¦ La función termina y su caja <code>nombre</code> desaparece: solo existía mientras la función se ejecutaba.
6 ¦  ¦  ¦ Segunda llamada, ahora con <code>"Leo"</code>.
1 ¦ saludar() › nombre = "Leo" ¦  ¦ Se crea una caja <code>nombre</code> nueva, esta vez con "Leo".
2 ¦  ¦ Hola, Leo ¦ Misma receta, distinto ingrediente, distinto resultado.
3 ¦ -saludar() › ¦  ¦ Fin. Así una sola función sirve para saludar a cualquiera.
</script></div>
<div class="b-text"><p>Una función puede recibir varios parámetros separados por comas. Se asignan en orden: el primer valor va al primer parámetro, el segundo al segundo.</p></div>
<div class="b-example"><script type="text/plain" class="js">
function presentar(nombre, edad) {
  console.log(nombre + " tiene " + edad + " años");
}

presentar("Ana", 30);
presentar("Leo", 25);
</script></div>

<h2 class="b-h">return: devolver un resultado</h2>
<div class="b-text">
<p>Hasta ahora las funciones solo <em>mostraban</em> cosas. Pero muchas veces querés que una función <strong>calcule</strong> algo y te lo entregue para seguir usándolo. Para eso está <dfn data-g="return">return</dfn> ("devolver").</p>
<p>Pensalo como una exprimidora: le ponés naranjas (el parámetro), hace su trabajo y te <strong>devuelve</strong> un vaso de jugo (el <code>return</code>). Con ese vaso podés hacer lo que quieras: guardarlo en una variable, mostrarlo o usarlo en otra cuenta.</p>
</div>
<div class="b-trace"><script type="text/plain" class="js">
function doble(n) {
  return n * 2;
}

const resultado = doble(4);
console.log(resultado);
console.log(doble(10) + 1);
</script><script type="text/plain" class="steps">
1 ¦ doble = [función] ¦  ¦ Se guarda la función <code>doble</code>, que recibe un parámetro <code>n</code>.
5 ¦  ¦  ¦ Para guardar algo en <code>resultado</code>, primero hay que calcular la derecha: <code>doble(4)</code>. Se llama a la función.
1 ¦ doble() › n = 4 ¦  ¦ Se crea la caja <code>n</code> con 4.
2 ¦  ¦  ¦ <code>return n * 2</code>: calcula 4 * 2 = 8 y lo <strong>devuelve</strong>. La función termina en este momento.
5 ¦ -doble() ›; resultado = 8 ¦  ¦ <code>doble(4)</code> se reemplaza por lo que devolvió, 8, y ese 8 se guarda en <code>resultado</code>.
6 ¦  ¦ 8 ¦ Se muestra <code>resultado</code>.
7 ¦  ¦  ¦ Para mostrar <code>doble(10) + 1</code>, primero hay que calcular <code>doble(10)</code>...
1 ¦ doble() › n = 10 ¦  ¦ ...se crea <code>n</code> con 10...
2 ¦ -doble() › ¦  ¦ ...y la función devuelve 20.
7 ¦  ¦ 21 ¦ <code>doble(10) + 1</code> pasa a ser 20 + 1 = 21, y eso se muestra.
</script></div>
<div class="b-text">
<p><strong>Importante: <code>console.log</code> no es <code>return</code>.</strong> <code>console.log</code> muestra algo en la pantalla para que <em>vos</em> lo veas; <code>return</code> le entrega el valor <em>al programa</em> para que lo siga usando. Una función sin <code>return</code> devuelve <code>undefined</code>, o sea, nada. En los desafíos, las pruebas revisan lo que tu función <strong>devuelve</strong>.</p>
</div>
<div class="b-example"><script type="text/plain" class="js">
function conLog(x) {
  console.log(x * 2);
}

function conReturn(x) {
  return x * 2;
}

const a = conLog(5);     // muestra 10, pero no devuelve nada
const b = conReturn(5);  // no muestra nada, pero devuelve 10
console.log("a vale", a);
console.log("b vale", b);
</script></div>
<div class="b-quiz" data-id="q2-1" data-answer="2">
<script type="text/plain" class="code">
function f(x) {
  x * 2;
}
console.log(f(4));
</script>
<script type="text/plain" class="opt">8</script>
<script type="text/plain" class="opt">4</script>
<script type="text/plain" class="opt">undefined</script>
<script type="text/plain" class="opt">Error</script>
<div class="why"><p>Falta <code>return</code>. La función calcula <code>x * 2</code> pero no lo entrega a nadie; sin <code>return</code> devuelve <code>undefined</code>. Es el error número uno de quien empieza.</p></div>
</div>
<div class="b-challenge" data-mini data-id="t3-2" data-title="Triple">
<div class="prompt"><p>Completá la función <code>triple(n)</code> para que <strong>devuelva</strong> (con <code>return</code>) el número multiplicado por 3.</p></div>
<script type="text/plain" class="starter">
function triple(n) {
  // devolvé el resultado con return
}
</script>
<script type="text/plain" class="tests">
triple(2) devuelve 6 :: triple(2) ==> 6
triple(10) devuelve 30 :: triple(10) ==> 30
triple(0) devuelve 0 :: triple(0) ==> 0
</script>
<div class="hint">Mirá la función <code>doble</code> del paso a paso: es igual, cambiando el 2 por un 3.</div>
<script type="text/plain" class="solution">
function triple(n) {
  return n * 3;

</div>

<h2 class="b-h">Otra forma de escribirlas: funciones flecha</h2>
<div class="b-text"><p>En código moderno vas a ver mucho esta otra forma, llamada <strong>función flecha</strong>. Hace lo mismo con menos texto:</p></div>
<div class="b-example"><script type="text/plain" class="js">
// Forma clásica
function doble(n) {
  return n * 2;
}

// Función flecha, guardada en una variable
const dobleFlecha = (n) => n * 2;

console.log(doble(5), dobleFlecha(5));
</script>
<ol class="explain">
<li><code>const dobleFlecha =</code> guarda la función en una variable, como cualquier otro valor.</li>
<li><code>(n)</code> son los parámetros, igual que antes.</li>
<li><code>=&gt;</code> es la "flecha". Se lee "da como resultado".</li>
<li><code>n * 2</code>: si después de la flecha hay una sola expresión y no hay llaves, se devuelve sola, sin escribir <code>return</code>.</li>
</ol>
</div>
<div class="b-text"><p>No hace falta que la domines ya. Con entender que <code>(n) =&gt; n * 2</code> es "una función que recibe n y devuelve n * 2", alcanza. En los desafíos de los Fundamentos podés usar la forma clásica.</p></div>

<div class="b-recap"><ul>
<li>Una función es una receta con nombre. <strong>Definirla</strong> la guarda; <strong>llamarla</strong> (<code>nombre()</code>) la ejecuta.</li>
<li>Los parámetros son cajas que se crean al llamarla, con los valores que le pasás.</li>
<li><code>return</code> devuelve un resultado y termina la función. Sin <code>return</code>, devuelve <code>undefined</code>.</li>
<li><code>console.log</code> muestra; <code>return</code> entrega. No son lo mismo.</li>
<li><code>(n) =&gt; n * 2</code> es una forma corta de escribir una función.</li>
</ul></div>

<!-- ============================ MISIÓN 4 ============================ -->
<section class="mission" data-id="m4" data-track="base" data-mins="30" data-title="Decisiones" data-goal="Hacer que el programa elija qué hacer según los datos: comparaciones, if y else.">
<h2 class="b-h">Preguntas de sí o no</h2>
<div class="b-text">
<p>Los programas necesitan decidir: si la contraseña es correcta, dejá entrar; si no, mostrá un error. Para decidir, primero hay que <strong>preguntar</strong>. En JavaScript una pregunta es una <dfn data-g="comparacion">comparación</dfn>, y su respuesta es siempre un booleano: <code>true</code> o <code>false</code>.</p>
<ul>
<li><code>&gt;</code> mayor que, <code>&lt;</code> menor que.</li>
<li><code>&gt;=</code> mayor o igual, <code>&lt;=</code> menor o igual.</li>
<li><code>===</code> ¿es igual?, <code>!==</code> ¿es distinto?</li>
</ul>
</div>
<div class="b-example"><script type="text/plain" class="js">
const edad = 20;
console.log(edad > 18);
console.log(edad < 18);
console.log(edad === 20);
console.log(edad !== 20);
console.log("hola" === "Hola");
</script>
<ol class="explain">
<li>Se guarda 20 en <code>edad</code>.</li>
<li>¿20 es mayor que 18? Sí: <code>true</code>.</li>
<li>¿20 es menor que 18? No: <code>false</code>.</li>
<li>¿20 es igual a 20? <code>true</code>.</li>
<li>¿20 es distinto de 20? <code>false</code>.</li>
<li>Para JavaScript una mayúscula hace que dos textos sean distintos: <code>false</code>.</li>
</ol>
</div>
<div class="b-tip"><p><strong>Un <code>=</code> guarda; tres <code>===</code> preguntan.</strong> <code>edad = 20</code> guarda 20 en la caja. <code>edad === 20</code> pregunta "¿edad vale 20?". Confundirlos es de los errores más comunes. (También existe <code>==</code>, con dos signos, pero da resultados raros: usá siempre tres.)</p></div>
<div class="b-quiz" data-id="q4-a" data-answer="0">
<script type="text/plain" class="code">
const a = 5;
console.log(a === 5, a > 10, a !== 3);
</script>
<script type="text/plain" class="opt">true false true</script>
<script type="text/plain" class="opt">true true true</script>
<script type="text/plain" class="opt">false false true</script>
<script type="text/plain" class="opt">true false false</script>
<div class="why"><p>¿5 es igual a 5? Sí. ¿5 es mayor que 10? No. ¿5 es distinto de 3? Sí.</p></div>
</div>

<h2 class="b-h">if: si pasa esto, hacé aquello</h2>
<div class="b-text"><p><code>if</code> (en inglés, "si") ejecuta un bloque de código <strong>solo si</strong> la <dfn data-g="condicion">condición</dfn> da <code>true</code>. Con <code>else</code> ("si no") decís qué hacer en el caso contrario.</p></div>
<div class="b-example"><script type="text/plain" class="js">
const temperatura = 30;

if (temperatura > 25) {
  console.log("Hace calor: llevá agua");
} else {
  console.log("Llevá un abrigo");
}

console.log("Esta línea se ejecuta siempre");
</script>
<ol class="explain">
<li><code>if (...)</code>: entre paréntesis va la pregunta.</li>
<li>Las llaves que siguen encierran lo que se ejecuta si la respuesta es <code>true</code>.</li>
<li><code>else { ... }</code> es lo que se ejecuta si es <code>false</code>. Es opcional.</li>
<li>Siempre se ejecuta <strong>uno solo</strong> de los dos bloques, nunca los dos.</li>
<li>Después del if/else, el programa sigue normalmente. Probá cambiar la temperatura a 10 y ejecutá de nuevo.</li>
</ol>
</div>
<div class="b-text"><p>Con <code>else if</code> ("si no, si...") podés encadenar varias preguntas. Seguilo paso a paso:</p></div>
<div class="b-trace"><script type="text/plain" class="js">
const nota = 7;

if (nota >= 9) {
  console.log("Excelente");
} else if (nota >= 6) {
  console.log("Aprobado");
} else {
  console.log("A recuperar");
}
</script><script type="text/plain" class="steps">
1 ¦ nota = 7 ¦  ¦ Se guarda 7 en <code>nota</code>.
3 ¦  ¦  ¦ Primera pregunta: ¿<code>nota &gt;= 9</code>? 7 no es mayor ni igual a 9: <code>false</code>. Se saltea este bloque.
5 ¦  ¦  ¦ <code>else if</code> significa "si no, preguntá esto otro": ¿<code>nota &gt;= 6</code>? 7 sí: <code>true</code>.
6 ¦  ¦ Aprobado ¦ Entra a este bloque y lo ejecuta.
9 ¦  ¦  ¦ Como ya entró a un bloque, se saltea todo lo demás (incluido el <code>else</code>) y termina.
</script></div>
<div class="b-text"><p>Las preguntas se hacen <strong>en orden</strong> y gana la primera que da <code>true</code>. Por eso el orden importa.</p></div>
<div class="b-quiz" data-id="q4-b" data-answer="0">

if (nota >= 6) {
  console.log("Aprobado");

  console.log("Excelente");
}
</script>

<script type="text/plain" class="opt">Excelente</script>
<script type="text/plain" class="opt">Aprobado
Excelente</script>
<script type="text/plain" class="opt">No muestra nada</script>
<div class="why"><p>10 &gt;= 6 ya da <code>true</code>, así que entra al primer bloque y nunca llega a preguntar por el 9. Las condiciones más exigentes van primero.</p></div>
</div>

<h2 class="b-h">Combinar condiciones</h2>
<div class="b-text">
<p>A veces necesitás más de una condición a la vez:</p>
<ul>
<li><code>&amp;&amp;</code> (y): da <code>true</code> solo si <strong>las dos</strong> son <code>true</code>. "Tenés entrada <strong>y</strong> sos mayor".</li>
<li><code>||</code> (o): da <code>true</code> si <strong>al menos una</strong> es <code>true</code>. "Es sábado <strong>o</strong> es domingo".</li>
<li><code>!</code> (no): da vuelta el resultado. <code>!true</code> es <code>false</code>.</li>
</ul>
</div>
<div class="b-example"><script type="text/plain" class="js">
const edad = 20;
const tieneEntrada = true;

if (edad >= 18 && tieneEntrada) {
  console.log("Puede entrar al recital");
}

const dia = "sábado";
if (dia === "sábado" || dia === "domingo") {
  console.log("Es fin de semana");
}

console.log(!tieneEntrada);
</script></div>
<div class="b-quiz" data-id="q4-c" data-answer="1">
<script type="text/plain" class="code">
console.log(true && false, true || false);
</script>
<script type="text/plain" class="opt">true true</script>
<script type="text/plain" class="opt">false true</script>
<script type="text/plain" class="opt">false false</script>
<script type="text/plain" class="opt">true false</script>
<div class="why"><p><code>&amp;&amp;</code> necesita que las dos sean true: como una es false, da false. <code>||</code> necesita al menos una: como hay una true, da true.</p></div>
</div>

<div class="b-recap"><ul>
<li>Una comparación es una pregunta que se responde con <code>true</code> o <code>false</code>.</li>
<li>Un <code>=</code> guarda; <code>===</code> pregunta si son iguales.</li>
<li><code>if</code> ejecuta un bloque solo si la condición da <code>true</code>; <code>else</code>, si da <code>false</code>.</li>
<li>Con <code>else if</code> se encadenan preguntas: gana la primera que da <code>true</code>.</li>
<li><code>&amp;&amp;</code> = las dos; <code>||</code> = al menos una; <code>!</code> = lo contrario.</li>
</ul></div>

<section class="mission" data-id="m5" data-track="base" data-mins="30" data-title="Bucles" data-goal="Repetir instrucciones sin copiarlas: el bucle for, el patrón acumulador y while.">
<h2 class="b-h">¿Por qué repetir?</h2>
<div class="b-text"><p>Si quisieras mostrar los números del 1 al 100, podrías escribir cien <code>console.log</code>. Un <dfn data-g="bucle">bucle</dfn> te deja escribir la instrucción <strong>una sola vez</strong> y pedir que se repita. Cada repetición se llama <em>vuelta</em> (o iteración).</p></div>

<h2 class="b-h">El bucle for, pieza por pieza</h2>
<div class="b-example"><script type="text/plain" class="js">
for (let i = 1; i <= 5; i++) {
  console.log("Vuelta número", i);
}
console.log("Terminó el bucle");
</script>
<ol class="explain">
<li><code>for</code> significa "repetí".</li>
<li><code>let i = 1</code>: antes de empezar, crea un contador llamado <code>i</code> que arranca en 1. Esto pasa una sola vez.</li>
<li><code>i &lt;= 5</code>: antes de cada vuelta pregunta "¿i es menor o igual a 5?". Si es <code>true</code>, da otra vuelta; si es <code>false</code>, termina.</li>
<li><code>i++</code>: al final de cada vuelta, le suma 1 a <code>i</code>.</li>
<li>Lo que está entre las llaves es lo que se repite.</li>
<li>Todo junto se lee: "arrancá con i en 1; mientras i sea menor o igual a 5, ejecutá el bloque y sumale 1 a i".</li>
</ol>
</div>
<div class="b-text"><p>Esta es la vista paso a paso más importante del curso. Avanzá despacio y mirá cómo cambia <code>i</code>:</p></div>
<div class="b-trace"><script type="text/plain" class="js">
for (let i = 1; i <= 3; i++) {
  console.log("Vuelta", i);
}
console.log("Fin");
</script><script type="text/plain" class="steps">
1 ¦ i = 1 ¦  ¦ Arranque: se crea el contador <code>i</code> con 1.
1 ¦  ¦  ¦ Pregunta: ¿<code>i &lt;= 3</code>? 1 &lt;= 3, <code>true</code>. Entra al bloque.
2 ¦  ¦ Vuelta 1 ¦ Primera vuelta: muestra "Vuelta" y el valor de <code>i</code>.
1 ¦ i = 2 ¦  ¦ Terminó la vuelta: <code>i++</code> le suma 1. Ahora <code>i</code> vale 2.
1 ¦  ¦  ¦ ¿2 &lt;= 3? <code>true</code>. Otra vuelta.
2 ¦  ¦ Vuelta 2 ¦ Segunda vuelta, con <code>i</code> en 2.
1 ¦ i = 3 ¦  ¦ <code>i++</code>: ahora <code>i</code> vale 3.
1 ¦  ¦  ¦ ¿3 &lt;= 3? <code>true</code> (es igual, y la pregunta es "menor <strong>o igual</strong>"). Otra vuelta.
2 ¦  ¦ Vuelta 3 ¦ Tercera vuelta.
1 ¦ i = 4 ¦  ¦ <code>i++</code>: ahora <code>i</code> vale 4.
1 ¦  ¦  ¦ ¿4 &lt;= 3? <strong>false</strong>. El bucle termina.
4 ¦ -i ¦ Fin ¦ El contador <code>i</code> deja de existir (solo vivía dentro del bucle) y el programa sigue con la línea de abajo.
</script></div>

<h2 class="b-h">El patrón acumulador</h2>
<div class="b-text">
<p>Uno de los usos más comunes de un bucle es <strong>ir juntando</strong> un resultado: sumar todo, contar cosas, armar un texto. La receta es siempre la misma:</p>
<ol>
<li>Antes del bucle, creá una variable con un valor inicial (por ejemplo <code>let suma = 0</code>).</li>
<li>En cada vuelta, actualizala (<code>suma = suma + i</code>).</li>
<li>Después del bucle, la variable tiene el resultado.</li>
</ol>
</div>
<div class="b-trace"><script type="text/plain" class="js">
let suma = 0;
for (let i = 1; i <= 4; i++) {
  suma = suma + i;
}
console.log(suma);
</script><script type="text/plain" class="steps">
1 ¦ suma = 0 ¦  ¦ La caja <code>suma</code> arranca en 0: todavía no sumamos nada.
2 ¦ i = 1 ¦  ¦ Arranca el bucle con <code>i</code> en 1. ¿1 &lt;= 4? Sí.
3 ¦ suma = 1 ¦  ¦ <code>suma + i</code> → 0 + 1 = 1. Se guarda en <code>suma</code>.
2 ¦ i = 2 ¦  ¦ <code>i++</code>: 2. ¿2 &lt;= 4? Sí.
3 ¦ suma = 3 ¦  ¦ 1 + 2 = 3.
2 ¦ i = 3 ¦  ¦ <code>i++</code>: 3. ¿3 &lt;= 4? Sí.
3 ¦ suma = 6 ¦  ¦ 3 + 3 = 6.
2 ¦ i = 4 ¦  ¦ <code>i++</code>: 4. ¿4 &lt;= 4? Sí.
3 ¦ suma = 10 ¦  ¦ 6 + 4 = 10.
2 ¦ i = 5 ¦  ¦ <code>i++</code>: 5. ¿5 &lt;= 4? No: el bucle termina.
5 ¦ -i ¦ 10 ¦ Se muestra el resultado acumulado: 1 + 2 + 3 + 4 = 10.
</script></div>

<h2 class="b-h">while: repetir mientras algo sea cierto</h2>
<div class="b-text"><p><code>while</code> ("mientras") repite un bloque mientras la condición sea <code>true</code>. Se usa cuando no sabés de antemano cuántas vueltas vas a dar.</p></div>
<div class="b-example"><script type="text/plain" class="js">
let ahorro = 0;
let semanas = 0;

while (ahorro < 10000) {
  ahorro = ahorro + 1500;
  semanas++;
}

console.log("Llegás a 10000 en", semanas, "semanas");
console.log("Ahorro final:", ahorro);
</script>
<ol class="explain">
<li>Arrancamos sin ahorro y sin semanas.</li>
<li>Mientras el ahorro sea menor a 10000, se repite el bloque.</li>
<li>Cada vuelta suma 1500 al ahorro y una semana más.</li>
<li>Cuando el ahorro llega a 10500, la pregunta da <code>false</code> y el bucle termina.</li>
</ol>
</div>
<div class="b-tip"><p><strong>Cuidado con los bucles infinitos:</strong> si la condición nunca se vuelve <code>false</code>, el bucle no termina nunca. Acá el código se corta solo a los 5 segundos, así que podés experimentar tranquilo.</p></div>
<div class="b-quiz" data-id="q4-1" data-answer="1">
<script type="text/plain" class="code">
let s = "";
for (let i = 0; i < 3; i++) {
  s += i;
}
console.log(s);
</script>
<script type="text/plain" class="opt">3</script>
<script type="text/plain" class="opt">012</script>
<script type="text/plain" class="opt">0123</script>
<script type="text/plain" class="opt">6</script>
<div class="why"><p><code>s</code> empieza siendo un texto vacío, así que <code>+=</code> pega en vez de sumar: "" + 0 + 1 + 2 da "012". El bucle se detiene antes del 3 porque la condición es <code>i &lt; 3</code>.</p></div>
</div>
<div class="b-quiz" data-id="q4-2" data-answer="2">
<script type="text/plain" class="code">
let i = 10;
while (i > 0) {
  i -= 3;
}
console.log(i);
</script>
<script type="text/plain" class="opt">0</script>
<script type="text/plain" class="opt">1</script>
<script type="text/plain" class="opt">-2</script>
<script type="text/plain" class="opt">-3</script>
<div class="why"><p>10 → 7 → 4 → 1 → -2. Con 1 la condición <code>i &gt; 0</code> todavía se cumple, así que resta una vez más.</p></div>
</div>

<h2 class="b-h">Recorrer un texto letra por letra</h2>
<div class="b-text"><p><code>for...of</code> recorre los elementos de algo, uno por uno, sin necesidad de contador. Con un texto, en cada vuelta te da una letra. En la próxima misión lo vas a usar con listas.</p></div>
<div class="b-example"><script type="text/plain" class="js">
for (const letra of "Hola") {
  console.log(letra);
}
</script>
<ol class="explain">
<li>En cada vuelta, la variable <code>letra</code> toma el siguiente carácter de "Hola": H, o, l, a.</li>
<li>Cuando no quedan letras, el bucle termina solo.</li>
</ol>
</div>

<div class="b-recap"><ul>
<li>Un bucle repite un bloque de código.</li>
<li><code>for (let i = 1; i &lt;= 5; i++)</code>: arranque, pregunta antes de cada vuelta, y paso al final de cada vuelta.</li>
<li>Patrón acumulador: variable inicial antes del bucle, se actualiza en cada vuelta, resultado al final.</li>
<li><code>while</code> repite mientras la condición sea <code>true</code>.</li>
<li><code>for...of</code> recorre los elementos de algo, uno por uno.</li>
</ul></div>

<h2 class="b-h">Desafíos</h2>
<div class="b-challenge" data-id="c4-1" data-title="Sumar hasta N">
<div class="prompt"><p>Escribí <code>sumarHasta(n)</code> que devuelva <code>1 + 2 + ... + n</code> usando un bucle. Para <code>n = 0</code> debe dar <code>0</code>.</p></div>
<script type="text/plain" class="starter">
